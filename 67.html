<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d25"><title>SIX SEVEN — Math Challenge</title><style>
:root{--bg:#100d25;--panel:#201936;--line:#51416c;--txt:#fff8fa;--muted:#c9bad9;--pink:#ff63b5;--lime:#caff5b;--violet:#b69cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#492454 0%,transparent 38%),radial-gradient(circle at 90% 35%,#283c59 0%,transparent 40%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:22px 16px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:2.2px;font-weight:900;color:var(--lime)}.chip{border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:12px;color:var(--muted)}h1{font-size:clamp(46px,12vw,85px);letter-spacing:-5px;line-height:.9;margin:35px 0 8px;font-weight:1000}.seven{color:var(--pink);text-shadow:3px 4px 0 #6b315c}.sub{color:var(--muted);line-height:1.5;font-size:15px;margin:14px 0 24px}.card{background:linear-gradient(140deg,#28203f,#1b1630);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 10px 25px #0002}.tag{display:inline-block;color:var(--lime);font-size:11px;font-weight:900;letter-spacing:1.5px}.card h2{font-size:23px;margin:10px 0 7px}.card p{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 16px}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.go{background:var(--lime);color:#161123;font-weight:900;border-radius:14px;padding:14px 20px;min-height:48px}.go.secondary{background:#40324f;color:white}.go:disabled{opacity:.45;cursor:default}.back{background:transparent;color:var(--muted);padding:12px 0}.progress{display:flex;gap:5px;margin:20px 0}.progress span{height:5px;background:#554766;border-radius:5px;flex:1}.progress span.done{background:var(--lime)}.q{font-size:clamp(30px,9vw,52px);font-weight:900;letter-spacing:-1px;margin:24px 0;text-align:center}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{background:#352a4c;color:white;border:1px solid #675477;border-radius:16px;min-height:70px;padding:12px;font-weight:800;font-size:19px}.opt:active,.opt.selected{background:#67456f}.note{margin:18px 0;padding:14px;border-radius:14px;background:#34283e;color:#f6eaff;line-height:1.45}.good{border:1px solid #caff5b}.bad{border:1px solid #ff7a9b}.grid67{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:20px 0}.cell{aspect-ratio:1;border-radius:12px;background:#33284b;color:white;font-size:clamp(18px,6vw,29px);font-weight:900;border:1px solid #665378}.cell.hit{background:var(--lime);color:#100d25}.mini{font-size:13px;color:var(--muted)}.bigNum{font-size:clamp(42px,12vw,76px);font-weight:1000;text-align:center;letter-spacing:4px;padding:25px 4px}.center{text-align:center}.counter{font-weight:900;color:var(--lime)}.footer{color:#a89ab8;font-size:12px;margin-top:30px;line-height:1.6}input[type=number]{width:100%;border:1px solid #6d5881;background:#2b2141;border-radius:14px;padding:16px;color:white;font-size:25px;text-align:center}input::placeholder{color:#9887aa}.hide{display:none!important}@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease-out}@keyframes appear{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}</style></head><body><main><div class="top"><span class="eyebrow">MATH CHALLENGE STUDIO</span><span class="chip">LEVEL 01 / 67</span></div><div id="app"></div><div class="footer">Тренажёр для практики изученных формул. Проверку техники движений проводит педагог. Результаты сохраняются только на этом устройстве, без отправки на сервер.</div></main><script>
const app=document.getElementById('app');let score=0,round=0,questions=[],answers=[],locked=false,searchTarget=0,found=0,searchStart=0,memTimer=null,memDigits='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bank=[{a:61,b:44,ans:105,tip:'Сначала старший разряд: 6 + 4 десятка — переход через сотню. Затем младший разряд: 1 + 4 — формула пятёрок. Покажи движения пальцев в правильной последовательности.'},{a:62,b:44,ans:106,tip:'Сначала старший разряд: 6 + 4 десятка — переход через сотню. Затем младший разряд: 2 + 4: +5 − 1.'},{a:73,b:34,ans:107,tip:'Сначала старший разряд: 7 + 3 десятка — переход через сотню. Затем младший разряд: 3 + 4 — проверь, какую формулу требует положение косточек.'},{a:18,b:67,ans:85,tip:'18 + 67 = 85. Проверь действия отдельно в единицах и десятках, затем покажи технику на абакусе.'},{a:64,b:23,ans:87,tip:'Сначала старший разряд: 6 + 2 десятка. Затем младший разряд: 4 + 3 — проверь формулу и положение косточек.'}];
const mistakes=[{expression:'4 + 3',claimed:'+5 − 1',right:'+5 − 2',why:'Для +3 по формуле пятёрок прибавляем 5 и вычитаем 2.'},{expression:'2 + 4',claimed:'+5 − 2',right:'+5 − 1',why:'Для +4 по формуле пятёрок прибавляем 5 и вычитаем 1.'},{expression:'6 + 4',claimed:'+10 − 6',right:'−6 + 10',why:'Для +4 по формуле десятков сначала вычитаем друга 6, затем прибавляем 10. Последовательность обязательна.'},{expression:'7 + 3',claimed:'−7 + 10',right:'−7 + 10',why:'Это правильная запись формулы десятков для +3: сначала −7, затем +10.'}];
function home(){clearTimeout(memTimer);app.innerHTML=`<h1>SIX <span class="seven">SEVEN</span><br>CHALLENGE<span style="color:var(--lime)">.</span></h1><p class="sub">Математический челлендж для тех, кто хочет считать точнее, быстрее и увереннее. Выбирай миссию!</p><div class="card"><span class="tag">01 · РАЗОГРЕВ</span><h2>Формулы: найди ошибку</h2><p>Посмотри на предложенную формулу. Верно или нет? Если нет — найди правильный вариант.</p><button class="go" onclick="startError()">Начать →</button></div><div class="card"><span class="tag">02 · ТРЕНД</span><h2>Найди 67</h2><p>Найди все числа 67 среди похожих. Скорость реакции и внимание.</p><button class="go" onclick="start67()">Играть →</button></div><div class="card"><span class="tag">03 · АБАКУС</span><h2>Два разряда — один ответ</h2><p>Считай двузначные примеры на абакусе. Сначала работай со старшим разрядом, затем с младшим. Здесь могут встретиться формулы пятёрок и десятков.</p><button class="go" onclick="startCalc()">Решать →</button></div><div class="card"><span class="tag">04 · ПАМЯТЬ</span><h2>Flash: поймай число</h2><p>Запомни число за короткое время и введи его по памяти. Каждый раунд быстрее.</p><button class="go" onclick="startMemory()">Проверить память →</button></div>`}
function shell(label,body){app.innerHTML=`<button class="back" onclick="home()">← Все миссии</button><div class="eyebrow">${label}</div>${body}`}
function startError(){round=0;score=0;showError()}
function showError(){if(round>=mistakes.length)return finish('Формулы');locked=false;let m=mistakes[round];shell('МИССИЯ 01 / НАЙДИ ОШИБКУ',`<div class="progress">${mistakes.map((_,i)=>`<span class="${i<round?'done':''}"></span>`).join('')}</div><div class="card"><p>Проверяем запись формулы для действия:</p><div class="q">${m.expression}</div><p class="center">Предложенная формула:</p><div class="q" style="color:var(--pink)">${m.claimed}</div><div class="options"><button class="opt" onclick="answerError(true)">Верно ✓</button><button class="opt" onclick="answerError(false)">Есть ошибка ✕</button></div><div id="feedback"></div></div>`)}
function answerError(v){if(locked)return;locked=true;let m=mistakes[round],ok=(m.claimed===m.right)===v;if(ok)score++;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.getElementById('feedback').innerHTML=`<div class="note ${ok?'good':'bad'}">${ok?'Верно!':'Почти!'} ${m.why}<br><b>Правильная запись: ${m.right}</b></div><button class="go" onclick="round++;showError()">Дальше →</button>`}
function start67(){score=0;found=0;searchTarget=0;let cells=Array.from({length:25},(_,i)=>i<7?'67':['76','57','69','87','66','77','97'][Math.floor(Math.random()*7)]);for(let i=cells.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}searchTarget=7;searchStart=Date.now();shell('МИССИЯ 02 / SIX SEVEN',`<div class="card"><h2>Найди все 67!</h2><p>В таблице спрятано <b>7</b> чисел 67. Нажми на каждое.</p><p>Найдено: <span id="found" class="counter">0 / 7</span></p><div class="grid67">${cells.map(v=>`<button class="cell" onclick="hit67(this,${v==='67'})">${v}</button>`).join('')}</div><div id="feedback"></div></div>`)}
function hit67(el,correct){if(el.disabled)return;if(correct){el.classList.add('hit');el.disabled=true;found++;document.getElementById('found').textContent=found+' / '+searchTarget;if(found===searchTarget){let t=((Date.now()-searchStart)/1000).toFixed(1);let old=Number(localStorage.getItem('67best')||0);if(!old||Number(t)<old)localStorage.setItem('67best',t);document.getElementById('feedback').innerHTML=`<div class="note good">Все 67 найдены за <b>${t} сек.</b> ${(!old||Number(t)<old)?'Новый личный рекорд!':'Личный рекорд: '+old+' сек.'}</div><button class="go" onclick="start67()">Ещё раунд ↻</button>`}}else{el.style.borderColor='#ff63b5';setTimeout(()=>{if(el.isConnected)el.style.borderColor=''},450)}}
function startCalc(){round=0;score=0;showCalc()}
function showCalc(){if(round>=bank.length)return finish('Два разряда');locked=false;let m=bank[round];shell('МИССИЯ 03 / АБАКУС',`<div class="progress">${bank.map((_,i)=>`<span class="${i<round?'done':''}"></span>`).join('')}</div><div class="card"><p>Реши на абакусе. Следи за пальцами, не спеши.</p><div class="q">${m.a} + ${m.b} = ?</div><form onsubmit="event.preventDefault();checkCalc()"><input id="calc" type="number" inputmode="numeric" autocomplete="off" placeholder="Твой ответ" required><div style="margin-top:14px"><button class="go" type="submit">Проверить</button></div></form><div id="feedback"></div></div>`)}
function checkCalc(){if(locked)return;let m=bank[round],val=Number(document.getElementById('calc').value),ok=val===m.ans;locked=true;if(ok)score++;document.querySelector('form button').disabled=true;document.getElementById('feedback').innerHTML=`<div class="note ${ok?'good':'bad'}">${ok?'Точно!':'Правильный ответ: '+m.ans+'.'}<br>${m.tip}<br><small>Покажи педагогу движение пальцев на абакусе.</small></div><button class="go" onclick="round++;showCalc()">Следующий пример →</button>`}
function startMemory(){round=0;score=0;nextMemory()}
function nextMemory(){clearTimeout(memTimer);if(round>=5)return finish('Flash-память');let n=round<2?3:round<4?4:5;memDigits=String(Math.floor(Math.random()*(9*10**(n-1)))+10**(n-1));let ms=[1900,1500,1300,1100,900][round];shell('МИССИЯ 04 / FLASH-ПАМЯТЬ',`<div class="card"><p>Раунд ${round+1} из 5 · Запомни число</p><div id="flash" class="bigNum">${memDigits}</div><div class="mini center">Число исчезнет через ${(ms/1000).toFixed(1)} сек.</div><div id="feedback"></div></div>`);memTimer=setTimeout(()=>{let el=document.getElementById('flash');if(!el)return;el.innerHTML=`<form onsubmit="event.preventDefault();checkMemory()"><input id="memory" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Какое число?" required><button class="go" style="margin-top:12px" type="submit">Проверить</button></form>`},ms)}
function checkMemory(){let input=document.getElementById('memory');if(!input)return;let ok=input.value===memDigits;if(ok)score++;document.getElementById('flash').innerHTML=`<div class="note ${ok?'good':'bad'}">${ok?'Верно!':'Было число: '+memDigits}</div><button class="go" onclick="round++;nextMemory()">Дальше →</button>`}
function finish(name){shell('МИССИЯ ЗАВЕРШЕНА',`<div class="card center"><div class="eyebrow">RESULT</div><h2>${esc(name)}</h2><div class="bigNum" style="color:var(--lime)">${score} / ${name==='Формулы'?mistakes.length:name==='Два разряда'?bank.length:5}</div><p>Сравни свой результат с прошлым разом. Главное — правильная техника и понимание.</p><button class="go" onclick="home()">К другим миссиям →</button></div>`)}home();
</script></body></html>
