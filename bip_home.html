<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бип потерялся! • Математический квест</title><style>
*{box-sizing:border-box}body{margin:0;color:#17344c;background:#eef6f8;font-family:Arial,sans-serif;background-image:radial-gradient(#cadfe6 1px,transparent 1px);background-size:24px 24px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:14px 23px;font-weight:bold;background:#126b93;color:white;box-shadow:0 4px 0 #084b6c}button:hover{filter:brightness(1.08)}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:4px solid #ffbc48;outline-offset:3px}.secondary{background:#e4eff3;color:#254c65;box-shadow:0 4px 0 #c3d6df}.wrap{max-width:1040px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:#df750b}.tag{font-size:12px;font-weight:bold;letter-spacing:2px;color:#527186;text-transform:uppercase}.steps{display:flex;gap:8px;margin-bottom:22px}.step{flex:1;height:7px;border-radius:8px;background:#d0e2e8}.step.on{background:#ef9a25}main{background:#fffdf8;border:2px solid white;border-radius:30px;padding:32px;box-shadow:0 16px 50px #143f5810;min-height:540px}h1{font-size:clamp(32px,5vw,55px);line-height:1.07;margin:14px 0 20px;letter-spacing:-1.7px}h2{font-size:clamp(26px,4vw,36px);margin:12px 0}p{font-size:19px;line-height:1.5}.muted{color:#597487;font-size:15px}.hero,.work{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.art{background:#e6f4f4;border-radius:26px;padding:25px;text-align:center;position:relative}.robot{width:100%;max-width:250px;overflow:visible}.hero .robot{animation:float 3s ease-in-out infinite}.pill{display:inline-block;padding:10px 15px;background:#fff0d2;border-radius:30px;color:#885008;font-size:14px;font-weight:bold}.route{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0;font-size:15px}.route span{background:#edf3f5;padding:10px;border-radius:12px}.battery{display:flex;gap:5px;padding:7px;border:3px solid #527186;border-radius:10px;max-width:220px;margin:18px auto}.battery i{height:28px;flex:1;background:#d3e1e5;border-radius:3px}.battery i.full{background:#3cb79d}.sum{font-size:38px;font-weight:bold;font-variant-numeric:tabular-nums;text-align:right;width:140px;line-height:1.3;margin:14px auto}.sum div:last-child{border-bottom:3px solid #b5ccd5;padding-bottom:10px}.answer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}input{width:130px;border:2px solid #8baab9;border-radius:14px;padding:10px;text-align:center;font-size:28px;background:white}#msg{min-height:45px;margin:12px 0;font-size:17px;font-weight:bold;color:#166e69}.hint{margin:16px 0;font-size:16px}summary{cursor:pointer;color:#406c84}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:20px auto}.tile{background:#edf5f7;border:3px solid transparent;padding:6px;box-shadow:none;position:relative;min-height:110px}.tile svg{max-height:130px}.tile.selected{border-color:#269a81;background:#d7f4e9}.tile.selected:after{content:'✓';position:absolute;right:8px;top:6px;color:#086b51;font-size:24px}.sample{display:flex;align-items:center;justify-content:center;gap:20px;background:#edf5f7;border-radius:18px;padding:10px}.sample svg{width:100px}.center{text-align:center}.maze{max-width:480px;width:100%;display:block;margin:18px auto;border-radius:20px;background:#d9eaf0}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.controls button{padding:12px;font-size:26px}.controls .up{grid-column:2}.controls .left{grid-column:1}.footer{text-align:center;font-size:12px;color:#678595;margin:20px}.finish{background:#e5f6ed}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}.stats span{padding:16px;background:white;border-radius:16px}.badge{font-size:60px}.hidden{display:none}@keyframes float{50%{transform:translateY(-8px)}}@media(max-width:650px){.wrap{padding:12px}main{padding:21px 15px;border-radius:22px}.hero,.work{grid-template-columns:1fr;gap:14px}.hero .art{order:-1;padding:12px}.hero .robot{max-height:180px}.work .art{display:none}.grid{gap:7px;grid-template-columns:repeat(3,1fr)}.tile{min-height:100px}header{margin-bottom:15px}.brand{font-size:16px}p{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="wrap"><header><div class="brand">БИП<span> / </span>ДОРОГА ДОМОЙ</div><span class="tag">мини-квест</span></header><div class="steps" aria-label="Прогресс"><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div></div><main id="app"></main><div class="footer">Сила интеллекта • Ментальная арифметика • Екатерина Куклева</div></div>
<script>
const examples=[[80,-50,30,3],[17,-5,23,23],[20,3,30,2],[64,12,-51,34],[23,31,21,-15],[24,31,20,-15],[32,22,30,-62],[42,32,12,-75],[40,20,35,-60],[41,15,22,-67]];
let stage=0,index=0,solved=0,firstTry=0,attempted=false,found=new Set(),pos=[1,1],finished=false;
const app=document.getElementById('app');
function robot(v=0){return `<svg class="robot" viewBox="0 0 180 210" xmlns="http://www.w3.org/2000/svg" aria-label="Робот Бип"><ellipse cx="90" cy="198" rx="60" ry="9" fill="#b4d2d9"/><g stroke="#2f5770" stroke-width="4" stroke-linejoin="round"><path d="M90 36V17"/><${v===1?'rect x="82" y="4" width="16" height="16"':'circle cx="90" cy="12" r="8"'} fill="#f8ad36"/><rect x="29" y="45" width="122" height="84" rx="27" fill="#f5fbff"/><rect x="15" y="69" width="15" height="35" rx="7" fill="#ee9a34"/><rect x="151" y="69" width="15" height="35" rx="7" fill="#ee9a34"/><rect x="42" y="58" width="96" height="58" rx="18" fill="#173c53"/>${v===2?'<rect x="56" y="72" width="15" height="15" rx="2" fill="#63dbff"/><rect x="109" y="72" width="15" height="15" rx="2" fill="#63dbff"/>':'<circle cx="65" cy="80" r="10" fill="#63dbff"/><circle cx="115" cy="80" r="10" fill="#63dbff"/>'}<path d="M81 99q9 7 18 0" fill="none" stroke="#a0e9ff" stroke-width="3"/><rect x="48" y="129" width="84" height="49" rx="18" fill="#edfaff"/><path d="M44 142L28 165M136 142l16 23" stroke-width="13"/><rect x="47" y="176" width="34" height="20" rx="8" fill="#5b9eb9"/><rect x="99" y="176" width="34" height="20" rx="8" fill="#5b9eb9"/>${v===3?'<path d="M90 138l11 19H79z" fill="#ee9a34"/>':`<circle cx="90" cy="151" r="10" fill="${v===4?'#a38ae2':'#ee9a34'}"/>`}</g></svg>`}
function progress(n){document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('on',i<n))}
function battery(){return '<div class="battery">'+Array.from({length:5},(_,i)=>`<i class="${i<solved?'full':''}"></i>`).join('')+'</div>'}
function intro(){stage=0;progress(0);app.innerHTML=`<div class="hero"><div><span class="pill">Приключение на абакусе</span><h1>Бип потерялся!</h1><p>Привет! Я Бип. Моя батарейка почти разрядилась, а до дома ещё далеко. Поможешь?</p><div class="route"><span>🔋 Заряди</span><span>🔎 Найди</span><span>🔑 Открой</span><span>🏠 Проведи</span></div><button onclick="start()">Помочь Бипу →</button><p class="muted">Приготовь абакус. Считай спокойно, спешить не нужно.</p></div><div class="art">${robot()}${battery()}<span class="pill">Нужна твоя помощь!</span></div></div>`}
function start(){stage=1;math()}
function math(){progress(stage===1?1:3);attempted=false;const n=index%5+1;app.innerHTML=`<span class="tag">${stage===1?'01 / Зарядная станция':'03 / Секретный ключ'} • пример ${n} из 5</span><h2>${stage===1?'Заряди батарейку':'Собери ключ от гаража'}</h2><p>Реши пример на абакусе. Впиши ответ.</p><div class="work"><div class="art">${robot()}${battery()}<p class="muted">${stage===1?'Каждый ответ даёт заряд.':'Ещё немного, и ключ будет наш!'}</p></div><div class="center"><div class="sum">${examples[index].map((n,i)=>`<div>${i&&n>0?'+':''}${n<0?'−'+Math.abs(n):n}</div>`).join('')}</div><div class="answer"><input id="ans" aria-label="Ответ" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();verifyAnswer()}" pattern="[0-9]+" required><button type="button" id="check" onclick="verifyAnswer()">Проверить</button></div><div id="msg" role="status" aria-live="polite"></div><button id="next" class="hidden" onclick="next()">Дальше →</button><details class="hint"><summary>Вспомнить формулу</summary><p>+3 = +5 − 2</p><p class="muted">Если трёх единиц не хватает: прибавь 5, затем убери 2. В десятках: +30 = +50 − 20.</p></details></div></div>`}
function verifyAnswer(){let a=document.getElementById('ans');if(a.disabled)return;const total=examples[index].reduce((a,b)=>a+b,0);if(a.value.trim()!==''&&Number(a.value)===total){if(!attempted)firstTry++;solved++;a.disabled=true;document.getElementById('check').disabled=true;document.getElementById('msg').textContent=stage===1?'Верно! Батарейка заряжается.':'Верно! Ещё одна часть ключа готова.';document.getElementById('next').classList.remove('hidden');const b=document.querySelector('.battery');if(b)b.outerHTML=battery()}else{attempted=true;document.getElementById('msg').textContent='Попробуй ещё раз. Обнули абакус и пересчитай.';a.select()}}
function next(){index++;if(index===5){stage=2;attention()}else if(index===10){stage=4;maze()}else math()}
const variants=[1,0,2,3,4,1,0,2,3,4,0,2];
function attention(){progress(2);app.innerHTML=`<span class="tag">02 / Роботы-двойники</span><h2>Найди трёх таких же роботов</h2><p>Сравни антенну, глаза и кнопку на животе.</p><div class="sample">${robot()}<div><b>Это наш Бип</b><p class="muted">Найди все точные копии.</p></div></div><div class="grid">${variants.map((v,i)=>`<button class="tile" aria-label="Робот ${i+1}" aria-pressed="false" onclick="pick(${i},this)">${robot(v)}</button>`).join('')}</div><div id="msg" class="center" role="status">Найдено: 0 из 3</div><div class="center"><button id="next" class="hidden" onclick="stage=3;math()">За ключом →</button></div>`}
function pick(i,b){if(found.has(i))return;if(variants[i]===0){found.add(i);b.classList.add('selected');b.setAttribute('aria-pressed','true');document.getElementById('msg').textContent=found.size===3?'Все три найдены! Отличная работа.':`Найдено: ${found.size} из 3`;if(found.size===3)document.getElementById('next').classList.remove('hidden')}else document.getElementById('msg').textContent='Похож! Но есть отличие. Сравни с образцом.'}
// 0 = проход, 1 = стена. Маршрут проверяется отдельно.
const map=['1111111111111','1000001000001','1011101011101','1000100010001','1110111110101','1000100000101','1011101111101','1000001000001','1011111011101','1000000010001','1111111111101'];
function maze(){progress(4);app.innerHTML=`<span class="tag">04 / Последний поворот</span><h2>Проведи Бипа домой</h2><p>Ключ у нас! Найди дорогу к гаражу. Стены обходи.</p><svg id="maze" class="maze" viewBox="0 0 520 440" role="img" aria-label="Лабиринт: робот вверху слева, гараж внизу справа"></svg><div class="controls"><button class="up" aria-label="Вверх" onclick="move(0,-1)">↑</button><button class="left" aria-label="Влево" onclick="move(-1,0)">←</button><button aria-label="Вниз" onclick="move(0,1)">↓</button><button aria-label="Вправо" onclick="move(1,0)">→</button></div><p id="msg" class="center" role="status">Нажимай стрелки здесь или на клавиатуре.</p>`;draw()}
function draw(){let s='';map.forEach((r,y)=>[...r].forEach((v,x)=>{s+=`<rect x="${x*40+2}" y="${y*40+2}" width="36" height="36" rx="7" fill="${v==='1'?'#27566f':'#f6fcfd'}"/>`}));s+='<rect x="442" y="402" width="36" height="36" rx="6" fill="#f7af39"/><text x="460" y="429" text-anchor="middle" font-size="27">⌂</text>';s+=`<g transform="translate(${pos[0]*40},${pos[1]*40})"><rect x="5" y="6" width="30" height="28" rx="10" fill="#f5fbff" stroke="#147f9f" stroke-width="2"/><rect x="9" y="12" width="22" height="14" rx="5" fill="#173c53"/><circle cx="15" cy="18" r="3" fill="#63dbff"/><circle cx="25" cy="18" r="3" fill="#63dbff"/></g>`;document.getElementById('maze').innerHTML=s}
function move(dx,dy){if(stage!==4||finished)return;let x=pos[0]+dx,y=pos[1]+dy;if(map[y]?.[x]!=='0'){document.getElementById('msg').textContent='Здесь стена. Поищем другой путь!';return}pos=[x,y];draw();document.getElementById('msg').textContent='Продолжай, Бип идёт за тобой.';if(x===11&&y===10){finished=true;win()}}
document.addEventListener('keydown',e=>{const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(stage===4&&dirs[e.key]){e.preventDefault();move(...dirs[e.key])}});
function win(){stage=5;app.classList.add('finish');app.innerHTML=`<div class="center"><span class="pill">Миссия выполнена!</span><h1>Ура, Бип дома!</h1><div style="max-width:200px;margin:auto">${robot()}</div><p>Спасибо за помощь! Теперь я могу отдохнуть<br>в своём уютном гараже.</p><div class="stats"><span>🔋 10 примеров решено</span><span>🔎 3 двойника найдены</span><span>🏠 Путь пройден</span></div><p class="muted">Можно показать этот экран педагогу.</p><details><summary>Результат тренировки</summary><p>С первой попытки: ${firstTry} из 10.<br>Все примеры доведены до верного ответа.</p></details><p><button onclick="restart()">Сыграть ещё раз</button></p></div>`}
function restart(){index=0;solved=0;firstTry=0;found=new Set();pos=[1,1];finished=false;app.classList.remove('finish');intro()}intro();
</script></body></html>
