function maze(){

 let grid=Array.from({length:H},()=>Array(W).fill(1));

 while(stack.length){let [x,y]=stack[stack.length-1];let next=[];
  for(let [dx,dy] of [[0,-2],[2,0],[0,2],[-2,0]]){let nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&grid[ny][nx])next.push([nx,ny,dx,dy])}
  if(!next.length){stack.pop();continue}
  let [nx,ny,dx,dy]=next[Math.floor(rnd()*next.length)];grid[y+dy/2][x+dx/2]=0;grid[ny][nx]=0;stack.push([nx,ny]);
 }
 // Добавляем несколько циклов, чтобы выбор маршрута не сводился к одному коридору.
 for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){

   let vertical=grid[y-1][x]===0&&grid[y+1][x]===0;
   if(horizontal||vertical)grid[y][x]=0;
  }
 }
 const start=1*W+1,end=(H-2)*W+(W-2);
 let pos=start,visited=new Set([pos]),seconds=300,done=false,timeout=false,attempt=1,showTrail=false;

   `<div style="display:grid;grid-template-columns:repeat(${W},minmax(0,1fr));gap:1px;max-width:900px;width:100%;background:#273966;padding:5px;border-radius:12px;touch-action:manipulation">${cells}</div>`+
   `<div style="margin-top:12px"><button class="btn alt" onclick="mazeTrail()">${showTrail?"Скрыть":"Показать"} пройденный путь</button></div><div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px"><button class="btn alt" onclick="move(-${W})">↑</button><button class="btn alt" onclick="move(-1)">←</button><button class="btn alt" onclick="move(${W})">↓</button><button class="btn alt" onclick="move(1)">→</button></div>`+
   `<p class="status" id="mazemsg">${done?'Рубильник найден! Блокополис снова светится!':timeout?'Пять минут истекли. Миссия завершена, но можно попробовать лабиринт ещё раз.':'Двигайся стрелками на клавиатуре или кнопками под полем.'}</p>`+
   `<button class="btn alt" onclick="mazeRestart()">↻ Повторить лабиринт</button><button class="btn" onclick="go(${step+1})">Завершить миссию →</button>`;
 }
 window.move=d=>{if(done||timeout)return;let n=pos+d;
  if(n<0||n>=W*H||(d===1&&pos%W===W-1)||(d===-1&&pos%W===0))return;
  if(grid[Math.floor(n/W)][n%W]===0){pos=n;visited.add(n);
   if(pos===end){done=true;stop();records.maze={result:'Пройден',seconds:300-seconds,attempt};save()}
   draw();
  }
 };
 function run(){stop();interval=setInterval(()=>{if(done||timeout)return;seconds=Math.max(0,seconds-1);
  if($('mazetime'))$('mazetime').textContent='⏳ '+fmt(seconds);
  if(seconds===0){timeout=true;stop();records.maze={result:'Время вышло',seconds:300,attempt};save();draw()}
 },1000)}
 window.mazeTrail=()=>{showTrail=!showTrail;draw()};
 window.mazeRestart=()=>{attempt++;pos=start;visited=new Set([start]);seconds=300;done=false;timeout=false;draw();run()};
 window.addEventListener('keydown',e=>{if(STAGES[step]==='maze'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
  e.preventDefault();move({ArrowUp:-W,ArrowDown:W,ArrowLeft:-1,ArrowRight:1}[e.key])
 }});
 draw();run();
}
function finish(){
 stop();let keys=MODE==='урок'?['calc0','calc1','calc2']:['calc0','calc1'];
 let names=MODE==='урок'?PLAYERS:['Ученик'];
 let rows=names.map((name,j)=>{
  let correct=0,wrong=0,blank=0;
  keys.forEach(k=>{let r=records[k]||{};let len=DATA[Number(k.slice(-1))].cols.length;
   let arr=r.answers?.[j]||[];
   for(let i=0;i<len;i++){let raw=String(arr[i]??'').trim(),sum=DATA[Number(k.slice(-1))].cols[i].reduce((a,b)=>a+b,0);
    if(raw==='')blank++;else if(Number(raw)===sum)correct++;else wrong++;
   }
  });return{name,correct,wrong,blank,total:correct+wrong+blank};
 });
 let seconds=keys.reduce((s,k)=>s+(records[k]?.seconds||0),0);
 let tbl=`<div class="answergrid"><table><thead><tr><th>Участник</th><th>Правильно</th><th>Неправильно</th><th>Пропущено</th><th>Всего</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.name}</b></td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.blank}</td><td>${r.total}</td></tr>`).join('')}</tbody></table></div>`;
 let times=keys.map(k=>`${DATA[Number(k.slice(-1))].title}: ${fmt(records[k]?.seconds||0)}`).join('<br>');
 let stroop=records.stroop?`<p><b>Тест Струпа:</b> ${records.stroop.correct} верно, ${records.stroop.wrong} ошибок, ${fmt(records.stroop.seconds||0)}</p>`:'';
 $('app').innerHTML=heading('🌟 Блокополис снова светится!','Брик благодарит команду. Это результаты именно этой попытки.')+tbl+`<div class="note" id="finalreport"><b>Время счёта (общее для команды):</b> ${fmt(seconds)}<br>${times}${stroop}${records.maze?'<br>Лабиринт: '+(typeof records.maze==='object'?records.maze.result+' · '+fmt(records.maze.seconds)+' · попытка '+records.maze.attempt:records.maze):''}</div><button class="btn" onclick="copyReport()">Скопировать подробный отчёт</button><button class="btn alt" onclick="if(confirm('Начать миссию заново?')){records={};go(0)}">↻ Новая попытка</button>`;
 window.copyReport=()=>{let s='Блокополис. Урок №36\n'+rows.map(r=>`${r.name}: правильно ${r.correct}, неправильно ${r.wrong}, пропущено ${r.blank}, всего ${r.total}`).join('\n')+`\nВремя счёта команды: ${fmt(seconds)}\n`+keys.map(k=>`${DATA[Number(k.slice(-1))].title}: ${fmt(records[k]?.seconds||0)}`).join('\n')+(records.stroop?`\nСтруп: ${records.stroop.correct} верно, ${records.stroop.wrong} ошибок, ${fmt(records.stroop.seconds)}`:'');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s);else prompt('Скопируй результат',s)};
}
render();</script></body></html>
