<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Формулы • Плюс и минус</title><style>
:root{font-family:Arial,sans-serif;color:#173347;background:#eff7f8}*{box-sizing:border-box}body{margin:0}header{max-width:1060px;margin:auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:2px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:15px 22px;background:#076c79;color:white;font-weight:700}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:default}.sub{background:#e0edef;color:#173347}.wrap{max-width:1000px;margin:auto;padding:16px 24px 50px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#537981}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-2px;margin:15px 0}p{line-height:1.6;color:#52717b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dbe8ea;border-radius:25px;padding:30px;box-shadow:0 12px 30px #244a5510}.mode{min-height:230px;text-align:left;color:#173347;background:white;font-weight:normal}.mode h2{font-size:32px}.badge{display:inline-block;padding:9px 13px;border-radius:10px;background:#e4f4ee;color:#19775b;font-size:13px}.big{font-size:64px;color:#087c86}.orange{color:#dd7744}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.toolbar label{font-size:14px}.progress{height:7px;background:#dce9ea;border-radius:9px;margin:22px 0}.progress i{display:block;height:100%;background:#0d8992;border-radius:9px}.exercise{text-align:center;padding:35px 12px}.example{font-size:42px;font-weight:bold;margin:15px}.formula{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;font-size:clamp(28px,5vw,48px);margin:25px 0}.formula input{width:85px;font-size:inherit;text-align:center;border:2px solid #07858e;background:#f0faf9;border-radius:12px;padding:8px;color:#123949}.feedback{min-height:50px;font-weight:bold;padding:10px}.good{color:#197b57}.bad{color:#af522b}.muted{font-size:13px;color:#67818b}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats>div{background:#edf6f6;border-radius:14px;padding:18px;flex:1;min-width:140px}.stats strong{font-size:28px;display:block}li{line-height:1.8}details{margin:20px 0}footer{font-size:12px;color:#6e8990;margin-top:35px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px}.example{font-size:34px}header{padding:20px}.wrap{padding:10px 16px}.formula{gap:5px}}@media print{header button,.actions,.toolbar,footer{display:none}body{background:white}.card{box-shadow:none}}
</style><header><b>ФОРМУЛЫ / 34</b><button class="sub" id="home">К режимам</button></header><main class="wrap" id="app"></main><script>
const $=s=>document.querySelector(s),app=$('#app');let mode,items=[],idx=0,wrong=false,results=[],start=0,elapsed=0,phase='home',chain=1,chainStart=0,chainRows=[],last=null;
const signed=n=>(n<0?'−':'+')+Math.abs(n),fmt=ms=>{let s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function bank(sign){let a=[];for(let n=1;n<=4;n++)a.push({n:sign*n,rhs:sign===1?[-(5-n),5]:[-5,5-n],base:sign===1?4:5,group:'Через 5'});for(let n=1;n<=9;n++)a.push({n:sign*n,rhs:sign===1?[-(10-n),10]:[-10,10-n],base:sign===1?9:10,group:'Через 10'});for(let n=6;n<=9;n++)a.push({n:sign*n,rhs:sign===1?[n-5,-5,10]:[-10,5,-(n-5)],base:sign===1?5:14,group:'Смешанные'});return a}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){phase='home';app.innerHTML=`<div class="eyebrow">Абакус · техника · точность</div><h1>Сначала формула.<br>Потом движение.</h1><p>Восстанови 17 формул, покажи примеры на абакусе и переходи к разминке.</p><div class="toolbar"><label><input type="checkbox" id="mix" checked> Перемешивать формулы</label><label><input type="checkbox" id="clock" checked> Показывать время</label></div><div class="grid"><button class="card mode" onclick="begin(1)"><span class="big">+</span><h2>Сложение</h2><span class="badge">17 формул</span><p>Через 5, через 10 и смешанные случаи</p></button><button class="card mode" onclick="begin(-1)"><span class="big orange">−</span><h2>Вычитание</h2><span class="badge">17 формул</span><p>От формулы к уверенным движениям</p></button></div><p class="muted">На уроке педагог может вводить ответы при демонстрации экрана. Дома можно проходить самостоятельно. Имена не требуются.</p>${last?'<button class="sub" onclick="summary()">Последний результат</button>':''}<footer>Скорость заполнения формул и скорость счета учитываются отдельно. Движения на реальном абакусе проверяет педагог или сам ученик.</footer>`}
let showTime=true;
function begin(s){mode=s;showTime=$('#clock').checked;let mix=$('#mix').checked;items=bank(s);if(mix)shuffle(items);items=items.map((x,i)=>({...x,gap:Math.floor(Math.random()*(x.rhs.length+1))}));idx=0;results=[];chainRows=[];elapsed=0;draw()}
function draw(){phase='question';wrong=false;let x=items[idx],terms=[x.n,...x.rhs];app.innerHTML=`<div class="eyebrow">${mode===1?'Сложение':'Вычитание'} · ${x.group}</div><div class="toolbar"><span class="badge">Формула ${idx+1} из 17</span>${showTime?'<span id="timer">0:00</span>':''}</div><div class="progress"><i style="width:${idx/17*100}%"></i></div><section class="card exercise"><div class="muted">Посмотри на пример</div><div class="example">${x.base} ${signed(x.n)}</div><p>Впиши пропущенное число. Знак уже указан.</p><form id="answerForm"><div class="formula">${terms.map((v,i)=>`${i===1?'<span>=</span>':''}<span>${i===x.gap?(v<0?'−':'+')+'<input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="Пропущенное число">':signed(v)}</span>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="check">Проверить</button><button type="button" class="sub" id="hint">Подсказка</button></div></form></section>`;start=performance.now();$('#answerForm').onsubmit=e=>{e.preventDefault();check()};$('#hint').onclick=()=>{wrong=true;$('#feedback').className='feedback';$('#feedback').textContent='Подсказка: '+signed(x.n)+' = '+x.rhs.map(signed).join(' ')+'. Повтори и введи пропущенное число.'};$('#answer').focus()}
function check(){if(phase!=='question')return;let el=$('#answer'),v=el.value.trim();if(!/^\d+$/.test(v)){$('#feedback').textContent='Введи только число, без знака.';return}let x=items[idx],ok=Number(v)===Math.abs([x.n,...x.rhs][x.gap]);if(!ok){wrong=true;$('#feedback').className='feedback bad';$('#feedback').textContent='Пока не совпало. Проверь формулу и попробуй еще раз.';el.select();return}elapsed+=performance.now()-start;results.push({x,first:!wrong});phase='movement';el.disabled=true;$('#feedback').className='feedback good';$('#feedback').textContent='Верно! Теперь выполни пример на абакусе и объясни движения.';$('.actions').innerHTML='<button type="button" id="next">Пример выполнен →</button>';$('#next').onclick=()=>{idx++;idx<17?draw():formulaDone()}}
function formulaDone(){phase='between';app.innerHTML=`<div class="eyebrow">Первый этап завершен</div><h1>Формулы повторены</h1><div class="card"><div class="stats"><div><strong>${results.filter(x=>x.first).length}/17</strong>с первой попытки</div><div><strong>${fmt(elapsed)}</strong>время заполнения</div></div><p>Время объяснения и показа движений не включено. Теперь отдельно измерим разминку на абакусе.</p><button onclick="chain=1;chainView()">Перейти к разминке</button> <button class="sub" onclick="finish()">Завершить без разминки</button></div>`}
function chainView(){phase='chainReady';let s=mode===1?0:chain*10,target=mode===1?chain*10:0;app.innerHTML=`<div class="eyebrow">Разминка на абакусе · ${mode===1?'Плюс':'Минус'}</div><h1>Цепочка ${chain} из 9</h1><section class="card exercise"><span class="badge">10 действий</span><div class="example">Начни с ${s}</div><div class="formula">${signed(mode*chain)} каждый раз</div><p>Нажми «Начать», считай на абакусе и после десятого действия нажми «Готово».</p><div class="feedback" id="chainFeedback"></div><div class="actions"><button id="go">Начать</button></div></section>`;$('#go').onclick=()=>{phase='chainRunning';chainStart=performance.now();$('.actions').innerHTML='<button id="stop">Готово</button>';$('#stop').onclick=()=>{let t=performance.now()-chainStart;phase='chainCheck';$('#chainFeedback').textContent=`Время: ${fmt(t)}. На абакусе должно быть ${target}.`;$('.actions').innerHTML='<button id="yes">Совпало</button><button class="sub" id="no">Нужно исправить</button>';$('#yes').onclick=()=>recordChain(t,true);$('#no').onclick=()=>recordChain(t,false)}}}
function recordChain(t,ok){chainRows.push({n:chain,t,ok});if(!ok){$('#chainFeedback').textContent='Повтори эту цепочку спокойно. При затруднении попроси педагога проверить движения.';$('.actions').innerHTML='<button onclick="chainView()">Повторить цепочку</button>';return}chain++;chain<=9?chainView():finish()}
function finish(){last={mode,results,elapsed,chainRows};try{localStorage.setItem('formula34-last',JSON.stringify(last))}catch{}summary()}
function summary(){phase='summary';let r=last;if(!r)return home();let misses=r.results.filter(x=>!x.first),n=r.results.length,correct=n-misses.length;app.innerHTML=`<div class="eyebrow">${r.mode===1?'Сложение':'Вычитание'} · результат</div><h1>${misses.length?'Повторение засчитано':'Отличная работа!'}</h1><section class="card"><div class="stats"><div><strong>${correct}/${n}</strong>с первой попытки · ${Math.round(correct/n*100)}%</div><div><strong>${fmt(r.elapsed)}</strong>заполнение формул</div><div><strong>${fmt(r.chainRows.reduce((s,x)=>s+x.t,0))}</strong>разминка на абакусе</div></div><p>${misses.length?'Формулы для повторения (ошибки или подсказки):':'Все формулы восстановлены без ошибок и подсказок.'}</p><ul>${misses.map(({x})=>`<li>${x.base} ${signed(x.n)}: <b>${signed(x.n)} = ${x.rhs.map(signed).join(' ')}</b></li>`).join('')}</ul><details><summary>Результаты цепочек · самопроверка</summary>${r.chainRows.length?r.chainRows.map(x=>`<p>${signed(r.mode*x.n)} · ${fmt(x.t)} · ${x.ok?'совпало':'повтор'}</p>`).join(''):'<p>Разминка не выполнялась.</p>'}</details><p class="muted">Правильность движений на абакусе не проверяется автоматически. Сравнивай время при одинаковых условиях и правильной технике.</p><div class="actions"><button onclick="home()">Выбрать режим</button><button class="sub" onclick="window.print()">Сохранить результат / печать</button></div></section>`}
setInterval(()=>{if(phase==='question'&&$('#timer'))$('#timer').textContent=fmt(elapsed+performance.now()-start);if(phase==='chainRunning'&&showTime)$('#chainFeedback').textContent=fmt(performance.now()-chainStart)},200);$('#home').onclick=()=>{if(['question','movement','chainRunning','chainReady','chainCheck','between'].includes(phase)&&!confirm('Вернуться к режимам? Текущая попытка не сохранится.'))return;home()};try{last=JSON.parse(localStorage.getItem('formula34-last'))}catch{}home();
</script></html>
