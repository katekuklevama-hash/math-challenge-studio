}

function render(){if(phase===0){app.innerHTML=`<div class="eyebrow">ТВОЯ ДОМАШНЯЯ МИССИЯ</div><h2>Котик ждёт тебя! 🐱</h2><p>Три испытания подряд: абакус, цветовой детектив и сказка с секретом. У каждого испытания свой таймер, а в конце — твой личный результат.</p><div class="grid3"><div class="tile">🧮<br>Абакус</div><div class="tile">🧠<br>Внимание</div><div class="tile">🎨<br>Раскраска</div></div><p class="note">Подготовь абакус и проходи задания самостоятельно. Не спеши в ущерб точности!</p><label><b>Как тебя зовут?</b><br><input id="player" placeholder="Полина или Эмилия" maxlength="35" style="width:100%;max-width:350px;padding:13px;border:2px solid #e6d4e0;border-radius:13px;font-size:18px;margin-top:8px"></label><div class="actions"><button class="btn" id="start">Начать челлендж →</button></div>`;document.getElementById('start').onclick=()=>{let n=document.getElementById('player').value.trim();if(!n){document.getElementById('player').focus();return}window.playerName=n;phase=1;startTimer();render()};return}
if(phase===1){const pending=sums.map((_,i)=>i).filter(i=>!abSolved.has(i));app.innerHTML=stageHeader('Абакус: 10 примеров 🧮','Решай столбики на настоящем абакусе. После проверки исправь ошибки — к следующему испытанию перейдёшь только после 10 правильных ответов.')+`<div class="statline"><span>Решено правильно: ${abSolved.size}/10</span><span>Неверных попыток: ${mistakes[0]}</span></div>${abFirst===null?'':`<div class="abFirst">Результат первой проверки: ${abFirst}/10. ${pending.length?'Пересчитай отмеченные столбики.':'Все ошибки исправлены!'}</div>`}<div class="numGrid">${sums.map((nums,i)=>`<div class="example ${abSolved.has(i)?'good':abCheckCount?'bad':''}" id="ex${i}"><strong>№ ${i+1} ${abSolved.has(i)?'✓':''}</strong><div class="nums">${nums.join('<br>')}</div>${abSolved.has(i)?'<div style="font-size:24px;font-weight:900;color:#16804b">'+nums.reduce((a,b)=>a+b,0)+'</div>':`<input aria-label="Ответ на пример ${i+1}" inputmode="numeric" type="number" id="ans${i}" value="${abacusAnswers[i]}">`}</div>`).join('')}</div><div id="abFeedback" class="feedback" aria-live="polite">${abSolved.size===10?'Все 10 ответов верные! Можно двигаться дальше.':''}</div><div class="actions">${pending.length?'<button class="btn" id="checkAb">Проверить ответы</button>':'<button class="btn" id="abNext">Следующее испытание →</button>'}</div>`;
for(const i of pending){document.getElementById('ans'+i).oninput=e=>abacusAnswers[i]=e.target.value}
if(pending.length){document.getElementById('checkAb').onclick=()=>{if(pending.some(i=>abacusAnswers[i].trim()==='')){document.getElementById('abFeedback').textContent='Заполни все оставшиеся ответы.';return}abCheckCount++;let newSolved=0;for(const i of pending){const good=Number(abacusAnswers[i])===sums[i].reduce((a,b)=>a+b,0);if(good){abSolved.add(i);correct[0]++;newSolved++}else{mistakes[0]++;abacusAnswers[i]=''}}if(abFirst===null)abFirst=newSolved;render();if(abSolved.size!==10){document.getElementById('abFeedback').textContent=`Верно! Исправь ещё ${10-abSolved.size} ${10-abSolved.size===1?'пример':'примеров'}.`}}}else{document.getElementById('abNext').onclick=nextStage}return}
if(phase===2){let item=colorRounds[round];app.innerHTML=stageHeader('Цветовой детектив 🔎','Называй не слово, а ЦВЕТ его букв. Выбирай нужную кнопку как можно быстрее.')+`<div class="statline"><span>Раунд ${round+1} / ${colorRounds.length}</span><span>Верно: ${correct[1]} · Ошибок: ${mistakes[1]}</span></div><div class="bar"><div class="fill" style="width:${round/colorRounds.length*100}%"></div></div><div class="wordbox" style="color:${palette[item[1]]}">${item[0]}</div><div class="colors">${palette.map((color,i)=>`<button class="colorbtn" data-color="${i}" style="background:${color}" aria-label="${names[i]}">${names[i]}</button>`).join('')}</div><div class="feedback" id="colorFeedback" aria-live="polite">Выбери цвет букв.</div>`;app.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{let chosen=Number(b.dataset.color);if(chosen===item[1]){correct[1]++;round++;if(round===colorRounds.length){nextStage()}else render()}else{mistakes[1]++;document.getElementById('colorFeedback').textContent='Не тот цвет. Попробуй ещё раз!';document.getElementById('colorFeedback').className='feedback err'}});return}
if(phase===3){
const done=paintDone.size;
const tasks=PAINT_TASKS;
const current=tasks[done];
app.innerHTML=stageHeader('Раскраска с секретом 🎨','Реши 9 примеров на абакусе, собери все звёздочки и открой волшебную картинку!')+
`<div class="statline"><span>⭐ Звёздочек: ${done} из ${tasks.length}</span><span>Неверных попыток: ${mistakes[2]}</span></div>
<div class="secretGrid"><div class="secretPicture"><img id="secretArt" src="${paintingRevealed?ART_COLOR:ART_BW}" alt="Принцесса, лягушонок и сказочный замок — раскраска с секретом"><div class="secretCaption" id="revealCaption">${paintingRevealed?'✨ Секрет раскрыт! Сказка ожила!':'🌟 Собери 9 звёздочек, чтобы увидеть волшебные цвета'}</div></div>
<div class="secretControls" id="revealControls">${done<tasks.length?`<div class="eyebrow">ЗАДАНИЕ ${done+1} ИЗ ${tasks.length}</div><div class="starProgress">${Array.from({length:tasks.length},(_,i)=>i<done?'⭐':'☆').join(' ')}</div><div class="equation">${current.eq} = ?</div><label for="paintAnswer" class="small">Введи ответ:</label><input type="number" inputmode="numeric" id="paintAnswer" placeholder="Твой ответ" autocomplete="off"><div class="feedback" id="paintFeedback" aria-live="polite">Решай внимательно, можно пользоваться абакусом.</div><button class="btn" id="paintCheck">Проверить ответ</button>`:paintingRevealed?`<h3>Волшебство получилось! ✨</h3><p>Все примеры решены!</p><button class="btn" id="finishPaint">Посмотреть мой результат →</button>`:`<div class="starProgress">⭐⭐⭐⭐⭐⭐⭐⭐⭐</div><h3>Все звёздочки собраны! 🎉</h3><p>Ты решила все девять примеров. Готова узнать, какие цвета спрятаны в сказке?</p><button class="btn" id="revealArt">✨ Раскрыть секрет!</button>`}</div></div>`;
if(done===tasks.length){if(paintingRevealed)document.getElementById('finishPaint').onclick=nextStage;else document.getElementById('revealArt').onclick=artReveal;return}
const check=()=>{const input=document.getElementById('paintAnswer');const val=input.value.trim();const msg=document.getElementById('paintFeedback');if(!val){msg.textContent='Сначала введи ответ.';return}if(Number(val)!==current.ans){mistakes[2]++;msg.textContent='Пока неверно. Пересчитай пример и попробуй снова.';msg.className='feedback err';return}
paintDone.add(done);correct[2]++;
if(paintDone.size===tasks.length){stageTimes[2]=Math.floor((Date.now()-stageStart)/1000);stageStart=0;}
render();};
document.getElementById('paintCheck').onclick=check;
document.getElementById('paintAnswer').onkeydown=e=>{if(e.key==='Enter')check()};
return}
if(phase===4){const total=stageTimes.reduce((a,b)=>a+b,0);const ok=correct.reduce((a,b)=>a+b,0);const bad=mistakes.reduce((a,b)=>a+b,0);
app.innerHTML=`<div class="eyebrow">МИССИЯ ВЫПОЛНЕНА</div><h2>Челлендж пройден! 🎉</h2><div class="score">${fmt(total)}<div class="small">Общее время</div></div><div class="resultcard" id="resultCard"><h3>💗 SIX SEVEN — HOME EDITION</h3><p><b>Участница:</b> ${escapeHtml(window.playerName)}</p><p>🧮 Абакус: <b>${fmt(stageTimes[0])}</b> · с первой проверки ${abFirst}/10 · после исправлений 10/10</p><p>🔎 Цветовой детектив: <b>${fmt(stageTimes[1])}</b> · ${correct[1]}/20</p><p>🎨 Раскраска: <b>${fmt(stageTimes[2])}</b> · ${correct[2]}/${PAINT_TASKS.length}</p><hr><p><b>Общее время: ${fmt(total)}</b></p><p>Правильных действий: ${ok} · Неверных попыток: ${bad}</p></div><p class="muted small">Неверные попытки включают ошибки первой проверки абакуса и неправильные нажатия в других заданиях.</p><div class="actions"><button class="btn" id="share">📤 Показать результат педагогу</button><button class="btn secondary" id="restart">Пройти ещё раз</button></div><p class="small muted" id="shareFeedback"></p>`;
document.getElementById('share').onclick=async()=>{let msg=`SIX SEVEN — HOME EDITION\nУченица: ${window.playerName}\nАбакус: ${fmt(stageTimes[0])}, с первой проверки ${abFirst}/10, после исправлений 10/10\nЦветовой детектив: ${fmt(stageTimes[1])}, ${correct[1]}/20\nРаскраска: ${fmt(stageTimes[2])}, ${correct[2]}/${PAINT_TASKS.length}\nОбщее время: ${fmt(total)}\nПравильных действий: ${ok}\nНеверных попыток: ${bad}`;let f=document.getElementById('shareFeedback');try{if(navigator.share){await navigator.share({title:'Мой результат SIX SEVEN',text:msg});f.textContent='Результат готов к отправке.'}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(msg);f.textContent='Результат скопирован. Вставь его в сообщение педагогу.'}else{f.textContent='Сделай скриншот карточки результата и отправь педагогу.'}}catch(e){f.textContent='Можно сделать скриншот результата и отправить педагогу.'}};
document.getElementById('restart').onclick=()=>location.reload();return}}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
