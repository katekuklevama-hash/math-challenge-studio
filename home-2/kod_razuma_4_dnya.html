const A=[[[38,93,-24,17,-59],[80,-36,41,-52,97],[29,73,-84,56,-18],[45,-21,83,-70,69],[50,-16,72,-48,93],[24,53,96,-14,-85],[62,58,76,20,85],[23,78,90,56,14],[58,67,21,94,30],[13,98,40,65,27],[72,60,19,84,35],[63,58,29,70,41]],[[15,48,62,93,27],[35,78,14,29,56],[11,40,79,83,62],[97,10,32,86,45],[64,51,90,28,73],[40,13,79,52,96],[94,27,-56,30,-81],[52,83,-46,70,-19],[42,-37,65,-19,80],[64,27,19,-48,-53],[20,-16,47,-35,98],[18,76,-35,41,-62]],[[36,19,87,-62,-45],[42,13,57,-30,-26],[68,52,90,-31,-64],[78,29,-36,41,-50],[69,-48,32,71,-54],[61,-24,93,-37,20],[80,49,52,38,61],[95,28,40,16,87],[89,34,62,17,93],[14,75,23,70,86],[46,37,13,20,98],[76,13,29,58,65]]];
const flat=A.flat(),titles=['Цветовой код','Словарный запас','Шифровка','Найди выход'],games=['Тест Струпа','Слова из слова','Анаграммы','Лабиринт'];
const F=[[[1,-9,10],[6,-4,10],[-1,-10,9],[-6,-10,4]],[[3,-7,10],[8,-2,10],[-3,-10,7],[-8,-10,2]],[[4,-6,10],[9,-1,10],[-4,-10,6],[-9,-10,1]],[[6,1,-5,10],[7,2,-5,10],[-8,-10,5,-3],[-9,-10,5,-4]]];
let saved={};try{saved=JSON.parse(localStorage.getItem('mind-code-v1')||'{}')}catch{}let d=0,run=null,t0=0,paused=false,hideTime=false,gameState=null;const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const sign=n=>n<0?'−':'+';function save(){try{localStorage.setItem('mind-code-v1',JSON.stringify(saved))}catch{}}function sync(){saved[d]=run;save()}function stop(){if(t0&&run){run.pending=(run.pending||0)+(Date.now()-t0)/1000;t0=0;sync()}}document.addEventListener('visibilitychange',()=>{if(document.hidden&&t0){stop();paused=true;renderTask()}});
const lion=`<svg viewBox="0 0 280 280" role="img" aria-label="Львёнок в худи с абакусом"><circle cx="140" cy="130" r="105" fill="none" stroke="#667299" stroke-dasharray="4 9"/><path d="M65 259Q64 180 140 181Q216 180 215 259" fill="#8d74e8"/><path d="M104 194L140 225L176 194" fill="#6146b1"/><circle cx="140" cy="115" r="74" fill="#cf873a"/><circle cx="85" cy="76" r="22" fill="#eead50"/><circle cx="195" cy="76" r="22" fill="#eead50"/><path d="M87 100Q91 66 140 66Q190 66 194 104L185 145Q140 192 96 145Z" fill="#ffcf78"/><path d="M107 105l17 2M157 107l17-2" stroke="#382b36" stroke-width="6" stroke-linecap="round"/><circle cx="118" cy="118" r="5" fill="#382b36"/><circle cx="163" cy="118" r="5" fill="#382b36"/><ellipse cx="140" cy="143" rx="24" ry="20" fill="#ffdfa6"/><path d="M132 134h16l-8 9z" fill="#382b36"/><path d="M129 151q11 10 22 0" fill="none" stroke="#382b36" stroke-width="3"/><rect x="82" y="214" width="117" height="52" rx="7" fill="#101b31" stroke="#82f5ce" stroke-width="4"/><path d="M102 220v40m24-40v40m24-40v40m24-40v40M88 235h105" stroke="#89a7b6" stroke-width="2"/><g fill="#82f5ce"><ellipse cx="102" cy="227" rx="8" ry="4"/><ellipse cx="126" cy="230" rx="8" ry="4"/><ellipse cx="150" cy="227" rx="8" ry="4"/><ellipse cx="174" cy="230" rx="8" ry="4"/><ellipse cx="102" cy="244" rx="8" ry="4"/><ellipse cx="126" cy="251" rx="8" ry="4"/><ellipse cx="150" cy="244" rx="8" ry="4"/><ellipse cx="174" cy="252" rx="8" ry="4"/></g></svg>`;
function home(){stop();gameState=null;run=null;app.innerHTML=`<section class="hero"><div><span class="eyebrow">Твоя лаборатория навыков / 01—04</span><h1>Включай фокус.<br><span style="color:var(--mint)">Открывай код.</span></h1><p>Четыре миссии для точного счёта. Чередуй ментальный счёт и абакус, разбирай ошибки и открывай игру в финале.</p><span class="pill">40 ментально</span><span class="pill">36 на абакусе</span><span class="pill">4 игры</span></div><div class="mascot">${lion}<span class="pill">Сначала техника. Затем скорость.</span></div></section><div class="grid">${titles.map((t,i)=>{let r=saved[i];return `<article class="card"><div class="num">0${i+1}<span style="float:right;font-size:16px">${['◉','Aa','⌘','⌁'][i]}</span></div><h3>${t}</h3><p>10 ментально · 9 на абакусе</p><p>Финал: ${games[i]}</p><div class="bar"><i style="width:${r?Math.min(100,r.step/24*100):0}%"></i></div><button onclick="start(${i})">${r?.done?'Результат ↗':r?'Продолжить →':'Начать миссию →'}</button></article>`}).join('')}</div><p style="font-size:13px">Можно выбрать любой день. Если устройством пользуются несколько учеников, открывайте сайт в разных профилях браузера.</p>`}
function tasks(){let out=F[d].map((f,i)=>({type:'f',f,missing:(i+d)%f.length}));let aa=flat.slice(d*9,d*9+9);M[d].slice(0,5).forEach((nums,i)=>out.push({type:'m',nums,label:`М10–8 · стр. 39 · блок ${d+1}, № ${i+1}`}));aa.slice(0,4).forEach((nums,i)=>out.push({type:'a',nums,label:aLabel(d*9+i)}));out.push({type:'pause'});M[d].slice(5).forEach((nums,i)=>out.push({type:'m',nums,label:`М10–8 · стр. 39 · блок ${d+1}, № ${i+6}`}));aa.slice(4).forEach((nums,i)=>out.push({type:'a',nums,label:aLabel(d*9+i+4)}));return out}function aLabel(i){return `АВ10–8 · стр. 5 · блок ${Math.floor(i/12)+1}, № ${i%12+1}`}function start(i){stop();d=i;run=saved[d];if(!run){app.innerHTML=`<section class="stage"><span class="eyebrow">Миссия 0${d+1}</span><h2>${titles[d]}</h2><div class="sheet"><h2>Подготовь абакус</h2><p>Сначала восстанови четыре формулы. Затем: 5 ментальных примеров → 4 на абакусе → пауза → 5 ментальных → 5 на абакусе.</p><p>На абакусе выполняй каждое действие последовательно, начиная со старшего разряда. Ментально представляй движения косточек.</p>${d===0?'<p><b>Для проверки техники:</b> запиши одно полное решение на абакусе с объяснением. В кадре должны быть видны руки и косточки. Отправь видео преподавателю отдельно.</p>':''}<p>Таймер считает время решения, а не разбора ошибок. Его можно скрыть. Спешить не нужно.</p><button onclick="begin()">Всё готово →</button></div></section>`}else if(run.done)results();else{paused=false;renderTask()}}function begin(){run={step:0,records:[],pending:0,attempts:0,done:false};sync();renderTask()}
function renderTask(){if(!run)return;let ts=tasks();if(run.step>=ts.length){run.done=true;sync();results();return}let t=ts[run.step];let name=t.type==='m'?'Ментальный счёт':t.type==='a'?'Практика на абакусе':t.type==='f'?'Восстанови формулу':'Перезагрузка';app.innerHTML=`<section class="stage"><div class="stage-top"><span class="eyebrow">День ${d+1} / ${name}</span><button class="ghost small" onclick="toggleTime()">${hideTime?'Показать':'Скрыть'} время</button></div><div class="bar"><i style="width:${run.step/ts.length*100}%"></i></div><div class="stage-top"><span class="muted">Этап ${run.step+1} из ${ts.length}</span><span id="timer">${hideTime?'Твой темп':fmt(run.pending||0)}</span></div><div class="sheet" id="sheet"></div></section>`;let sh=document.getElementById('sheet');if(t.type==='pause'){sh.innerHTML='<h2>Дай глазам отдохнуть</h2><p>Встань, расправь плечи, посмотри вдаль. Сделай несколько спокойных вдохов и возвращайся, когда будешь готов.</p><button onclick="next()">Продолжить тренировку →</button>';return}if(paused){sh.innerHTML='<h2>Тренировка на паузе</h2><p>Время остановлено. Продолжим с того же примера.</p><button onclick="paused=false;renderTask()">Продолжить →</button>';return}if(t.type==='f'){sh.innerHTML=`<h2>Какое число пропущено?</h2><p>Знак уже указан. Впиши только число и проговори порядок действий.</p><form onsubmit="check(event)"><div class="formula">${t.f.map((n,i)=>`${i===1?' = ':''}${sign(n)} ${i===t.missing?'<input id="ans" inputmode="numeric" type="text" autocomplete="off" aria-label="Пропущенное число" required>':Math.abs(n)}`).join(' ')}</div><div class="actions"><button>Проверить</button></div></form><div class="notice" id="feedback" aria-live="polite"></div>`}else{sh.innerHTML=`<div class="stage-top"><b>${t.type==='m'?'Представляй абакус':'Считай на настоящем абакусе'}</b><button class="small ghost" onclick="stop();paused=true;renderTask()">Пауза</button></div><p style="font-size:12px">${t.label}</p><form onsubmit="check(event)"><div class="calc">${t.nums.map((n,i)=>`<div>${i===0?n:(n<0?'− ':'+ ')+Math.abs(n)}</div>`).join('')}</div><input class="answer" id="ans" inputmode="numeric" autocomplete="off" aria-label="Ответ" placeholder="Ответ" required><div class="actions"><button>Проверить →</button></div></form><div class="notice" id="feedback" aria-live="polite"></div>`;t0=Date.now()}document.getElementById('ans')?.focus()}
function toggleTime(){hideTime=!hideTime;document.getElementById('timer').textContent=hideTime?'Твой темп':fmt((run.pending||0)+(t0?(Date.now()-t0)/1000:0));let b=document.querySelector('.stage-top button');if(b)b.textContent=hideTime?'Показать время':'Скрыть время'}setInterval(()=>{let el=document.getElementById('timer');if(el&&run&&!hideTime)el.textContent=fmt((run.pending||0)+(t0?(Date.now()-t0)/1000:0))},300);
function check(e){e.preventDefault();let input=document.getElementById('ans');if(!/^\d+$/.test(input.value.trim()))return;let t=tasks()[run.step],val=Number(input.value),correct=t.type==='f'?Math.abs(t.f[t.missing]):t.nums.reduce((a,b)=>a+b,0);stop();run.attempts++;if(run.attempts===1){run.records.push({type:t.type,nums:t.nums,label:t.label,answer:val,correct,ok:val===correct,seconds:run.pending||0})}let feedback=document.getElementById('feedback');if(val===correct){feedback.className='notice good';feedback.innerHTML=run.attempts===1?'Верно. Продолжай!':'Ответ исправлен. Продолжай!';input.disabled=true;document.querySelector('form button').type='button';document.querySelector('form button').onclick=next;document.querySelector('form button').textContent='Дальше →'}else{feedback.className='notice bad';feedback.innerHTML=`Пока не совпало. ${t.type==='f'?'Вспомни дополнение до 5 или 10.':'Обнули абакус и выполни цепочку ещё раз по действиям.'}${run.attempts>=2?`<br><button class="ghost small" type="button" onclick="hint()">Посмотреть разбор</button>`:''}`;input.select()}sync()}
function hint(){let t=tasks()[run.step];let f=document.getElementById('feedback');if(t.type==='f')f.innerHTML='Формула: '+t.f.map((n,i)=>(i===1?' = ':' ')+sign(n)+Math.abs(n)).join('')+'. Впиши пропущенное число.';else{let total=0;f.innerHTML='Промежуточные результаты: '+t.nums.map(n=>total+=n).join(' → ')+'.<br>Проверь движения на каждом шаге, затем введи ответ.'}}

function report(){let lines=[`Код разума · день ${d+1}`];for(let type of ['m','a']){let r=run.records.filter(x=>x.type===type);lines.push(`${type==='m'?'Ментально':'Абакус'}: ${r.filter(x=>x.ok).length}/${r.length} с первой попытки, ${fmt(r.reduce((s,x)=>s+x.seconds,0))}`)}let errors=run.records.filter(x=>!x.ok&&x.nums);lines.push('Исправлено примеров: '+errors.length);errors.forEach(x=>lines.push(`${x.label}: ${x.nums.join(', ')}; первый ответ ${x.answer}, верный ${x.correct}`));return lines.join('\n')}
function results(){t0=0;app.innerHTML=`<section class="stage"><span class="eyebrow">Миссия ${d+1} · счёт завершён</span><h2>Ещё один шаг вперёд ✦</h2><div class="sheet"><div class="statgrid">${['m','a'].map(type=>{let r=run.records.filter(x=>x.type===type);return `<div class="stat">${type==='m'?'Ментально':'Абакус'}<strong>${r.filter(x=>x.ok).length} / ${r.length}</strong>с первой попытки · ${fmt(r.reduce((s,x)=>s+x.seconds,0))}</div>`}).join('')}</div><p>Все примеры пройдены, ошибки исправлены. Время включает первые попытки; разбор и исправления в него не входят.</p><div class="actions"><button onclick="launchGame()">Открыть: ${games[d]} →</button><button class="ghost" onclick="copyReport()">Скопировать отчёт</button></div><div id="copyStatus" class="notice" aria-live="polite"></div><details><summary>Отчёт для преподавателя</summary><pre>${esc(report())}</pre></details><details><summary>Пройти день заново</summary><p>Результат этого дня в браузере будет заменён. Сначала сохрани отчёт, если он нужен.</p><button class="ghost small" onclick="begin()">Начать новую попытку</button></details></div></section>`}async function copyReport(){try{await navigator.clipboard.writeText(report());document.getElementById('copyStatus').textContent='Скопировано. Отправь преподавателю.'}catch{document.getElementById('copyStatus').textContent='Не удалось скопировать автоматически. Выдели текст в разделе «Отчёт для преподавателя».'}}
function shell(title,body){app.innerHTML=`<section class="stage"><span class="eyebrow">Бонусная миссия / ${d+1}</span><h2>${title}</h2><div class="sheet">${body}</div><p class="center"><button class="ghost small" onclick="gameState=null;results()">К результатам счёта</button></p></section>`}function launchGame(){if(d===0){gameState={i:0,score:0};stroop()}if(d===1){gameState={words:[]};words()}if(d===2){gameState={i:0,score:0};anagram()}if(d===3)makeMaze()}
const colors=[['КРАСНЫЙ','#c73550'],['СИНИЙ','#3159cd'],['ЗЕЛЁНЫЙ','#128153'],['ФИОЛЕТОВЫЙ','#8650bc']];function stroop(){if(gameState.i===12){shell('Цветовой код раскрыт',`<h2>${gameState.score} из 12</h2><p>Ты выбирал цвет букв, игнорируя значение слова.</p><button onclick="launchGame()">Ещё раунд</button>`);return}let k=gameState.i;gameState.color=[2,0,3,1,0,2,1,3,2,1,3,0][k];let word=[0,1,2,3,2,1,3,0,1,2,0,3][k];shell('Выбери цвет букв',`<p>Не читай слово. Нажми на название цвета, которым оно написано. Раунд ${k+1}/12.</p><div class="gamespot"><div class="word" style="color:${colors[gameState.color][1]}">${colors[word][0]}</div></div><div class="actions">${colors.map((c,i)=>`<button class="ghost" onclick="stroopPick(${i})">${c[0]}</button>`).join('')}</div><div class="notice" id="gf" aria-live="polite"></div>`)}function stroopPick(i){let ok=i===gameState.color;gameState.score+=ok?1:0;document.querySelectorAll('.sheet button').forEach(b=>b.disabled=true);document.getElementById('gf').innerHTML=`${ok?'Верно!':'Это '+colors[gameState.color][0].toLowerCase()+'.'} <button class="small" onclick="gameState.i++;stroop()">Дальше →</button>`}
function words(){shell('Слова внутри слова',`<p>Составляй существительные из букв слова. Каждую букву можно использовать столько раз, сколько она встречается в исходном слове.</p><div class="gamespot"><div class="word" style="font-size:clamp(24px,5vw,38px)">КОСМОНАВТИКА</div></div><form onsubmit="addWord(event)"><input id="w" class="answer" style="width:min(100%,330px);font-size:22px" autocomplete="off" aria-label="Новое слово" placeholder="Твоё слово"><div class="actions"><button>Добавить</button></div></form><div id="wf" class="notice" aria-live="polite"></div><div class="tags">${gameState.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div><p>Собрано: ${gameState.words.length}. Проверяем состав букв и повторы. Существование спорных слов обсудите с преподавателем.</p><button class="ghost" onclick="finishWords()">Завершить</button>`)}function addWord(e){e.preventDefault();let w=document.getElementById('w').value.trim().toLowerCase().replace(/ё/g,'е'),letters=[...'космонавтика'];let msg='';if(w.length<2||w==='космонавтика')msg='Попробуй другое слово из двух или более букв.';else if(gameState.words.includes(w))msg='Это слово уже есть.';else for(let c of w){let i=letters.indexOf(c);if(i<0){msg='В исходном слове не хватает этих букв.';break}letters.splice(i,1)}if(msg){document.getElementById('wf').textContent=msg;return}gameState.words.push(w);words();document.getElementById('w').focus()}function finishWords(){shell('Словарная миссия завершена',`<h2>Собрано слов: ${gameState.words.length}</h2><p>${gameState.words.map(esc).join(', ')||'Можно вернуться и попробовать ещё.'}</p><p>Сделай скриншот списка и отправь преподавателю вместе с отчётом.</p><button onclick="words()">Вернуться к словам</button>`)}
const ana=[['ТЕРАКА','РАКЕТА'],['ТИБОРА','ОРБИТА'],['ТАЛПЕНА','ПЛАНЕТА'],['НИКТУПС','СПУТНИК'],['МОСОКС','КОСМОС'],['ТИЛАРНБИ','ЛАБИРИНТ']];function anagram(){if(gameState.i>=ana.length){shell('Шифровка завершена','<h2>Все 6 слов раскрыты!</h2><p>Ты восстановил слова из перемешанных букв.</p><button onclick="launchGame()">Повторить</button>');return}shell('Расшифруй слово',`<p>Слово ${gameState.i+1} из 6. Тема: космос и приключения.</p><div class="gamespot"><div class="word">${ana[gameState.i][0]}</div></div><form onsubmit="checkAna(event)"><input id="aw" class="answer" style="width:min(100%,330px);font-size:22px" autocomplete="off" aria-label="Расшифрованное слово"><div class="actions"><button>Проверить</button><button type="button" class="ghost" onclick="document.getElementById('af').textContent='Первая буква: ${ana[gameState.i][1][0]}'">Подсказка</button></div></form><div class="notice" id="af" aria-live="polite"></div>`)}function checkAna(e){e.preventDefault();let w=document.getElementById('aw').value.trim().toUpperCase();if(w===ana[gameState.i][1]){gameState.i++;anagram()}else document.getElementById('af').textContent='Пока не совпало. Используй все буквы.'}
function makeMaze(){let n=15,g=Array.from({length:n},()=>Array(n).fill(1)),stack=[[1,1]];g[1][1]=0;let seed=71;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};while(stack.length){let [x,y]=stack[stack.length-1],opt=[[2,0],[-2,0],[0,2],[0,-2]].map(([a,b])=>[x+a,y+b]).filter(([a,b])=>a>0&&b>0&&a<n-1&&b<n-1&&g[b][a]);if(!opt.length){stack.pop();continue}let [a,b]=opt[Math.floor(rand()*opt.length)];g[(y+b)/2][(x+a)/2]=0;g[b][a]=0;stack.push([a,b])}gameState={g,x:1,y:1,steps:0,seen:new Set(['1,1'])};maze()}
function maze(){let s=gameState;shell('Найди выход',`<p>Дойди от фиолетового квадрата до зелёного. Управляй стрелками на клавиатуре или кнопками. Шагов: ${s.steps}.</p><div class="maze" role="img" aria-label="Лабиринт, игрок и выход">${s.g.map((r,y)=>r.map((v,x)=>`<div class="cell ${v?'wall':x===s.x&&y===s.y?'player':x===13&&y===13?'goal':s.seen.has(x+','+y)?'visited':''}"></div>`).join('')).join('')}</div><div class="control"><span></span><button aria-label="Вверх" onclick="move(0,-1)">↑</button><span></span><button aria-label="Влево" onclick="move(-1,0)">←</button><button aria-label="Вниз" onclick="move(0,1)">↓</button><button aria-label="Вправо" onclick="move(1,0)">→</button></div>`)}function move(dx,dy){let s=gameState;if(!s?.g)return;let x=s.x+dx,y=s.y+dy;if(s.g[y]?.[x]!==0)return;s.x=x;s.y=y;s.steps++;s.seen.add(x+','+y);if(x===13&&y===13){shell('Выход найден!',`<h2>Лабиринт пройден за ${s.steps} шагов</h2><p>Четвёртая миссия завершена. Сохрани результаты счёта и отправь преподавателю.</p><button onclick="makeMaze()">Пройти ещё раз</button>`);gameState=null}else maze()}document.addEventListener('keydown',e=>{if(gameState?.g&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(...({ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]))}});home();

</script></html>
