function load(name){try{const x=localStorage.getItem('six-seven-hw-'+name);if(x){const d=JSON.parse(x);if(d.student===name){S=d;S.notice='Продолжили сохранённую работу.';return true}}}catch(e){}return false}
function clock(){if(S.started){let total=S.elapsed.reduce((a,b)=>a+b,0);if(S.stage>=0&&!S.done)total+=Date.now()-S.stageStart;$('clock').textContent='⏱ '+fmt(total)}}setInterval(clock,1000);
function header(){return `<span class="tag">${S.stage+1} из 4 · ${stages[S.stage]}</span><div class="pillrow"><span class="pill">👩‍🎓 ${escapeHTML(S.student)}</span><span class="pill">Этап ${S.stage+1}/4</span><span class="pill">Время этапа: <span id="stepclock">00:00</span></span></div><div class="progress"><div style="width:${(S.stage+1)/4*100}%"></div></div>`}
setInterval(()=>{if(S.stage>=0&&!S.done&&$('stepclock'))$('stepclock').textContent=fmt(Date.now()-S.stageStart)},500);
function start(name){S={student:name,stage:0,started:Date.now(),stageStart:Date.now(),forms:{index:0,shown:false,seen:0},ment:{index:0,entries:[],wrong:0,skipped:0,attempts:0},ab:{index:0,entries:[],wrong:0,skipped:0,attempts:0},diff:{count:0},elapsed:[0,0,0,0],done:false,notice:''};save();render()}
function choose(name){if(!load(name))start(name);else render()}
function nextStage(){S.elapsed[S.stage]+=Date.now()-S.stageStart;S.stage++;S.stageStart=Date.now();if(S.stage>=4){S.done=true;S.stage=3}save();render();window.scrollTo(0,0)}
function reset(){if(!confirm('Начать домашнюю миссию заново? Предыдущие результаты этой ученицы будут заменены.'))return;start(S.student)}
function render(){let out='';if(!S.student){out=`<span class="tag">Домашнее задание · 05.11.2026</span><h1>🎀 SIX SEVEN · Домашняя миссия</h1><p>Проговори формулы, выполни 10 ментальных примеров, реши 10 примеров на абакусе и найди отличия.</p><h2>Кто выполняет задание?</h2><div class="nameBtns"><button class="btn" onclick="choose('Полина')">Полина</button><button class="btn" onclick="choose('Эмилия')">Эмилия</button></div><p class="muted">Результаты сохраняются на этом устройстве отдельно для каждой ученицы. Для отправки педагогу скопируй отчёт в конце.</p>`}
else if(S.done){out=resultsHTML()}
else if(S.stage===0){let f=FORM[S.forms.index];out=header()+`<h1>🔐 Проговори формулу</h1><p>Сначала скажи формулу вслух, потом нажми «Показать формулу» и проверь себя. Пройди все 13 формул сложения через 5 и через 10.</p><div class="card"><div class="muted">Карточка ${S.forms.index+1} из ${FORM.length}</div><div class="eq">${f.q}</div>${S.forms.shown?`<div class="feedback" style="text-align:center;font-size:22px;font-weight:800">${f.a}</div>`:''}</div><div class="actions">${!S.forms.shown?'<button class="btn" onclick="revealFormula()">👀 Показать формулу</button>':`<button class="btn" onclick="advanceFormula()">${S.forms.index===FORM.length-1?'Завершить повторение':'Следующая формула →'}</button>`}<button class="btn secondary" onclick="advanceFormula()">${S.forms.index===FORM.length-1?'Дальше без проверки':'Уже знаю · Дальше'}</button></div>`}
else if(S.stage===1||S.stage===2){let isM=S.stage===1,d=isM?S.ment:S.ab,arr=isM?MENT:AB,kind=isM?'Ментальный диктант':'Абакус · В12-2, стр. 35 № 2';let index=d.index;if(index>=10){out=header()+`<h1>Готово! 🌸</h1><p>Все 10 примеров пройдены. Можно переходить к следующему этапу.</p><div class="actions"><button class="btn" onclick="nextStage()">Следующий этап →</button></div>`}else{let a=arr[index],display=a.map((n,i)=>i===0?String(n):(n<0?'− '+(-n):'+ '+n)).join(' ');out=header()+`<h1>${isM?'🧠 Ментальный диктант':'🧮 Практика на абакусе'}</h1><p>${isM?'Считай ментально. Во всех примерах три числа, без формул через 5 и 10.':'Считай на настоящем абакусе. Если ошиблась, можно пересчитать или перейти дальше.'}</p><div class="pillrow"><span class="pill">Пример ${index+1}/10</span><span class="pill">Правильно с первого раза: ${d.entries.filter(e=>e.status==='correct'&&e.tries===1).length}</span></div><div class="card"><div class="eq">${display}</div><div style="text-align:center"><label for="answer" class="sr">Ответ</label><input id="answer" type="number" inputmode="numeric" placeholder="Ответ" onkeydown="if(event.key==='Enter')checkAnswer()" autofocus><div id="feedback" class="feedback" style="display:none"></div></div></div><div class="actions"><button class="btn" onclick="checkAnswer()">Проверить</button><button class="btn secondary" onclick="recount()">↻ Пересчитать</button><button class="btn outline" onclick="skip()">Пропустить и дальше →</button></div><p class="muted">Если ответ неправильный, он не блокирует переход к следующему примеру.</p>`}}
else if(S.stage===3){out=header()+`<h1>🔎 Найди 10 отличий</h1><p>В12-2, стр. 34. Внимательно сравни две картинки. Каждый раз, когда найдёшь отличие, нажимай «Нашла отличие». Старайся не считать одно и то же дважды.</p><img class="picture" src="${PIC}" alt="Две картинки из учебника: найди десять отличий"><div class="card"><div class="counter">${S.diff.count} / 10</div><p style="text-align:center">Найдено отличий</p><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="changeDiff(-1)" ${S.diff.count===0?'disabled':''}>− Убрать отметку</button><button class="btn" onclick="changeDiff(1)" ${S.diff.count===10?'disabled':''}>+ Нашла отличие</button></div></div><div class="notice">Отличия отмечаются по твоей самооценке. Сайт не проверяет, правильно ли найдены все 10.</div><div class="actions"><button class="btn" onclick="finish()">Завершить и посмотреть результат →</button></div>`}
if(S.notice){out=`<div class="feedback">${escapeHTML(S.notice)}</div>`+out;S.notice=''}$('app').innerHTML=out;clock();save()}
function revealFormula(){if(!S.forms.shown)S.forms.seen++;S.forms.shown=true;render()}
function advanceFormula(){if(S.forms.index>=FORM.length-1)nextStage();else{S.forms.index++;S.forms.shown=false;render()}}
function data(){return S.stage===1?S.ment:S.ab}function nums(){return S.stage===1?MENT:AB}
function checkAnswer(){let el=$('answer');if(!el||el.value.trim()===''){$('feedback').style.display='block';$('feedback').textContent='Сначала введи ответ.';return}let d=data(),a=nums()[d.index],correct=a.reduce((x,y)=>x+y,0),n=Number(el.value);d.attempts++;let e=d.entries[d.index]||{tries:0,status:'',answer:null};e.tries++;if(n===correct){e.status='correct';e.answer=n;d.entries[d.index]=e;d.index++;S.notice='Верно! ✨';render()}else{d.wrong++;e.status='wrong';e.answer=n;d.entries[d.index]=e;$('feedback').style.display='block';$('feedback').textContent='Пока не совпало. Попробуй пересчитать или переходи к следующему примеру.';save()}}
function recount(){let el=$('answer');if(el){el.value='';el.focus();$('feedback').style.display='block';$('feedback').textContent='Считай ещё раз в своём темпе.'}}
function skip(){let d=data(),e=d.entries[d.index]||{tries:0,status:'',answer:null};if(e.status!=='correct'){e.status='skipped';d.skipped++;d.entries[d.index]=e}d.index++;S.notice='Переходим дальше. Этот пример отмечен как пропущенный.';render()}
function changeDiff(delta){S.diff.count=Math.max(0,Math.min(10,S.diff.count+delta));render()}
function finish(){S.elapsed[3]+=Date.now()-S.stageStart;S.done=true;save();render()}
function summary(d){let right=d.entries.filter(e=>e.status==='correct').length,first=d.entries.filter(e=>e.status==='correct'&&e.tries===1).length;return `${right}/10 верно, ${first}/10 с первой попытки, ${d.wrong} ошибочных ответов, ${d.skipped} пропущено`}
function report(){let total=S.elapsed.reduce((a,b)=>a+b,0);return `SIX SEVEN · ДОМАШНЯЯ МИССИЯ\nУченица: ${S.student}\nФормулы сложения: ${FORM.length} карточек, открыто подсказок ${S.forms.seen}; время ${fmt(S.elapsed[0])}\nМентальный диктант (10): ${summary(S.ment)}; время ${fmt(S.elapsed[1])}\nАбакус В12-2, стр. 35 № 2 (10): ${summary(S.ab)}; время ${fmt(S.elapsed[2])}\nНайди 10 отличий, стр. 34: отмечено ${S.diff.count}/10 (самооценка); время ${fmt(S.elapsed[3])}\nОбщее время: ${fmt(total)}`}
function resultsHTML(){return `<span class="tag">Миссия завершена ✨</span><h1>🎉 Отличная работа, ${escapeHTML(S.student)}!</h1><p>Результаты сохранены отдельно. Скопируй отчёт и отправь педагогу.</p><div class="stats"><div class="stat"><span class="muted">Формулы</span><b>${FORM.length}</b><span class="small">карточек</span></div><div class="stat"><span class="muted">Ментально</span><b>${S.ment.entries.filter(e=>e.status==='correct').length}/10</b><span class="small">правильных</span></div><div class="stat"><span class="muted">Абакус</span><b>${S.ab.entries.filter(e=>e.status==='correct').length}/10</b><span class="small">правильных</span></div><div class="stat"><span class="muted">Отличия</span><b>${S.diff.count}/10</b><span class="small">самооценка</span></div></div><h2>Отчёт для педагога</h2><pre id="report">${escapeHTML(report())}</pre><div class="actions"><button class="btn" onclick="copyReport()">📋 Скопировать результат</button><button class="btn secondary" onclick="reset()">↻ Пройти заново</button><button class="btn outline" onclick="switchStudent()">Другая ученица</button></div><div id="copyStatus" class="muted" style="margin-top:12px"></div>`}
async function copyReport(){let t=report();try{await navigator.clipboard.writeText(t);$('copyStatus').textContent='Отчёт скопирован!'}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();$('copyStatus').textContent=ok?'Отчёт скопирован!':'Выдели и скопируй текст отчёта вручную.'}}
function switchStudent(){S.student='';S.started=0;S.done=false;S.stage=-1;render()}
render();
</script></body></html>
