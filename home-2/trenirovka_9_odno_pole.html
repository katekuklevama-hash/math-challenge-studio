<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Абакус и ментальный счет · Уровень 9</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c192c;color:#eef4ff;font:16px system-ui}header{padding:16px 3%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#13253e}h1{font-size:24px;margin:0}small{color:#b9c9df}button,input{font:inherit;border-radius:10px;border:1px solid #c2cedd;padding:9px}button{cursor:pointer;background:#e8f0fa;color:#14223b;font-weight:650}button:disabled{opacity:.45;cursor:default}.primary{background:#ffe29a}.clock{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}#help{margin:12px 3%;line-height:1.5;color:#c9d8eb}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 3%}.panel{background:#fff;color:#16273e;border-radius:18px;padding:18px;border-top:6px solid #58c9c0;min-width:0}.panel:nth-child(2){border-color:#ffb17b}.head{display:flex;align-items:center;gap:12px;justify-content:space-between}.head input{width:55%;font-weight:700}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.nav button{padding:6px 10px;font-size:14px}.nav .active{background:#173c60;color:white}.task{min-height:335px}.column{font-size:23px;line-height:1.27;text-align:right;width:100px;margin:8px auto;font-variant-numeric:tabular-nums}.column div:first-child{border-bottom:1px solid #d8e1ec}.minus{color:#af3346}.answer{display:flex;justify-content:center;gap:8px;align-items:center;margin:12px 0}.answer input{width:110px;text-align:center;font-size:22px}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{border:1px solid #c9d6e5;padding:7px;text-align:center}th{font-size:12px;background:#eef3f9}.highlight{background:#fff0c8;font-weight:700}.hint{font-size:14px;line-height:1.5;color:#50617a}.review{max-height:470px;overflow:auto}.review td{font-size:15px}.ok{background:#dff4e9}.bad{background:#ffe5e3}.notice{padding:10px;background:#edf3f9;border-radius:8px;margin:10px 0}.title{margin:8px 0;font-size:18px}footer{padding:10px 3%;color:#aebed2;font-size:13px}@media(max-width:750px){.fields{gap:8px;margin:10px}.panel{padding:10px}header{flex-wrap:wrap}h1{font-size:20px}.head{flex-wrap:wrap}.head input{width:100%}td,th{padding:5px}.column{font-size:22px}}
.fields{display:block;max-width:900px;margin:18px auto;padding:0 14px}.modes{display:flex;gap:10px;justify-content:center;margin:16px}.modes .active{background:#58c9c0}.task{min-height:320px}.review{max-height:none}.column{font-size:25px}header small{display:block;margin-top:4px}</style>
<header><div><h1>Тренировка · Уровень 9</h1><small id="subtitle"></small></div><span id="clock" class="clock"></span><div><button id="start" class="primary">Начать</button> <button id="pause">Пауза</button> <button id="reset">Заново</button></div></header>
<div class="modes"><button id="mode0" onclick="switchMode(0)">Абакус · 10 минут</button><button id="mode1" onclick="switchMode(1)">Ментально · 3 минуты</button></div>
<div id="help"></div><main class="fields"><section class="panel" id="panel"></section></main><footer>Примеры из предоставленных листов Brain-UP, уровень 9. При закрытии страницы результаты не сохраняются. После самопроверки сделай скриншот.</footer><script>
const DATA=[{"cols": [[32, -9, 87, 1, 99, -6, -68, 6, -58, -5], [12, 8, 59, 6, 85, -8, 99, -6, -97, -9], [22, -6, -7, 74, -5, 76, -9, 95, 6, -58], [76, 9, -47, 7, 87, 9, -55, -9, 76, -5], [44, -9, 95, -1, 81, -1, -7, -75, -8, -8], [41, -6, -16, 1, -19, 9, 38, -9, -27, 9], [68, -9, 58, 8, -59, 8, -48, 8, -25, 1], [24, 7, 79, 9, 98, 3, 29, -1, 67, 5], [13, 7, -12, -4, 36, -9, -26, -1, 68, -7], [36, 5, 79, 7, -98, 6, 88, 8, 79, 7]], "matrix": [[18, 89, 96, 31], [5, 5, 9, -1], [88, 66, 25, -22], [9, 3, 6, -4], [62, 99, -48, 46]], "answers": [79, 149, 188, 148, 111, 21, 10, 320, 65, 217, 182, 262, 88, 50, 234, 18, 157, 14, 159, 582], "seconds": 600}, {"cols": [[6, 5, -6, 5, 7], [8, -4, 8, 8, 2], [3, 9, -3, -2, -3], [6, -2, -3, 9, 8], [3, 9, 9, 9, -9], [6, 7, 9, 9, -6], [4, -1, 8, -6, 8], [3, -2, 9, 8, -9], [2, -1, 9, 2, -7], [6, 4, 1, 9, -4]], "answers": [17, 22, 4, 18, 21, 25, 13, 9, 5, 16], "seconds": 180}];
const fresh=i=>({q:0,a:Array(DATA[i].answers.length).fill(''),started:false,done:false,review:false,remain:DATA[i].seconds});
let states=[fresh(0),fresh(1)],mode=0,running=false,deadline=0;
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clock(){const s=states[mode];el('clock').textContent=Math.floor(s.remain/60)+':'+String(s.remain%60).padStart(2,'0')}
function tick(){if(!running)return;const s=states[mode];s.remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(s.remain===0){running=false;s.done=true;render()}clock()}
function switchMode(i){tick();running=false;mode=i;render()}
function matrixHTML(d,q){let h='<table><tr><th></th>'+[11,12,13,14].map(n=>'<th>№ '+n+'</th>').join('')+'</tr>';d.matrix.forEach((row,i)=>{h+='<tr><th>№ '+(15+i)+'</th>'+row.map((n,j)=>'<td class="'+((q===10+j||q===14+i||q===19)?'highlight':'')+'">'+(n<0?'−'+(-n):n)+'</td>').join('')+'</tr>'});return h+'</table>'}
function render(){const s=states[mode],d=DATA[mode],n=d.answers.length,q=s.q;
el('subtitle').textContent=mode?'Ментальный счет · 10 заданий':'Абакус · 20 заданий';
el('help').textContent=mode?'Считай ментально, представляя абакус. Записывай ответы в тетрадь или вводи в поле. После завершения открой самопроверку.':'Решай на абакусе, выполняя действия по порядку. Записывай ответы в тетрадь или вводи в поле. В матрице считай строки и столбцы отдельно.';
[0,1].forEach(i=>el('mode'+i).className=i===mode?'active':'');
let h='';
if(s.review){let entered=s.a.filter(v=>v!=='').length,correct=s.a.filter((v,k)=>v!==''&&Number(v)===d.answers[k]).length;
h='<h2>Самопроверка · '+(mode?'Ментально':'Абакус')+'</h2><div class="notice">'+(entered?'Введено: '+entered+'/'+n+' · Верно: '+correct+'/'+n:'Ответы для проверки тетради')+'</div><div class="review"><table><tr><th>№</th><th>Твой ответ</th><th>Верный ответ</th></tr>'+d.answers.map((v,k)=>'<tr class="'+(s.a[k]===''?'':Number(s.a[k])===v?'ok':'bad')+'"><td>'+(k+1)+'</td><td>'+esc(s.a[k]||'—')+'</td><td>'+v+'</td></tr>').join('')+'</table></div>'+(mode?'':'<p class="hint">№ 20: сумма ответов 11–14 и сумма ответов 15–19 должны совпасть.</p>')+'<button onclick="states[mode].review=false;render()">Посмотреть задания</button>';
}else if(!s.started||(!running&&!s.done)){h='<div class="task notice"><h2>'+(!s.started?'Готовимся к старту':'Пауза')+'</h2><p>'+(mode?'10 примеров. Считай без настоящего абакуса.':'10 столбиков и матрица: 4 столбца, 5 строк и общий итог.')+'</p><p>Ответы под номерами 1–'+n+'. Можно пропустить задание и вернуться к нему позже.</p><p>Пауза скрывает задания. При переключении режима таймер останавливается, введенные ответы остаются.</p></div>';
}else{
h='<nav class="nav">'+d.answers.map((_,k)=>'<button class="'+(q===k?'active':'')+'" onclick="states[mode].q='+k+';render()">'+(k+1)+(s.a[k]!==''?' •':'')+'</button>').join('')+'</nav><div class="task"><h2 class="title">Задание '+(q+1)+' / '+n+'</h2>';
if(q<10)h+='<div class="column">'+d.cols[q].map((v,k)=>'<div class="'+(v<0?'minus':'')+'">'+(v<0?'− '+(-v):k?'+ '+v:v)+'</div>').join('')+'</div>';
else h+='<p class="hint">'+(q<14?'Сложи числа в выделенном столбце.':q<19?'Сложи числа в выделенной строке.':'Сложи ответы столбцов 11–14. Проверь: сумма ответов строк 15–19 должна быть такой же.')+'</p>'+matrixHTML(d,q);
h+='</div><div class="answer"><label for="answer">Ответ</label><input id="answer" type="number" inputmode="numeric" value="'+esc(s.a[q])+'" '+(s.done?'disabled':'')+' oninput="states[mode].a[states[mode].q]=this.value"></div><div class="actions"><button '+(!q?'disabled':'')+' onclick="states[mode].q--;render()">← Назад</button><button '+(q===n-1?'disabled':'')+' onclick="states[mode].q++;render()">Дальше →</button></div>';
}
if(s.started&&!s.review)h+='<hr><button class="primary" onclick="finish()">'+(s.done?'Открыть самопроверку':'Завершить и проверить')+'</button>';
el('panel').innerHTML=h;el('start').disabled=s.started;el('pause').disabled=!s.started||s.done;el('pause').textContent=running?'Пауза':'Продолжить';clock();}
function finish(){const s=states[mode];if(!s.done&&!confirm('Завершить этот подход? Ответы больше нельзя будет изменить.'))return;tick();running=false;s.done=s.review=true;render()}
el('start').onclick=()=>{const s=states[mode];s.started=true;running=true;deadline=Date.now()+s.remain*1000;render()};
el('pause').onclick=()=>{tick();const s=states[mode];if(s.done)return;if(running)running=false;else{running=true;deadline=Date.now()+s.remain*1000}render()};
el('reset').onclick=()=>{if(states[mode].started&&!confirm('Удалить ответы только в текущем режиме и начать заново?'))return;running=false;states[mode]=fresh(mode);render()};
setInterval(tick,200);render();
</script></html>
