const app=document.getElementById('app'),clock=document.getElementById('clock');let start=0,timer=null,stage=0,i=0,correct=0,mistakes=0,locked=false,found=0,mem='',memTimeout=null;
// Только изученные формулы сложения через десяток (+1…+4).
const formulas=[
{q:'+1 через десятку',steps:'−9, +10',valid:true,explain:'Верно: для +1 забираем 9 и добавляем 10.'},
{q:'+2 через десятку',steps:'−7, +10',valid:false,explain:'Ошибка: для +2 нужно −8, +10.'},
{q:'+3 через десятку',steps:'−7, +10',valid:true,explain:'Верно: для +3 нужно −7, +10.'},
{q:'+4 через десятку',steps:'−4, +10',valid:false,explain:'Ошибка: для +4 нужно −6, +10.'},
{q:'+2 через десятку',steps:'−8, +10',valid:true,explain:'Верно: для +2 нужно −8, +10.'},
{q:'+4 через десятку',steps:'−6, +10',valid:true,explain:'Верно: для +4 нужно −6, +10.'}
];
// Сложение, без формул вычитания через десяток и без неосвоенных +6/+7.
const calc=[
{a:71,b:34,comment:'В десятках переход через сотню, в единицах — работа с пятёркой.'},
{a:82,b:24,comment:'Проверь, что происходит в каждом разряде.'},
{a:63,b:14,comment:'В единицах используй изученную формулу пятёрок.'},
{a:61,b:44,comment:'Сначала посчитай на абакусе, потом проверь себя.'}
];
function time(){let s=start?Math.floor((Date.now()-start)/1000):0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function home(){clearInterval(timer);clearTimeout(memTimeout);start=0;clock.textContent='⏱ 00:00';let best=localStorage.getItem('sixSevenBest');app.innerHTML=`<section class="home-hero"><div class="hero-copy"><div class="tag">★ ТВОЙ МАТЕМАТИЧЕСКИЙ ЧЕЛЛЕНДЖ</div><h1 class="big">SIX<span class="seven">SEVEN</span><small>CHALLENGE ✦</small></h1><p>Быстрее. Умнее. Сильнее! Пройди все четыре испытания подряд.</p></div><img class="hero-cat" src="${cat}" alt="Котик в розовой толстовке с цифрами 6 и 7"><div class="scribble">✧ ♡</div></section><h2 class="section-title">Тебя ждут 4 испытания</h2><section class="cards"><article class="card"><span class="num">01</span><div class="emoji">🧮</div><h3>Формулы</h3><p>Найди ошибку в действиях</p></article><article class="card"><span class="num">02</span><div class="emoji">🔎</div><h3>Найди 67</h3><p>Внимание и реакция</p></article><article class="card"><span class="num">03</span><div class="emoji">⚡</div><h3>Абакус</h3><p>Два разряда, один ответ</p></article><article class="card"><span class="num">04</span><div class="emoji">🧠</div><h3>Flash-память</h3><p>Запомни число за секунды</p></article></section><div class="bottom"><div><b>🏆 Твой личный рекорд</b><div class="hint">${best?best+' сек. — попробуй улучшить!':'Первый рекорд ждёт тебя!'}</div></div><button class="primary" onclick="begin()">НАЧАТЬ ЧЕЛЛЕНДЖ →</button></div><div class="note">Для заданий с абакусом приготовь настоящий абакус. Техника проверяется педагогом.</div>`}
function begin(){start=Date.now();timer=setInterval(()=>clock.textContent='⏱ '+time(),250);stage=0;i=0;correct=0;mistakes=0;render()}
function layout(title,body){app.innerHTML=`<section class="play"><div class="step">ИСПЫТАНИЕ ${stage+1} / 4</div><div class="progress"><div style="width:${stage*25}%"></div></div><h2>${title}</h2>${body}</section>`}
function next(){i=0;stage++;if(stage===4){finish();return}render()}
function render(){locked=false;if(stage===0)formula();if(stage===1)search();if(stage===2)abacus();if(stage===3)memory()}
function formula(){locked=false;if(i===formulas.length){next();return}let f=formulas[i];layout('Найди ошибку 🕵️',`<p class="hint">Формула ${i+1} из ${formulas.length}. Правильна ли последовательность?</p><div class="question">${f.q}<div style="font-size:22px;margin-top:10px">${f.steps}</div></div><div class="choices"><button class="choice" onclick="checkFormula(true)">✓ Верно</button><button class="choice" onclick="checkFormula(false)">✕ Ошибка</button></div><div id="response"></div>`)}
function checkFormula(value){if(locked)return;locked=true;let f=formulas[i],ok=value===f.valid;if(ok)correct++;else mistakes++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('response').innerHTML=`<div class="feedback">${ok?'✨ Верно!':'💗 Не совсем.'} ${f.explain}</div><p><button class="primary" onclick="i++;formula()">ДАЛЬШЕ →</button></p>`}
function search(){found=0;let a=Array(7).fill('67').concat(['76','57','69','87','66','77','97','61','47','78','68','79','86','76','56','72','62']);for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}layout('Найди все 67 🔎',`<p class="hint">Найди 7 карточек с числом 67. Ошибочные нажатия учитываются.</p><div class="tag" id="found">Найдено: 0 / 7</div><div class="grid67">${a.map(v=>`<button class="tile" onclick="tap(this)" data-v="${v}">${v}</button>`).join('')}</div><div id="response"></div>`)}
function tap(el){if(el.disabled)return;if(el.dataset.v==='67'){el.disabled=true;el.classList.add('hit');found++;correct++;document.getElementById('found').textContent='Найдено: '+found+' / 7';if(found===7)document.getElementById('response').innerHTML='<button class="primary" onclick="next()">ГОТОВО! ДАЛЬШЕ →</button>'}else{mistakes++;el.disabled=true;el.style.opacity='.3'}}
function abacus(){locked=false;if(i===calc.length){next();return}let q=calc[i];layout('Абакус-челлендж ⚡',`<p class="hint">Пример ${i+1} из ${calc.length}. Реши на абакусе, не спеши с движениями.</p><div class="question">${q.a} + ${q.b} = ?</div><p class="hint">${q.comment}</p><input id="answer" class="field" type="number" inputmode="numeric" placeholder="Твой ответ"><p><button class="primary" onclick="checkCalc()">ПРОВЕРИТЬ →</button></p><div id="response"></div>`)}
function checkCalc(){if(locked)return;let el=document.getElementById('answer');if(!el.value.trim())return;locked=true;let q=calc[i],ok=Number(el.value)===q.a+q.b;if(ok)correct++;else mistakes++;el.disabled=true;document.getElementById('response').innerHTML=`<div class="feedback">${ok?'✨ Отлично!':'💗 Попробуем разобраться.'} Ответ: ${q.a+q.b}. Покажи педагогу движения пальцев на абакусе.</div><p><button class="primary" onclick="i++;abacus()">ДАЛЬШЕ →</button></p>`}
function memory(){locked=false;if(i===5){next();return}let digits=i<2?3:i<4?4:5;mem=String(Math.floor(Math.random()*9*10**(digits-1))+10**(digits-1));let duration=[2000,1700,1500,1300,1100][i];layout('Flash-память 🧠',`<p class="hint">Раунд ${i+1} из 5. Запомни число!</p><div class="flash" id="flash">${mem}</div><div id="response"></div>`);memTimeout=setTimeout(()=>{let el=document.getElementById('flash');if(!el)return;el.innerHTML='<input class="field" id="memAnswer" type="number" inputmode="numeric" placeholder="Какое было число?">';document.getElementById('response').innerHTML='<p><button class="primary" onclick="checkMemory()">ОТВЕТИТЬ →</button></p>';},duration)}
function checkMemory(){if(locked)return;let el=document.getElementById('memAnswer');if(!el||!el.value.trim())return;locked=true;let ok=el.value===mem;if(ok)correct++;else mistakes++;document.getElementById('response').innerHTML=`<div class="feedback">${ok?'✨ Точно!':'💗 Почти!'} Было число ${mem}.</div><p><button class="primary" onclick="i++;memory()">ДАЛЬШЕ →</button></p>`}
function finish(){clearInterval(timer);let seconds=Math.floor((Date.now()-start)/1000);clock.textContent='⏱ '+time();start=0;let old=Number(localStorage.getItem('sixSevenBest')||0);let isBest=mistakes===0&&(!old||seconds<old);if(isBest)localStorage.setItem('sixSevenBest',seconds);layout('Челлендж пройден! 🎉',`<div class="final"><div class="trophy">🏆</div><div class="question">${Math.floor(seconds/60)} мин ${seconds%60} сек</div><p><b>Правильных действий: ${correct}</b> · Ошибок: ${mistakes}</p><p>${isBest?'🌟 Новый безошибочный рекорд!':'💗 Рекорд засчитывается при прохождении без ошибок.'}</p><button class="primary" onclick="home()">НА ГЛАВНУЮ →</button><p class="note">Рекорд сохраняется только в этом браузере. Правильность движений на абакусе проверяет педагог.</p></div>`)}
home();</script></body></html>
