<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Даша · Памятка со львёнком</title><style>
*{box-sizing:border-box}body{margin:0;background:#effaff radial-gradient(#c8e6f1 1px,transparent 1px) 0 0/28px 28px;color:#18485f;font:19px/1.6 system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:16px}h1{font-size:25px;margin:0}h2{font-size:29px;margin:10px 0}h3{margin:10px 0}.lion{font-size:55px;display:inline-block;animation:sway 3s infinite ease-in-out}@keyframes sway{50%{transform:rotate(8deg) translateY(-3px)}}.card{background:white;border:2px solid #cce7f2;border-radius:26px;padding:25px;margin-bottom:20px;box-shadow:0 5px #dceef4}.tag{background:#ffe38b;border-radius:30px;padding:6px 15px;display:inline-block;font-weight:bold}.small{font-size:16px;color:#527384}button{font:inherit;color:inherit;border:0;border-radius:15px;background:#e5f4fb;padding:12px 18px;cursor:pointer}button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #e4ae22;outline-offset:3px}.blue{background:#0787ba;color:white;font-weight:bold}.gold{background:#ffe38b;font-weight:bold}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{text-align:left}.nav small{display:block;font-size:14px}.center{text-align:center}.example{font-size:42px;font-weight:bold;margin:14px 0}.formula{font-size:32px;font-weight:bold;background:#fff5d7;border-radius:18px;padding:15px}.hint{background:#eaf7fc;border-radius:18px;padding:16px;margin:15px 0}details{border-top:1px solid #d4e8f1;padding:15px 0}summary{font-weight:bold;cursor:pointer}.pairs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}.pair{display:flex;gap:7px;background:#eaf7fc;padding:12px;border-radius:14px}.rod{min-width:60px;text-align:center;border-bottom:4px solid #afd5e4;font-size:25px}.rod small{display:block;font-size:13px}.check{display:block;margin:12px 0}input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin-right:10px}table{border-collapse:collapse;width:100%;font-size:18px}td,th{padding:12px 7px;text-align:left;border-bottom:1px solid #d4e8f1}.scroll{overflow:auto}.footer{display:flex;justify-content:space-between;gap:10px;margin:20px 0}@media(max-width:600px){header,main{padding:12px}.card{padding:19px}h1{font-size:20px}h2{font-size:25px}.nav{grid-template-columns:1fr}.formula{font-size:27px}.example{font-size:36px}.rod{min-width:45px}}@media(prefers-reduced-motion:reduce){.lion{animation:none}}@media print{body{background:white}button,.nav,header,.footer{display:none}.card{box-shadow:none;break-inside:avoid}}
</style></head><body><header><span class="lion">🦁</span><div><h1>ЛЬВЁНОК · ПАМЯТКА ДЛЯ ДАШИ</h1><div class="small">Открой нужный тренажёр и повтори движения</div></div></header><main id="guide"></main><script>

const blocks=[{"title": "Пятёрки · вычитание", "place": "Начни с крайнего левого стержня. Каждый пример выполняй на одном стержне. Двигайся слева направо, не пропуская стержни.", "rhythm": "Раз — набери 5. Два — выполни вычитание. Два пальца делают обмен одновременно.", "rows": [["5 − 1", "−5 + 4", 4], ["5 − 2", "−5 + 3", 3], ["5 − 3", "−5 + 2", 2], ["5 − 4", "−5 + 1", 1]], "pair": false}, {"title": "Пятёрки · сложение", "place": "Начни с крайнего левого стержня. Каждый пример выполняй на одном стержне. Двигайся слева направо, не пропуская стержни.", "rhythm": "Раз — набери 4. Два — выполни сложение. Два пальца делают обмен одновременно.", "rows": [["4 + 1", "+5 − 4", 5], ["4 + 2", "+5 − 3", 6], ["4 + 3", "+5 − 2", 7], ["4 + 4", "+5 − 1", 8]], "pair": false}, {"title": "Вычитаем из 15", "place": "Работай парами стержней слева направо: 1–2, затем 3–4, затем 5–6 и дальше. На левом стержне пары — десятки, на правом — единицы. Один оставшийся стержень пропусти.", "rhythm": "Набери 15: десятку и пятёрку можно набрать одновременно. При вычитании указательный убирает десятку, большой добавляет единицы — одновременно. Затем переходи к следующей паре.", "rows": [["15 − 9", "−10 + 1", 6], ["15 − 8", "−10 + 2", 7], ["15 − 7", "−10 + 3", 8], ["15 − 6", "−10 + 4", 9]], "pair": true}, {"title": "Вычитаем из 14", "place": "Работай парами стержней слева направо: 1–2, затем 3–4, затем 5–6 и дальше. На левом стержне пары — десятки, на правом — единицы. Один оставшийся стержень пропусти.", "rhythm": "Сначала набери 14. Затем выполни три действия по порядку: раз, два, три. После этого переходи к следующей паре.", "rows": [["14 − 9", "−10 + 5 − 4", 5], ["14 − 8", "−10 + 5 − 3", 6], ["14 − 7", "−10 + 5 − 2", 7], ["14 − 6", "−10 + 5 − 1", 8]], "pair": true}, {"title": "Прибавляем к 5", "place": "Набери 5 на втором стержне слева. Первый оставь свободным для десятка. Следующий пример начинай на четвёртом стержне, потом на шестом. Каждый пример занимает пару. Один оставшийся стержень пропусти.", "rhythm": "Сначала набери 5. Затем выполни три действия по порядку: раз, два, три. Десяток добавляй на соседнем стержне слева.", "rows": [["5 + 9", "−5 + 4 + 10", 14], ["5 + 8", "−5 + 3 + 10", 13], ["5 + 7", "−5 + 2 + 10", 12], ["5 + 6", "−5 + 1 + 10", 11]], "pair": true}, {"title": "Прибавляем к 9", "place": "Набери 9 на втором стержне слева. Первый оставь свободным для десятка. Следующий пример начинай на четвёртом стержне, потом на шестом. Каждый пример занимает пару. Один оставшийся стержень пропусти.", "rhythm": "Сначала набери 9. Затем два действия: убери нужные единицы, добавь десяток на соседнем стержне слева.", "rows": [["9 + 9", "−1 + 10", 18], ["9 + 8", "−2 + 10", 17], ["9 + 7", "−3 + 10", 16], ["9 + 6", "−4 + 10", 15]], "pair": true}];let selected=-1,task=0;const box=document.getElementById('guide');
function hands(){return `<h2>Сначала проверяем руки</h2><label class="check"><input type="checkbox">Левой рукой держу абакус. Обнуляю его кнопкой.</label><label class="check"><input type="checkbox">В правой руке держу ручку и не откладываю её во время счёта.</label><label class="check"><input type="checkbox">Свободные пальцы собраны в кулачок, не раскрываются веером. Большой и указательный работают.</label><p class="small">Если с ручкой пока непривычно, двигайся медленнее и сохраняй положение руки.</p>`}
function menu(){selected=-1;box.innerHTML=`<div class="card"><span class="tag">Твоя подсказка</span><p>Даша, выбери тренажёр, который сейчас повторяешь. Читай порядок действий и выполняй их на своём абакусе. Если забыла движение, вернись к подсказке.</p>${hands()}</div><div class="card"><h2>Что повторяем?</h2><div class="nav">${blocks.map((b,i)=>`<button onclick="openBlock(${i})"><b>${i+1}. ${b.title}</b><small>${b.pair?'На парах стержней':'На каждом стержне'}</small></button>`).join('')}<button class="gold" onclick="mixView()">7. Чередуем задания<small>Когда отдельные движения уже понятны</small></button></div></div><p class="small center">Сначала точные движения, затем скорость. Не нужно проходить все разделы за один раз.</p>`}
function openBlock(i){selected=i;task=0;draw();window.scrollTo(0,0)}
function move(n){task=n;draw();window.scrollTo(0,0)}
function pattern(b,r){const v=r[2];return `<details><summary>Как будет выглядеть результат?</summary><div class="pairs">${Array.from({length:3},(_,i)=>b.pair?`<div class="pair"><div class="rod">${Math.floor(v/10)}<small>${i*2+1}-й слева</small></div><div class="rod">${v%10}<small>${i*2+2}-й слева</small></div></div>`:`<div class="rod">${v}<small>${i+1}-й слева</small></div>`).join('')}<span>…</span></div><p class="small">${b.pair?'Одна рамка — одна пара стержней.':'Повторяем на каждом стержне.'} Продолжай до конца абакуса. Номера здесь обозначают порядок стержней слева.</p></details>`}
function draw(){const b=blocks[selected],r=b.rows[task];box.innerHTML=`<div class="row" style="margin-bottom:18px"><button onclick="menu()">← Все тренажёры</button><span class="tag">${task+1} из ${b.rows.length}</span></div><div class="card"><h2>${b.title}</h2><div class="row">${b.rows.map((a,i)=>`<button class="${i===task?'gold':''}" onclick="move(${i})">${a[0]}</button>`).join('')}</div><div class="center"><div class="example">${r[0]}</div><div class="formula">${r[1]}</div></div><div class="hint"><b>Где работаем</b><br>${b.place}</div><h3>Как двигаем пальцами</h3><p>${b.rhythm}</p><h3>Повтори самостоятельно</h3><p>Выполни <b>${r[0]}</b> до конца абакуса. На каждом новом ${b.pair?'участке из двух стержней':'стержне'} заново набирай исходное число.</p>${pattern(b,r)}<details><summary>Проверить руки</summary>${hands()}</details><div class="hint"><b>Перед следующим тренажёром обнули абакус.</b></div><div class="footer"><button onclick="${task?'move('+(task-1)+')':'menu()'}">← Назад</button><button class="blue" onclick="${task<3?'move('+(task+1)+')':'done()'}">${task<3?'Следующий тренажёр →':'Завершить раздел'}</button></div></div>`}
function done(){box.innerHTML=`<div class="card center"><span class="lion">🦁</span><h2>Раздел пройден!</h2><p>Проверь себя: ручка оставалась в руке? Свободные пальцы были собраны? Движения получались в ровном ритме?</p><div class="row" style="justify-content:center"><button onclick="openBlock(${selected})">Повторить раздел</button><button class="blue" onclick="menu()">Все тренажёры</button></div></div>`;window.scrollTo(0,0)}
function mixView(){box.innerHTML=`<button onclick="menu()">← Все тренажёры</button><div class="card" style="margin-top:18px"><span class="tag">Меняем порядок</span><h2>Чередуем задания</h2><p>Можно повторять один тренажёр на всём абакусе. А можно на следующем стержне или следующей паре выполнять уже другой пример.</p><h3>Пятёрки: на каждом стержне</h3><div class="hint">5 − 1 → 4 + 3 → 5 − 4 → 4 + 1 → 5 − 2 → 4 + 4 → 4 + 2 → 5 − 3</div><p>Повтори эту последовательность до конца абакуса. Затем обнули его.</p><h3>Можно идти по порядку</h3><div class="hint">5 − 1 → 5 − 2 → 5 − 3 → 5 − 4 → снова 5 − 1…</div><h3>На парах стержней</h3><p>Выбери одну группу ниже. Выполняй по одному примеру на каждой следующей паре. Дойдя до четвёртого примера, повторяй последовательность до конца абакуса.</p>${blocks.slice(2).map((b,i)=>`<details><summary>${b.title}</summary><p>${b.place}</p><div class="scroll"><table><tr><th>Тренажёр</th><th>Действия</th><th>Ответ</th></tr>${b.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><p>${b.rhythm}</p></details>`).join('')}<p><b>Помни:</b> пятёрки — на каждом стержне. Задания через десяток — на парах стержней.</p><button class="blue" onclick="menu()">К выбору тренажёра</button></div>`;window.scrollTo(0,0)}
menu();
</script></body></html>
