<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Формулы по шагам</title><style>
:root{font-family:system-ui,sans-serif;color:#19372f;background:#f4f5ed}*{box-sizing:border-box}body{margin:0}header{max-width:1080px;margin:auto;padding:25px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.04em}small,.muted{color:#65746c}main{max-width:960px;margin:25px auto;padding:0 24px 50px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;margin:12px 0}h2{font-size:26px}.lead{font-size:19px;line-height:1.6;max-width:700px}.tag{display:inline-block;background:#e3eadc;padding:7px 12px;border-radius:30px;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0}.card,.panel{background:white;border:1px solid #dce3d5;border-radius:24px;padding:26px}.card{text-align:left;cursor:pointer;color:inherit}.card:hover{border-color:#397c60;transform:translateY(-2px)}.num{display:block;color:#64886c;margin-bottom:24px;font-weight:800}.card h2{margin:0 0 12px}.card p{color:#65746c;margin:0;line-height:1.5}button{font:inherit;border:0;border-radius:14px;padding:14px 22px;cursor:pointer;font-weight:650;background:#28674e;color:white}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:3px solid #e4a33a;outline-offset:4px}button.secondary{background:#e8eddf;color:#254b3b}button.text{background:transparent;color:#486454;padding:10px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.progress{height:7px;border-radius:10px;background:#dfe6d9;margin:22px 0}.progress div{height:100%;background:#438564;border-radius:10px}.panel{text-align:center;padding:38px 24px}.formula{font-size:clamp(30px,6vw,58px);font-weight:750;margin:38px 0;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}.formula input{width:92px;font:inherit;color:#19372f;text-align:center;border:2px solid #7c9d7a;background:#f4f7ee;border-radius:14px;padding:8px 0}.instruction{font-size:19px;line-height:1.6}.feedback{margin:22px auto;max-width:650px;padding:16px;border-radius:14px;background:#f5efdc;line-height:1.6}.success{background:#e5efdf}.center{justify-content:center}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.stat{background:#edf2e7;border-radius:15px;padding:20px;flex:1}.stat strong{display:block;font-size:34px}table{width:100%;border-collapse:collapse;text-align:left;font-size:15px}td,th{padding:13px 8px;border-bottom:1px solid #e6eadf}details{margin-top:25px}summary{cursor:pointer;font-weight:650}footer{line-height:1.6;margin-top:25px;color:#65746c;font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:24px 12px}.formula{gap:7px}.formula input{width:74px}header{padding:18px}.card{padding:22px}.num{margin-bottom:12px}main{padding:0 16px}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile{font-size:28px}.plan{background:#eaf0e2;border-radius:20px;padding:24px;margin:24px 0;line-height:1.7}.card .row{margin-top:18px}.badge{font-size:13px;color:#486454;margin-top:15px}.history{margin:20px 0;overflow:auto}.formula{min-height:100px}.card{cursor:default}.card:hover{transform:none}.card button{font-size:14px;padding:12px}.feedback button{margin-top:12px}@media(max-width:600px){.choices{grid-template-columns:1fr}}@media print{button,header,.progress{display:none}body{background:white}main{margin:0;max-width:none}details{display:block}}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile{font-size:28px}.plan{background:#eaf0e2;border-radius:20px;padding:24px;margin:24px 0;line-height:1.7}.card .row{margin-top:18px}.badge{font-size:13px;color:#486454;margin-top:15px}.history{margin:20px 0;overflow:auto}.formula{min-height:100px}.card{cursor:default}.card:hover{transform:none}.card button{font-size:14px;padding:12px}.feedback button{margin-top:12px}@media(max-width:600px){.choices{grid-template-columns:1fr}}@media print{button,header,.progress{display:none}body{background:white}main{margin:0;max-width:none}details{display:block}}</style><header><div class="brand">◒ ФОРМУЛЫ ПО ШАГАМ</div><span class="tag">Тестовая версия</span></header><main id="app"></main><script>
const groups=[{name:'Формулы в 5',sub:'Плюс и минус',items:[]},{name:'Формулы в 10',sub:'Плюс',items:[]},{name:'Формулы в 10',sub:'Минус',items:[]},{name:'Смешанные формулы в 10',sub:'Плюс и минус',items:[]}];
function add(g,lhs,t){groups[g].items.push({id:g+':'+lhs,g,lhs,t})}
for(let n=1;n<=4;n++){add(0,n,[-(5-n),5])}for(let n=1;n<=4;n++)add(0,-n,[5-n,-5]);
for(let n=1;n<=9;n++){add(1,n,[-(10-n),10]);add(2,-n,[10-n,-10])}
for(let n=6;n<=9;n++)add(3,n,[n-5,-5,10]);for(let n=6;n<=9;n++)add(3,-n,[-(n-5),5,-10]);
const all=groups.flatMap(g=>g.items),byId=Object.fromEntries(all.map(f=>[f.id,f])),names={danya:'Даня',dasha:'Даша'},target=['1:4','3:7','0:2'],key='formulaRoutesV2',app=document.getElementById('app');
let db={selected:null,profiles:{danya:{session:null,history:[]},dasha:{session:null,history:[]}}};try{const old=JSON.parse(localStorage.getItem(key));if(old&&old.profiles?.danya&&old.profiles?.dasha)db=old}catch{}let person=db.selected||null,s=null,notice='';
const sign=n=>(n<0?'−':'+')+Math.abs(n),full=f=>sign(f.lhs)+' = '+f.t.map(sign).join(' '),words=f=>f.t.map((n,i)=>(i?'затем ':'')+(n<0?'вычти ':'прибавь ')+Math.abs(n)).join(', ')+'.';
function persist(){if(person)db.profiles[person].session=s;db.selected=person;try{localStorage.setItem(key,JSON.stringify(db))}catch{}}
function choose(){app.innerHTML=`<span class="tag">Два маршрута · один тренажёр</span><h1>Формулы по шагам</h1><p class="lead">Выбери свой маршрут. Учись в своём темпе, вспоминай «друзей» чисел и пробуй на абакусе.</p><div class="choices">${Object.keys(names).map(id=>`<div class="card"><span class="num">${id==='danya'?'С опорой на образец':'От проверки к практике'}</span><h2 class="profile">${names[id]}</h2><p>${id==='danya'?'Посмотри на формулу и восстанови одно число.':'Вспомни формулы и повтори те, которым нужна помощь.'}</p><br><button onclick="select('${id}')">Мой маршрут →</button></div>`).join('')}</div><footer>Без таймера. Результаты Дани и Даши хранятся отдельно в этом браузере.<br>На другом устройстве история не появится автоматически.</footer>`}
function select(id){person=id;s=db.profiles[id].session;persist();dashboard()}
function dashboard(){const d=person==='danya',history=db.profiles[person].history;app.innerHTML=`<div class="row between"><button class="text" onclick="choose()">← Выбор ученика</button><span class="tag">${names[person]}</span></div><h1>${d?'Разберём по шагам':'Вспомним и потренируемся'}</h1><div class="plan"><strong>Рекомендованный маршрут</strong><p>${d?'Начни с формул в 5 в режиме «С образцом». Затем выполни проверку этого раздела и короткую практику на абакусе. Следующие разделы проходи в указанном порядке, по одному за подход.':'Начни с трёх формул для повторения: +4 через 10, смешанная +7 и +2 через 5. После них проверь остальные формулы сложения и переходи к практике на абакусе. Вычитание проверь отдельно: результатов по нему у нас пока нет.'}</p>${d?'<button onclick="startGroup(0,\'learn\')">Начать с формул в 5 →</button>':'<button onclick="start(target,\'learn\',\'Три формулы для повторения\')">Повторить три формулы →</button> <button class="secondary" onclick="start(all.filter(f=>f.lhs>0).map(f=>f.id),\'test\',\'Все формулы сложения\')">Проверить сложение</button>'}</div>${s?'<button class="secondary" onclick="resume()">Продолжить незавершённый подход →</button>':''}<div class="grid">${groups.map((g,i)=>`<section class="card"><span class="num">0${i+1} / ${g.items.length} формул</span><h2>${g.name}</h2><p>${g.sub}</p><div class="row"><button onclick="startGroup(${i},'${d?'learn':'test'}')">${d?'С образцом':'Проверить себя'}</button><button class="secondary" onclick="startGroup(${i},'${d?'test':'learn'}')">${d?'Проверить себя':'С образцом'}</button><button class="text" onclick="startGroup(${i},'practice')">Практика на абакусе →</button></div></section>`).join('')}</div><details><summary>Как устроены задания</summary><p class="lead">В формулах пропущен только «друг»: +2 = −□ +5 или +2 = −□ +10. Опорные 5 и 10 всегда видны. В смешанной +7 = +□ −5 +10 нужно вспомнить 2.</p><p>Практика на абакусе проверяет числовой ответ. Правильность движений проверяет педагог. Рекомендации здесь относятся к этой тестовой версии.</p></details><h2>Мои последние результаты</h2><div class="history">${history.length?`<table><tr><th>Задание</th><th>Режим</th><th>Самостоятельно</th></tr>${history.slice(-8).reverse().map(h=>`<tr><td>${h.title}<br><small>${h.date}</small></td><td>${modeName(h.mode)}</td><td>${h.good} / ${h.total}<br><button class="text" onclick="showReport('${h.id}')">Подробнее</button></td></tr>`).join('')}</table>`:'Здесь появятся результаты завершённых подходов.'}</div><footer>История сохраняется только в этом браузере. Новый подход заменяет незавершённый; завершённые результаты остаются.</footer>`}
function modeName(m){return m==='learn'?'С образцом':m==='practice'?'Абакус':'Без образца'}
function startGroup(g,m){start(groups[g].items.map(f=>f.id),m,groups[g].name+' · '+groups[g].sub)}
function start(ids,mode,title){s={ids:[...ids],mode,title,i:0,stage:mode==='learn'?'view':'input',records:[],help:false,wrong:0,done:false};notice='';persist();render()}
function cur(){return byId[s.ids[s.i]]}
function base(f){if(f.g===0)return f.lhs>0?4:5;if(f.g===1)return 9;if(f.g===2)return 10;return f.lhs>0?5:14}
function expected(){return s.mode==='practice'?base(cur())+cur().lhs:Math.abs(cur().t[0])}
function resume(){notice='';render()}
function render(){if(s.done){next();return}const f=cur(),view=s.stage==='view',practice=s.mode==='practice';app.innerHTML=`<div class="row between"><button class="text" onclick="pause()">← Мой маршрут / перерыв</button><span class="tag">${names[person]} · ${s.i+1} из ${s.ids.length}</span></div><div class="progress"><div style="width:${100*s.i/s.ids.length}%"></div></div><h2>${s.title}</h2><section class="panel"><span class="tag">${view?'Посмотри и запомни':practice?'Реши на абакусе':'Вспомни «друга»'}</span><div class="formula">${practice?`<span>${base(f)} ${sign(f.lhs)} =</span><input id="answer" aria-label="Ответ" inputmode="numeric" maxlength="3" onkeydown="if(event.key==='Enter')check()">`:`<span>${sign(f.lhs)} =</span>${f.t.map((n,i)=>i===0&&!view?`<span>${n<0?'−':'+'}</span><input id="answer" aria-label="Пропущенное число" inputmode="numeric" maxlength="2" onkeydown="if(event.key==='Enter')check()">`:`<span>${sign(n)}</span>`).join('')}`}</div>${view?`<p class="instruction">${words(f)}</p><p class="muted">Прочитай формулу и покажи движения на абакусе.</p><button onclick="exercise()">Запомнил, попробую →</button>`:`<p class="instruction">${practice?'Покажи движения на абакусе и впиши ответ.':'Впиши только число. Знак уже стоит.'}</p><div class="row center"><button id="check" onclick="check()">Проверить</button><button class="secondary" onclick="hint()">Посмотреть формулу</button></div><div id="feedback" aria-live="polite">${notice}</div><div id="next"></div>`}</section><footer>${practice?'Здесь проверяется ответ, а не движения пальцев.':s.mode==='learn'?'Это упражнение после образца. Самостоятельная проверка будет отдельным этапом.':'Ответ после ошибки или подсказки отмечается отдельно.'}</footer>`;if(!view){document.getElementById('answer').focus();if(notice){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}}}
function pause(){persist();dashboard()}
function exercise(){s.stage='input';s.help=false;s.wrong=0;s.done=false;notice='';persist();render()}
function hint(){if(s.done)return;s.help=true;notice=`<div class="feedback"><strong>${full(cur())}</strong><br>${words(cur())}<br><button class="secondary" onclick="hideHint()">Скрыть и попробовать снова</button></div>`;persist();document.getElementById('feedback').innerHTML=notice;document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}
function hideHint(){notice='';render()}
function check(){if(s.done)return;const input=document.getElementById('answer');if(!input||input.disabled)return;if(!/^\d{1,3}$/.test(input.value.trim())){document.getElementById('feedback').innerHTML='<div class="feedback">Впиши число без знака.</div>';return}if(Number(input.value)!==expected()){s.wrong++;hint();return}s.done=true;s.records.push({id:cur().id,independent:!s.help&&s.wrong===0,wrong:s.wrong});persist();input.disabled=true;document.getElementById('check').disabled=true;document.getElementById('feedback').innerHTML=`<div class="feedback success">Верно! ${s.help?'Получилось с подсказкой.':'Получилось самостоятельно.'}</div>`;document.getElementById('next').innerHTML='<button onclick="next()">Дальше →</button>'}
function next(){s.i++;s.done=false;s.help=false;s.wrong=0;notice='';if(s.i>=s.ids.length){finish();return}s.stage=s.mode==='learn'?'view':'input';persist();render()}
function finish(){const report={id:Date.now().toString(36),title:s.title,mode:s.mode,ids:s.ids,records:s.records,good:s.records.filter(r=>r.independent).length,total:s.records.length,date:new Date().toLocaleString('ru-RU')};db.profiles[person].history.push(report);s=null;persist();reportView(report)}
function showReport(id){reportView(db.profiles[person].history.find(h=>h.id===id))}
function reportView(h){window.lastReport=h;const trouble=h.records.filter(r=>!r.independent).map(r=>r.id);window.trouble=trouble;app.innerHTML=`<span class="tag">${names[person]} · ${modeName(h.mode)}</span><h1>Подход завершён</h1><p class="lead">${h.title}</p><div class="stats"><div class="stat"><strong>${h.good} / ${h.total}</strong>без ошибок и подсказок${h.mode==='learn'?' после образца':''}</div><div class="stat"><strong>${h.total-h.good}</strong>с помощью</div></div><div class="plan"><strong>Что сделать дальше</strong><p>${trouble.length?'Вернись к формулам, где понадобилась помощь. Сначала посмотри образец, затем проверь себя ещё раз.':h.mode==='learn'?'Теперь восстанови те же формулы без предварительного показа.':h.mode==='practice'?'Этот набор выполнен без подсказок. Покажи педагогу движения и выбери следующий раздел.':'Перенеси формулы в практику: реши короткие примеры на абакусе.'}</p><div class="row">${trouble.length?'<button onclick="start(window.trouble,\'learn\',\'Повторение формул с подсказкой\')">Повторить с образцом</button>':''}${h.mode==='learn'?'<button onclick="start(window.lastReport.ids,\'test\',window.lastReport.title)">Проверить без образцов</button>':h.mode==='test'?'<button onclick="start(window.lastReport.ids,\'practice\',window.lastReport.title)">Практика на абакусе</button>':''}<button class="secondary" onclick="dashboard()">Мой маршрут</button></div></div><details open><summary>Результат по каждой формуле</summary><table><tr><th>Формула</th><th>Результат</th></tr>${h.records.map(r=>`<tr><td>${full(byId[r.id])}</td><td>${r.independent?'Самостоятельно':'С помощью'}${r.wrong?' · ошибок: '+r.wrong:''}</td></tr>`).join('')}</table></details><br><button class="secondary" onclick="window.print()">Сохранить результат / печать</button><footer>${h.mode==='practice'?'Оценён числовой ответ. Техника движений не проверяется автоматически.':'Это результат восстановления формул, а не оценка всей техники счёта.'}</footer>`}
choose();
</script></html>
