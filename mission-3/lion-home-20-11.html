<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Львёнок · Мастерская счёта</title><style>
:root{--ink:#17465f;--blue:#0687bb;--light:#e5f4fb;--gold:#ffe38b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:18px Arial,sans-serif;background:radial-gradient(#bfe3f2 1px,transparent 1px) 0 0/28px 28px #effaff}header,main{max-width:1300px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:24px;margin:0}h2{font-size:30px}button,select,input,textarea{font:inherit;color:inherit}button,select{border:0;border-radius:18px;padding:13px 19px;background:var(--light);cursor:pointer;font-weight:bold}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ecae22;outline-offset:3px}button.primary{background:var(--blue);color:white;box-shadow:0 4px #006d96}button.gold{background:var(--gold);box-shadow:0 4px #dcb343}button:disabled{opacity:.45;cursor:default}nav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 24px}nav button{font-size:16px;padding:11px 14px}nav .active{background:var(--blue);color:white}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.tag{background:var(--gold);border-radius:40px;padding:9px 17px;font-weight:bold}.clock{background:white;padding:12px 20px;border:1px solid #c3e2ef;border-radius:20px;font-size:25px;font-variant-numeric:tabular-nums}.card{background:white;border:2px solid #cce7f2;border-radius:28px;padding:28px;margin:22px 0;box-shadow:0 6px #dbeaf0;text-align:center;min-height:340px}.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:20px 0}.problem{font-size:48px;font-weight:bold;margin:24px}.column{font-size:30px;line-height:1.3;min-width:120px;display:inline-block;text-align:right;font-variant-numeric:tabular-nums}.column div:last-child{border-bottom:3px solid #afd6e8;padding-bottom:8px}input.answer{width:160px;text-align:center;border:2px solid #a9d5e7;border-radius:15px;padding:12px;font-size:28px}.muted{color:#547486;font-size:16px}.feedback{min-height:28px;font-weight:bold}.good{color:#237853}.bad{color:#b64b34}.bottom{display:flex;justify-content:space-between;gap:10px}details{max-width:700px;margin:20px auto;background:#fff5d6;padding:15px;border-radius:16px;text-align:left}summary{cursor:pointer;font-weight:bold}.lion{font-size:86px;margin:10px}.memory{max-width:840px;margin:18px auto;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.tile{position:relative;height:98px;border:2px solid #a5d5e8;border-radius:17px;background:#d9eff9;font-size:40px;padding:20px 4px 5px;box-shadow:0 4px #acd3e2}.tile small{position:absolute;left:9px;top:5px;font-size:16px;color:var(--ink)}.tile.match{background:#dff4dc;box-shadow:0 4px #b6d5b0}.tile.open{background:#fff2c9}table{width:100%;border-collapse:collapse;text-align:left;font-size:17px}td,th{padding:13px;border-bottom:1px solid #d3e8f1}textarea{width:100%;min-height:240px;border:1px solid #c5dfea;padding:15px;border-radius:15px;font-size:16px}.hidden{display:none}@media(max-width:600px){header,main{padding:12px}h1{font-size:18px}.card{padding:16px}.top{flex-wrap:wrap}h2{font-size:25px}.tile{height:70px;font-size:29px}.memory{gap:6px}.problem{font-size:37px}button{padding:12px}.clock{font-size:20px}td,th{padding:8px;font-size:14px}}
 .mascot{display:inline-block;animation:sway 2.4s ease-in-out infinite;transform-origin:50% 85%;font-size:42px}.lion{animation:sway 2.4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-4px)}}@media(prefers-reduced-motion:reduce){.mascot,.lion{animation:none}}</style><header><h1><span class="mascot">🦁</span> ЛЬВЁНОК · ДОМАШНЯЯ МИССИЯ</h1><select id="pupil" aria-label="Ученик"><option>Даня</option><option selected>Даша</option></select></header><main><nav id="nav"></nav><div class="top"><span class="tag" id="badge"></span><div class="clock"><span id="time">00:00</span> <button id="pause" onclick="togglePause()">Пауза</button></div></div><h2 id="heading"></h2><section class="card" id="screen"></section><div class="bottom"><button onclick="go(visible[Math.max(0,visible.indexOf(stage)-1)])">Назад</button><button class="gold" onclick="go(visible[Math.min(4,visible.indexOf(stage)+1)])">Следующий этап</button></div><p class="muted">Результаты сохраняются в этом браузере. При сворачивании или после 3 минут без действий секундомер ставится на паузу. Для продолжения нажми «Продолжить».</p></main><script>
const names=['Формулы вслух','Абакус','Ментальный счёт','Физминутка','Умножение · 29.2','Деление · 12.1','Мемори с картинками','Итог'];
const formulas=[['+2 через 5','+2 = +5 −3'],['−3 через 5','−3 = −5 +2'],['+7 через 10','+7 = −3 +10'],['−8 через 10','−8 = +2 −10']];
const abacus=[[29,7,30,8,15,-6,-48,1],[36,-5,40,8,70,9,-28,1],[12,4,39,-7,92,8,-50,6],[23,-6,74,8,-60,9,45,1],[27,3,86,-4,21,5,-90,8],[80,4,-26,-7,91,8,35,2]];
const mental=[[2,71,6,95],[7,42,7,61],[45,3,92,1],[8,6,99,8],[6,81,7,43],[9,5,43,16],[6,53,27,9],[9,53,28,6],[6,6,30,47],[88,7,6,40],[91,8,65,3],[8,8,63,14],[6,7,83,29],[7,92,6,45],[5,63,1,74],[7,52,3,68],[69,3,6,71],[9,65,24,8],[19,28,7,9],[8,5,41,32]];
const mul=[[375,2],[980,4],[287,9],[716,1],[533,6],[566,5],[601,8],[526,7],[625,3],[452,8],[163,4],[349,3],[734,7],[515,3],[476,6],[127,4],[105,9],[350,5],[638,2],[147,2]];
const div=[[138,2],[192,2],[134,2],[172,2],[194,2],[178,2],[196,2],[136,2],[174,2],[198,2],[177,3],[138,3],[225,3],[282,3],[168,3],[234,3],[231,3],[294,3],[285,3],[237,3]];
const tasks={0:formulas,1:abacus,2:mental,4:mul,5:div};const icons=['🐱','🐯','🦊','🐼','🐸','🐨','🦋','🐢','🐬','🦉','🐰','🐧'];const KEY='lion-home-20-11-v1'; const visible=[2,4,5,6,7]; mental.splice(0,10);mul.splice(0,10);div.splice(0,10);
function fresh(){return {stage:2,sections:names.map(()=>({started:false,ms:0,index:0,records:[],finished:false})),mem:{deck:[],matched:[],open:[],attempts:0},note:''}}let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}let who='Даша',stage=2,running=false,last=0,memToken=0;for(const n of ['Даня','Даша'])if(!db[n])db[n]=fresh();let lastActivity=Date.now();document.addEventListener('pointerdown',()=>lastActivity=Date.now());document.addEventListener('keydown',()=>lastActivity=Date.now());let s=()=>db[who].sections[stage];function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}function fmt(ms){let v=Math.floor(ms/1000);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function tick(){if(running&&Date.now()-lastActivity>180000){running=false;render()}if(running){s().ms+=Math.min(Date.now()-last,1500);last=Date.now()}document.getElementById('time').textContent=fmt(s().ms)}setInterval(()=>{tick();save()},1000);function stop(){tick();running=false}function start(){s().started=true;s().finished=false;running=true;lastActivity=Date.now();last=Date.now();save();render()}function togglePause(){if(!s().started||s().finished||stage===7)return;if(running)stop();else{running=true;lastActivity=Date.now();last=Date.now()}render()}function go(n){if(n<0||n>7)return;stop();memToken++;db[who].mem.open=[];stage=n;db[who].stage=n;save();render()}document.getElementById('pupil').onchange=e=>{stop();memToken++;db[who].mem.open=[];who=e.target.value;stage=db[who].stage;save();render()};
const intro=['Назови формулу вслух и объясни, какие действия выполняешь.','Возьми абакус. Решай столбики сверху вниз и вводи ответ. Всего 6 примеров.','Представь абакус и считай мысленно. 10 примеров из строки 4.','Встань и приготовь ладошки. Три минуты движения и отдыха.','Возьми абакус. Умножаем трёхзначное число на однозначное. Примеры №11–20 листа 29.2.','Возьми абакус. Делим на 2 и на 3. Примеры №11–20 листа 12.1.','Открывай по две карточки. Найди 12 пар одинаковых картинок. Называть карточки можно по номерам.'];
function record(){let a=s();return a.records[a.index]||(a.records[a.index]={attempts:0,first:null,correct:false,help:'',hint:false,done:false})}function render(){document.getElementById('nav').innerHTML=visible.map((i,k)=>`<button class="${i===stage?'active':''}" onclick="go(${i})">${k+1}. ${names[i]}</button>`).join('');document.getElementById('badge').textContent=who+' · этап '+(visible.indexOf(stage)+1)+' / 5';document.getElementById('heading').textContent=names[stage];document.getElementById('time').textContent=fmt(s().ms);let pb=document.getElementById('pause');pb.disabled=!s().started||s().finished||stage===7;pb.textContent=running?'Пауза':'Продолжить';let box=document.getElementById('screen');if(stage===7){box.innerHTML=results();return}if(!s().started){box.innerHTML=`<div class="lion">🦁</div><h2>Готов${who==='Даша'?'а':''} начать?</h2><p>${intro[stage]}</p><button class="primary" onclick="start()">Начать</button>`;return}if(s().finished){box.innerHTML=`<div class="lion">🦁</div><h2>Этап завершён!</h2><p>${stage===6?'Найдено пар: '+db[who].mem.matched.length/2+' / 12':tasks[stage]?'Отмечено: '+s().records.filter(r=>r&&r.done).length+' / '+tasks[stage].length:'Спасибо за разминку!'}</p><p>Время: ${fmt(s().ms)}</p><div class="row"><button onclick="resume()">Вернуться к заданиям</button><button class="gold" onclick="go(visible[Math.min(4,visible.indexOf(stage)+1)])">Дальше</button></div>`;return}if(stage===3){box.innerHTML='<div class="lion">🙌</div><h2>Пальчиковая гимнастика</h2><p>1. Кулак, ребро, ладонь: повтори 5 раз каждой рукой.</p><p>2. Соединяй большой палец с остальными по очереди.</p><p>3. Одной рукой покажи кулак, другой ладонь. Меняй руки.</p><p>4. Потянись вверх, опусти плечи и встряхни кисти.</p><p class="muted">Ориентир: 3 минуты. Секундомер считает вверх.</p><button class="gold" onclick="finish()">Готово</button>';return}if(stage===6){renderMemory();return}let t=tasks[stage],a=s(),r=record();if(a.index>=t.length){finish();return}let subtitle=stage===2?'Строка '+4+' · №'+(a.index%10+1):'Пример №'+(a.index+11);let content=stage===0?`<div class="problem">${t[a.index][0]}</div>`:stage===1||stage===2?`<div class="column">${t[a.index].map((v,i)=>'<div>'+(i&&v>0?'+':'')+v+'</div>').join('')}</div>`:`<div class="problem">${t[a.index][0]} ${stage===4?'×':'÷'} ${t[a.index][1]} = ?</div>`;
box.innerHTML=`<span class="tag">${subtitle} · ${a.index+1} / ${t.length}</span><div class="row">${content}</div>${stage===0?'':`<div class="row"><input class="answer" id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="Ответ" value="${r.answer??''}"><button class="primary" onclick="check()">Проверить</button></div><div class="feedback ${r.correct?'good':''}" id="feedback">${r.correct?'Верно! Отметь, как решал'+(who==='Даша'?'а':'')+'.':''}</div>`}${memo()}<div class="row">${stage===2?'':`<button onclick="mark('Самостоятельно')">Самостоятельно</button><button onclick="mark('По памятке')">По памятке</button><button onclick="mark('С помощью')">С помощью</button>`}<button onclick="mark('Пропущено')">Пропустить</button></div><div class="row"><button onclick="prev()" ${a.index===0?'disabled':''}>Предыдущий пример</button><button onclick="finish()">Завершить этап</button></div>`;let inp=document.getElementById('answer');if(inp){inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(record().correct)mark(record().help||'Самостоятельно');else check()}};inp.oninput=()=>{record().correct=false};inp.focus()}}
function memo(){if(stage===0)return `<details ontoggle="if(this.open){record().hint=true;save()}"><summary>Памятка</summary><p>${formulas[s().index][1]}</p></details>`;if(stage===4)return '<details ontoggle="if(this.open){record().hint=true;save()}"><summary>Вспомнить правило</summary><p>Три знака + один знак = четыре. Начинаем с 4-го домика.</p><p>Умножаем цифры первого множителя слева направо. Однозначное произведение проговариваем как 0 и цифру. Результат каждого действия добавляем к уже набранному, абакус не обнуляем.</p></details>';if(stage===5)return `<details ontoggle="if(this.open){record().hint=true;save()}"><summary>Вспомнить правило</summary><p>Сначала назови делитель: ${div[s().index][1]}.</p><p>В делимом 3 знака, в делителе 1. Вычитаем ещё 1 за знак деления: 3 − 1 − 1 = 1. Начинаем набирать делимое с 1-го стержня.</p><p>🐯 Первая цифра текущего числа больше делителя или равна ему: ставим защиту, ответ набираем слева через один стержень.</p><p>🐱 Первая цифра меньше делителя: без защиты, ответ набираем на соседнем стержне слева.</p><p>На каждом шаге определяем заново: могут встретиться и тигр, и котик.</p></details>`;return ''}
function expected(){let t=tasks[stage][s().index];return stage===4?t[0]*t[1]:stage===5?t[0]/t[1]:t.reduce((a,b)=>a+b,0)}function check(){if(!running){document.getElementById('feedback').textContent='Нажми «Продолжить», чтобы продолжить работу.';return}let v=document.getElementById('answer').value.trim(),r=record();if(!/^-?\d+$/.test(v)){document.getElementById('feedback').textContent='Введи целое число.';return}if(r.correct&&r.answer===v)return;let ok=Number(v)===expected();r.attempts++;if(r.first===null)r.first=ok;r.answer=v;r.correct=ok;save();if(ok&&stage===2){mark('Самостоятельно');return;}let f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Верно! Выбери отметку ниже. Enter: самостоятельно.':'Пока не совпало. Проверь вычисления или попроси помощь.'}
function mark(help){if(!running)return;let r=record();if(stage!==0&&help!=='Пропущено'&&!r.correct){document.getElementById('feedback').textContent='Сначала проверь ответ или нажми «Пропустить».';return}r.help=help;r.done=true;s().index++;save();if(s().index>=tasks[stage].length)finish();else render()}function prev(){if(s().index>0){s().index--;render()}}function finish(){stop();s().finished=true;save();render()}function resume(){if(tasks[stage]&&s().index>=tasks[stage].length)s().index=0;s().finished=false;start()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function renderMemory(){let m=db[who].mem;if(!m.deck.length){m.deck=shuffle([...icons,...icons]);save()}document.getElementById('screen').innerHTML=`<h2>Открой две карточки</h2><p>Пары: <b>${m.matched.length/2} / 12</b> · Попытки: <b>${m.attempts}</b></p><div class="memory">${m.deck.map((v,i)=>{let match=m.matched.includes(i),open=m.open.includes(i);return `<button class="tile ${match?'match':open?'open':''}" aria-label="Карточка ${i+1}${match||open?' '+v:''}" onclick="flip(${i})"><small>${i+1}</small>${match||open?v:'🌿'}</button>`}).join('')}</div><button onclick="finish()">Завершить игру</button>`}
function flip(i){if(!running)return;let m=db[who].mem;if(m.open.length===2||m.matched.includes(i)||m.open.includes(i))return;m.open.push(i);if(m.open.length===2){m.attempts++;let [a,b]=m.open;if(m.deck[a]===m.deck[b]){m.matched.push(a,b);m.open=[];if(m.matched.length===24){finish();return}}else{let token=++memToken;setTimeout(()=>{if(memToken!==token)return;m.open=[];save();if(stage===6&&!s().finished)renderMemory()},1100)}}save();renderMemory()}
function summary(i){let a=db[who].sections[i],r=a.records.filter(x=>x&&x.done);if(i===6)return `${db[who].mem.matched.length/2}/12 пар; попыток ${db[who].mem.attempts}`;if(i===3)return a.finished?'Выполнено':a.started?'Начато':'Не выполнено';let valid=r.filter(x=>x.help!=='Пропущено'),self=valid.filter(x=>x.help==='Самостоятельно').length,help=valid.filter(x=>x.help==='С помощью').length,hint=valid.filter(x=>x.help==='По памятке').length;return `${valid.filter(x=>x.first===true).length}/${r.length} с первого раза; выполнено ${valid.length}/${tasks[i].length}${i===2?'':'; памятка: '+hint+', помощь: '+help}${r.length>valid.length?'; пропущено: '+(r.length-valid.length):''}`}
function stageTotal(i,n){return `${n}/${tasks[i].length}`}
function report(){return `ЛЬВЁНОК · ${who} · ${new Date().toLocaleDateString('ru-RU')}\n`+visible.filter(i=>i!==7).map(i=>`${names[i]}: ${summary(i)} | ${fmt(db[who].sections[i].ms)}`).join('\n')+'\nВремя работы: '+fmt(db[who].sections.reduce((a,x)=>a+x.ms,0))+(db[who].note?'\nКомментарий: '+db[who].note:'')}
function esc(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function results(){return `<h2>Сегодня получилось! 🦁</h2><table><thead><tr><th>Этап</th><th>Результат</th><th>Время</th></tr></thead><tbody>${visible.filter(i=>i!==7).map(i=>`<tr><td>${names[i]}</td><td>${summary(i)}</td><td>${fmt(db[who].sections[i].ms)}</td></tr>`).join('')}</tbody></table><p class="muted">Главный результат: верно с первой попытки / отмечено заданий. Исправленный ответ не увеличивает этот результат.</p><p><label>Комментарий педагога <input id="note" style="width:100%;padding:12px" value="${esc(db[who].note)}" oninput="db[who].note=this.value;save();document.getElementById('report').value=report()"></label></p><textarea id="report" readonly aria-label="Короткий отчет">${esc(report())}</textarea><div class="row"><button class="primary" onclick="copyReport()">Копировать результат</button><button onclick="download()">Скачать результат</button><button onclick="resetPupil()">Начать заново</button></div><p id="copyState" class="muted"></p>`}
async function copyReport(){let t=document.getElementById('report');try{await navigator.clipboard.writeText(t.value);document.getElementById('copyState').textContent='Скопировано!'}catch{t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}document.getElementById('copyState').textContent=ok?'Скопировано!':'Текст выделен. Нажми Ctrl+C.'}}function download(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=who+'-результат.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function resetPupil(){if(confirm('Удалить результаты '+who+' только в этом уроке?')){stop();db[who]=fresh();stage=2;save();render()}}document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();save();render()}});window.addEventListener('blur',()=>{stop();save();render()});window.addEventListener('beforeunload',()=>{stop();save()});stage=db[who].stage;render();
</script></html>
