<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НейроПауза · Пять шагов</title><style>*{box-sizing:border-box}body{margin:0;background:#eae1d7;color:#483c35;font:17px Arial,sans-serif}main{max-width:1120px;margin:auto;padding:28px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header{margin-bottom:25px}h1{font:clamp(40px,6vw,72px) Georgia;margin:15px 0}h2{font:30px Georgia}small,.label{color:#967563;letter-spacing:2px;font-size:12px;text-transform:uppercase}.card{background:#faf5ee;border:1px solid white;border-radius:28px;padding:30px;box-shadow:0 20px 60px #65514312;margin-bottom:20px}p{line-height:1.6;max-width:800px}button,select,input{font:inherit;border:1px solid #ceb9a8;border-radius:12px;padding:12px 16px;background:#fffaf5;color:inherit}button{cursor:pointer}button:hover{background:#eadbce}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a26e4e}button:disabled{opacity:.45;cursor:default}.primary{background:#695346;color:white;border-color:#695346}.primary:hover{background:#806453}#clock{font:56px Georgia;font-variant-numeric:tabular-nums}#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:22px}#grid button{padding:13px 3px;font-weight:bold;font-size:19px}#grid button.picked{background:#d7dfcb;border-color:#869473}#grid.hidden{visibility:hidden}#status{min-height:28px}#bar{height:5px;background:#af8971;width:100%;transition:width .2s}.rail{background:#e8dccc;margin:15px 0;border-radius:5px;overflow:hidden}#tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#tabs .active{background:#695346;color:white}.hint{font-size:14px;color:#7c6d62}#results p{margin:8px 0}input[type=number]{width:95px}footer{text-align:center;font-size:13px;color:#8a7769;padding:15px}@media(max-width:700px){main{padding:15px}.card{padding:20px}#grid{grid-template-columns:repeat(5,1fr)}#grid button{font-size:17px;padding:10px 2px}}#task{text-align:center}.numbers{font:42px Georgia;line-height:1.4;display:inline-block;text-align:right;min-width:130px}.choices{display:flex;justify-content:center;gap:15px;margin:20px}.schulte{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;max-width:560px;margin:20px auto}.schulte button{padding:12px 0;font-size:22px}.done{opacity:.25}#answer{width:160px;font-size:25px}textarea{width:100%;height:180px}li{text-align:left;line-height:1.7}.progress{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.badge{padding:8px 14px;border-radius:20px;background:#f9f4ee;font-size:14px}.current{background:#695346;color:white}#time{font:32px Georgia}.report{white-space:pre-wrap;font:15px/1.6 Arial;text-align:left}button{margin:3px}@media(max-width:500px){.schulte button{font-size:18px}}</style><main><header><strong style="font:28px Georgia">НейроПауза ✳</strong><small>Екатерина Куклева · Сила интеллекта</small></header><div class="progress" id="progress"></div><section class="card"><div class="row"><span class="label" id="caption">Домашняя тренировка</span><span id="time"></span></div><div id="task"></div></section><footer>Маленькие шаги · Точные движения · Свой темп</footer></main><script>
const A=[[79,-26,24],[93,38,40],[32,86,49],[62,-33,54],[37,48,54],[25,34,98],[62,74,39],[92,36,-26],[23,58,56],[61,53,-39]];
const M=[[28,77,-5],[57,4,92],[43,8,-51],[50,50,5],[16,35,-1],[39,6,-14],[7,42,86],[28,8,-19],[2,59,-48],[28,5,57]];
const T=[[154,-67],[86,64],[104,-79],[97,26]],titles=['Техника','Ментально','Шульте','Абакус','Слова'];
const dictionary=new Set('простокваша простак простор покров покос прокос прокат прокол просо просак парк пар порт пост пот кот кит ток тон нос сон сок сор сорт спорт спор спора стопа стон трос трон тропа рот рост рота росток восток остров островок воск вор ворон ворона ворота ворот вино винт вата виток висок квас квота кран крона крот кино кон контора кант капот капрон копна корова корона корка кора корт коса косинка котик кошка рак рана риск рис ров танк тапок такси такса тина тип тир тост торт топка топор топорик торс тоска нора норка новатор нотка нота натиск наст напор нарост окно окоп опора опрос опт оптика оптик оса осина осока острота панк паника парик парник парта патрон пастор паста патио пират пик пика пион пир пиво писк питон повар понос пора порок портик потир потоп право правка правота пропан рапорт рапс раскоп раскат раствор ротан сатин сват свинка свист свиток свита скат скит скот скотина скрип скрипт скопа сноп сноска соринка сорока сотка сотник соты спина спирт стан станок старик створ стирка стопор стопка сток строка стропа строп товар трап трава транш тропик шина шип шок шора шорник штора шкаф шпон шпора шпик шпинат шпак шпрот шпрота шрот штопка штопор шток шар шарик шрам шнапс икра иконка икона искра'.split(' '));
// Только слова, составленные из исходных букв, могут быть приняты словарем.
const key='neuro-five-v1',$=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}let session=Date.now();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(name){s={name,stage:0,started:false,order:{1:shuffle(M),3:shuffle(A)},logs:[],times:{},elapsed:0,index:0,retry:[],correcting:false,choice:null,words:[],grid:shuffle(Array.from({length:49},(_,i)=>i+1)),next:1,errors:0};session=Date.now();save();render()}
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
function elapsed(){return s.elapsed+(s.started?Date.now()-session:0)}
function fmt(ms){let n=Math.floor(ms/1000);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function welcome(){ $('task').innerHTML='<h1>Пять шагов<br>к уверенному счету</h1><p>Техника → ментальный счет → Шульте → абакус → слова. После тренировки сохраните отчет для педагога.</p><label>Твое имя <input id="name" maxlength="50"></label><p><button class="primary" onclick="fresh($(\'name\').value.trim()||\'Ученик\')">Начать тренировку</button></p>'}
function render(){if(!s){welcome();return}$('progress').innerHTML=titles.map((t,i)=>'<span class="badge '+(i===s.stage?'current':'')+'">'+(i+1)+' · '+t+'</span>').join('');$('caption').textContent=s.stage<5?titles[s.stage]:'Результаты';$('time').textContent=fmt(elapsed());if(s.stage===5){report();return}if(!s.started){$('task').innerHTML='<h1>'+titles[s.stage]+'</h1><p>'+['Выбери первое действие, затем реши пример на абакусе. Сначала десятки, затем единицы.','Считай на мысленном абакусе, помогая себе пальцами. 10 примеров.','Нажимай числа от 1 до 49 по порядку.','Реши 10 примеров на абакусе. Сначала старший разряд.','За минуту введи существительные из букв слова ПРОСТОКВАШИНО. Enter добавляет слово. Начальная форма, без имен собственных; букву О можно использовать трижды, остальные по одному разу. Незнакомые словарю слова сохранятся для проверки педагогом.'][s.stage]+'</p><button class="primary" onclick="begin()">Начать этап</button>';return}if(s.stage===2){drawGrid();return}if(s.stage===4){drawWords();return}drawMath()}
function begin(){s.started=true;session=Date.now();save();render()}
function list(){return s.correcting?s.retry:(s.stage===0?T:s.order[s.stage])}
function drawMath(){let a=list()[s.index];if(!a){endMath();return}let technique=s.stage===0&&s.choice===null;$('task').innerHTML='<h2>'+(s.correcting?'Пересчет':'Пример')+' '+(s.index+1)+' из '+list().length+'</h2><div class="numbers">'+a.map((n,i)=>(i&&n>0?'+':'')+n).join('<br>')+'</div>'+(technique?'<p>Какое действие выполнишь первым?</p><div class="choices">'+[Math.trunc(a[1]/10)*10,a[1]%10].map(n=>'<button onclick="choose('+n+')">'+(n>0?'+':'')+n+'</button>').join('')+'</div>':'<p id="feedback" role="status">'+(s.stage===0?'Теперь выполни весь пример на абакусе.':'Введи ответ')+'</p><form id="mathForm"><input id="answer" type="number" step="1" required autocomplete="off" aria-label="Ответ"><button class="primary">Ответить</button></form>');$('answer')?.focus()}
function choose(n){let a=list()[s.index],right=Math.trunc(a[1]/10)*10;s.logs.push({stage:0,type:'Порядок',example:a,answer:n,right,ok:n===right});s.choice=n;save();drawMath();$('feedback').textContent=n===right?'Верно. Выполни пример на абакусе.':'Сначала '+(right>0?'+':'')+right+', затем единицы. Теперь реши пример.'}
function answer(e){e.preventDefault();let input=$('answer');if(input.value==='')return;let a=list()[s.index],v=Number(input.value),right=a.reduce((x,y)=>x+y,0);s.logs.push({stage:s.stage,type:s.correcting?'Пересчет':'Ответ',example:a,answer:v,right,ok:v===right});if(!s.correcting&&v!==right)s.retry.push(a);if(s.correcting&&v!==right){$('feedback').textContent='Пока неверно. Пересчитай, начиная со старшего разряда.';input.select();save();return}s.index++;s.choice=null;save();drawMath()}
function endMath(){if(!s.correcting&&s.retry.length){s.correcting=true;s.index=0;$('task').innerHTML='<h2>Первая попытка сохранена</h2><p>Нужно пересчитать: '+s.retry.length+'. Время этапа продолжает идти.</p><button onclick="drawMath()">Исправить</button>';save();return}complete()}
function complete(){s.times[s.stage]=elapsed();s.started=false;s.elapsed=0;s.stage++;s.index=0;s.retry=[];s.correcting=false;s.choice=null;save();render()}
function drawGrid(){$('task').innerHTML='<h2>Найди число <span id="target">'+s.next+'</span></h2><div class="schulte">'+s.grid.map(n=>'<button class="'+(n<s.next?'done':'')+'" onclick="pick('+n+',this)">'+n+'</button>').join('')+'</div><p id="error">Ошибочных нажатий: '+s.errors+'</p>'}
function pick(n,b){if(n===s.next){b.className='done';s.next++;if(s.next===50){complete();return}$('target').textContent=s.next}else{s.errors++;$('error').textContent='Ошибочных нажатий: '+s.errors}save()}
function drawWords(){$('task').innerHTML='<h1 style="font-size:clamp(25px,5vw,48px)">ПРОСТОКВАШИНО</h1><form id="wordForm"><input id="word" autocomplete="off" maxlength="50" aria-label="Слово"><button class="primary">Добавить</button></form><p>Введено: <b id="wc">'+s.words.length+'</b></p><ul id="wl">'+s.words.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>';$('word').focus()}
function addWord(e){e?.preventDefault();if(elapsed()>=60000){finishWords();return}let w=$('word').value.trim().toLowerCase();if(w){s.words.push(w);$('word').value='';$('wc').textContent=s.words.length;$('wl').innerHTML=s.words.map(w=>'<li>'+esc(w)+'</li>').join('');save()}}
function finishWords(){if(s.stage!==4)return;let w=$('word')?.value.trim().toLowerCase();if(w)s.words.push(w);s.elapsed=60000;s.started=false;completeWords()}
function completeWords(){s.times[4]=60000;s.stage=5;save();render()}
function wordChecks(){let seen=new Set();return s.words.map(w=>{let status;if(seen.has(w))status='Повтор';else{let pool={};for(let c of 'простоквашино')pool[c]=(pool[c]||0)+1;let valid=/^[а-яё]+$/.test(w)&&[...w].every(c=>{pool[c]=(pool[c]||0)-1;return pool[c]>=0});status=!valid?'Недопустимые буквы или их количество':dictionary.has(w)?'Принято':'Нужна проверка написания и части речи'}seen.add(w);return {w,status}})}
function textReport(){let lines=['НЕЙРОПАУЗА · Пять шагов','Ученик: '+s.name,'Дата: '+new Date().toLocaleDateString('ru-RU'),''];for(let stage of [0,1,3]){let rows=s.logs.filter(r=>r.stage===stage&&r.type==='Ответ');lines.push(titles[stage]+': '+rows.filter(r=>r.ok).length+'/'+rows.length+' с первой попытки; время '+fmt(s.times[stage]||0));s.logs.filter(r=>r.stage===stage).forEach(r=>lines.push(r.type+' | '+r.example.map((n,i)=>(i&&n>=0?'+':'')+n).join(' ')+' | ответ '+r.answer+' | '+(r.ok?'верно':'неверно, правильно '+r.right)));lines.push('')}lines.push('Шульте: '+fmt(s.times[2]||0)+'; ошибок '+s.errors,'','Слова: 1:00');let checks=wordChecks();checks.forEach((r,i)=>lines.push((i+1)+'. '+r.w+' — '+r.status));lines.push('Принято: '+checks.filter(r=>r.status==='Принято').length+'; требуют проверки: '+checks.filter(r=>r.status.startsWith('Нужна')).length,'','Общее время заданий: '+fmt(Object.values(s.times).reduce((a,b)=>a+b,0)));return lines.join('\n')}
function report(){$('time').textContent='Готово';$('task').innerHTML='<h1>Тренировка завершена ✳</h1><p>Сохрани отчет и отправь педагогу. Неизвестные словарю слова не считаются ошибками: они отмечены для проверки.</p><button class="primary" onclick="download()">Скачать отчет</button><button onclick="copy()">Скопировать результат</button><button onclick="if(confirm(\'Начать заново? Текущий результат будет заменен.\'))fresh(s.name)">Новая тренировка</button><p id="copied" role="status"></p><pre class="report">'+esc(textReport())+'</pre>'}
function download(){let url=URL.createObjectURL(new Blob([textReport()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='neuro_result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copy(){try{await navigator.clipboard.writeText(textReport());$('copied').textContent='Скопировано!'}catch{$('copied').textContent='Копирование недоступно. Скачай отчет кнопкой слева.'}}
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='mathForm')answer(e);else if(e.target.id==='wordForm')addWord(e)});
if(s?.started){s.started=false}render();setInterval(()=>{if(!s?.started)return;let t=elapsed();$('time').textContent=fmt(s.stage===4?Math.max(0,60000-t):t);if(s.stage===4&&t>=60000)finishWords()},100);setInterval(()=>{if(s?.started){s.elapsed=elapsed();session=Date.now();save()}},1000);
</script></html>
