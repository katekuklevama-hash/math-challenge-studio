eight:650;cursor:pointer}.choice:hover{border-color:#a78184;background:#fffbfc}.words{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:470px;margin:25px auto}.word{background:#fff;border:1px solid #d6d5df;padding:14px 8px;text-align:center;border-radius:12px;font-weight:750;font-size:clamp(15px,3vw,19px);letter-spacing:1px}.memoryfield{min-height:125px;resize:vertical}.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px 0}.result{border:1px solid #e2d6cc;background:#fff;border-radius:16px;padding:20px}.result b{display:block;font:normal 31px Georgia,serif;margin-top:9px}.result small{color:#88766a}.foot{font-size:12px;color:#84766e;text-align:center;margin-top:18px;line-height:1.6}.countdown{font:normal 64px Georgia,serif;text-align:center;margin:24px 0}.separator{height:1px;background:#dfd4cb;margin:24px 0}.note{font-size:13px;color:#796d65;line-height:1.65}.mark{font-size:13px;font-weight:750;color:#987461}.hidden{display:none!important}@media(max-width:500px){.wrap{padding:12px 10px 30px}.top{margin:8px 5px 14px}.brand{font-size:20px}.content{min-height:530px;padding:25px 20px}.h1{letter-spacing:-2px}.resultgrid{grid-template-columns:1fr}.choices{gap:8px}.choice{padding:16px 7px}.letter{min-width:39px;padding:12px 7px}.pill{font-size:10px}.stats{gap:6px}.stat{font-size:12px;padding:9px}}

function header(num,name,total,theme){return `<div class="taskhead"><div><div class="eyebrow">Упражнение ${num} / 04</div><h2 class="h2">${name}</h2></div><div class="timer" id="clock">0,0 с</div></div><div class="mini">Задание <span id="current">1</span> из ${total}</div>`;}
function mathPage(){progress(12);render(header('01','Считаем в уме',math.length)+`<p class="instruction">Решайте примеры устно и вводите ответы. В каждом примере числа и результат — в пределах 10, без перехода через десяток.</p><div class="question" id="prompt"></div><form id="mathform" class="answerbox"><input class="field" id="answer" type="number" inputmode="numeric" placeholder="Введите ответ" autocomplete="off" aria-label="Ответ на пример"><div class="buttons" style="justify-content:center"><button class="btn" type="submit">Ответить →</button><button class="btn secondary" type="button" id="skip">Пропустить</button></div></form><div class="hint">Без калькулятора — просто попробуйте!</div>`,'cream');document.getElementById('mathform').onsubmit=e=>{e.preventDefault();const v=document.getElementById('answer').value;if(v.trim()==='')return;submitMath(Number(v));};document.getElementById('skip').onclick=()=>submitMath(null);showMath();timer();}function showMath(){document.getElementById('prompt').textContent=math[idx][0];document.getElementById('current').textContent=idx+1;document.getElementById('answer').value='';document.getElementById('answer').focus();}function submitMath(v){if(v===math[idx][1])correct++;else{misses++;}idx++;if(idx>=math.length){finish('math','Устный счёт','anagrams');return;}showMath();}function finish(key,label,next){elapsed=performance.now()-startAt;stop();results[key]={correct,total:key==='stroop'?palette.length:key==='math'?math.length:anagrams.length,elapsed,penalty};progress(key==='math'?25:key==='anagrams'?50:75);render(`<div class="eyebrow">Упражнение завершено</div><h2 class="h2">${label} — готово!</h2><p class="lead">Правильных ответов: <b>${correct} из ${results[key].total}</b>.</p><div class="resultgrid"><div class="result">Время выполнения<b>${fmt(elapsed)}</b></div><div class="result">Ответов с ошибкой или пропуском<b>${results[key].total-correct}</b></div></div><div class="buttons"><button class="btn" id="next">Следующее упражнение →</button></div>`);document.getElementById('next').onclick=()=>go(next);}
function anagramPage(){progress(36);render(header('02','Перепутанные буквы',anagrams.length)+`<p class="instruction">Переставьте буквы и составьте слово. Составьте знакомое слово из всех букв. Если возможны разные слова, засчитывается любое подходящее.</p><div class="letterline" id="letters"></div><form id="anaform" class="answerbox"><input class="field" id="answer" type="text" autocomplete="off" autocapitalize="characters" placeholder="Какое слово получилось?" aria-label="Собранное слово"><div class="buttons" style="justify-content:center"><button class="btn" type="submit">Ответить →</button><button class="btn secondary" type="button" id="skip">Пропустить</button></div></form>`,'sage');document.getElementById('anaform').onsubmit=e=>{e.preventDefault();const v=document.getElementById('answer').value.trim();if(!v)return;submitAna(v);};document.getElementById('skip').onclick=()=>submitAna('');showAna();timer();}function showAna(){document.getElementById('letters').innerHTML=[...anagrams[idx][0]].map(x=>`<div class="letter">${x}</div>`).join('');document.getElementById('current').textContent=idx+1;document.getElementById('answer').value='';document.getElementById('answer').focus();}function submitAna(v){if(anagrams[idx][1].includes(v.trim().toLocaleUpperCase('ru-RU').replace(/Ё/g,'Е')))correct++;else{misses++;}idx++;if(idx>=anagrams.length){finish('anagrams','Анаграммы','stroop');return;}showAna();}
function stroopPage(){progress(62);render(header('03','Цветовой вызов',palette.length)+`<p class="instruction">Нажимайте на <b>цвет букв</b>, а не на то, что написано. Следующее слово появится автоматически. Ошибки не добавляют время.</p><div class="colorword" id="colorword"></div><div class="choices" id="choices"></div><p class="hint">Выбирайте быстро, но внимательно.</p>`,'rose');showStroop();timer();}function showStroop(){const [word,color]=palette[idx];document.getElementById('colorword').textContent=word;document.getElementById('colorword').style.color=colors[color];document.getElementById('current').textContent=idx+1;document.getElementById('choices').innerHTML=Object.keys(colors).map(c=>`<button class="choice" data-c="${c}" type="button">${c.charAt(0)+c.slice(1).toLowerCase()}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.c===palette[idx][1])correct++;else{misses++;}idx++;if(idx>=palette.length){finish('stroop','Цветовой вызов','memory');return;}showStroop();});}
function memoryPage(){progress(83);remaining=60;memoryStart=performance.now();render(`<div class="taskhead"><div><div class="eyebrow">Упражнение 04 / 04</div><h2 class="h2">Запомните слова</h2></div><div class="timer" id="memtimer">01:00</div></div><p class="instruction">У вас <b>60 секунд</b>, чтобы запомнить 10 слов. Затем список исчезнет и появится поле для ответа. Можно закончить запоминание раньше.</p><div class="words">${words.map(w=>`<div class="word">${w}</div>`).join('')}</div><div class="buttons" style="justify-content:center"><button class="btn" id="ready">Я запомнил(а) →</button></div>`,'lav');document.getElementById('ready').onclick=recallPage;memoryInterval=setInterval(()=>{remaining=Math.max(0,60-Math.floor((performance.now()-memoryStart)/1000));const el=document.getElementById('memtimer');if(el)el.textContent='00:'+String(remaining).padStart(2,'0');if(remaining===0)recallPage();},120);}
function recallPage(){if(stage!=='memory')return;stage='recall';clearInterval(memoryInterval);memoryInterval=null;const used=Math.min(60000,performance.now()-memoryStart);render(`<div class="eyebrow">Упражнение 04 / 04 · Вспоминаем</div><h2 class="h2">Какие слова вы запомнили?</h2><p class="instruction">Список уже скрыт. Запишите все слова, которые помните, в любом порядке. Разделяйте слова пробелами, запятыми или переносами строк. Можно не торопиться.</p><form id="recallform"><textarea class="field memoryfield" id="recalled" placeholder="Например: лес, кот, ..." aria-label="Вспомнившиеся слова"></textarea><div class="buttons"><button class="btn" type="submit">Посмотреть результат →</button></div></form><p class="note">Время запоминания: ${fmt(used)}. Здесь оценивается количество правильно вспомненных слов.</p>`,'lav');document.getElementById('recallform').onsubmit=e=>{e.preventDefault();const entered=document.getElementById('recalled').value.toLocaleUpperCase('ru-RU').replace(/Ё/g,'Е').split(/[\s,;.!?]+/).filter(Boolean);const unique=[...new Set(entered)];const valid=unique.filter(x=>words.includes(x));results.memory={correct:valid.length,total:words.length,elapsed:used,entered:unique,valid};go('results');};}
function summary(){progress(100);const r=results,all=['math','anagrams','stroop'];const time=all.reduce((a,k)=>a+r[k].elapsed,0);const totalCorrect=all.reduce((a,k)=>a+r[k].correct,0);render(`<div class="eyebrow">Тренировка завершена · отлично, что попробовали!</div><h2 class="h2">Ваша НейроПауза ✳</h2><p class="lead">Четыре упражнения позади. Здесь нет хороших или плохих результатов — только повод заметить, что получается легко, а что хочется потренировать.</p><div class="resultgrid"><div class="result"><small>01 · Устный счёт</small><b>${r.math.correct} / ${r.math.total}</b><small>Время: ${fmt(r.math.elapsed)}</small></div><div class="result"><small>02 · Анаграммы</small><b>${r.anagrams.correct} / ${r.anagrams.total}</b><small>Время: ${fmt(r.anagrams.elapsed)}</small></div><div class="result"><small>03 · Цветовой вызов</small><b>${r.stroop.correct} / ${r.stroop.total}</b><small>Время: ${fmt(r.stroop.elapsed)}</small></div><div class="result"><small>04 · Память</small><b>${r.memory.correct} / 10</b><small>Правильно воспроизведённых слов</small></div></div><div class="separator"></div><p class="note">Правильные ответы на задания со скоростью: <b>${totalCorrect} из ${math.length+anagrams.length+palette.length}</b>. Сумма времени первых трёх упражнений: <b>${fmt(time)}</b>. Время на запоминание слов учитывается отдельно.</p><div class="buttons"><button class="btn" id="again">Пройти ещё раз ↻</button><button class="btn secondary" id="share">Скопировать результат</button></div><p class="note" style="margin-top:25px">Создано Екатериной Куклевой. Интерактивные задания — один из способов сделать практику интереснее. Эта игра не является тестом интеллекта или медицинской диагностикой.</p>`);document.getElementById('again').onclick=()=>{results={};go('welcome');};document.getElementById('share').onclick=async()=>{const msg=`Моя НейроПауза 🧠\nСчёт: ${r.math.correct}/10\nАнаграммы: ${r.anagrams.correct}/10\nЦвета: ${r.stroop.correct}/10\nПамять: ${r.memory.correct}/10`;try{await navigator.clipboard.writeText(msg);document.getElementById('share').textContent='Скопировано ✓';}catch(e){const a=document.createElement('textarea');a.value=msg;document.body.append(a);a.select();document.execCommand('copy');a.remove();document.getElementById('share').textContent='Скопировано ✓';}};}
welcome();})();
</script></body></html>
