<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIX SEVEN · Halloween Memory Quest</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#55334f;background:#fff1f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#ffe1ee,transparent 42%),linear-gradient(135deg,#fff6f9,#f4e6ff);min-height:100vh}.wrap{max-width:950px;margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;color:#a65385;font-weight:900;letter-spacing:2px;font-size:12px;margin-bottom:12px}.hero{border-radius:32px;padding:30px;background:linear-gradient(115deg,#ffe3f0,#f2dcff);border:2px solid white;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{font-size:clamp(30px,5vw,53px);line-height:1.06;margin:12px 0}.hero h1 span{color:#ce5d9e}.hero p{line-height:1.6;margin:0}.cat{font-size:clamp(70px,14vw,140px)}.panel{background:#fff;border:1px solid #f1cde3;border-radius:29px;margin-top:18px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 35px #c989b71a}h2{font-size:clamp(23px,4vw,34px);margin:0 0 12px}.muted{color:#8c7187;line-height:1.6}.pill{display:inline-block;background:#f9e6f2;border-radius:30px;padding:9px 14px;color:#a2477f;font-weight:800;font-size:13px}.btn{background:linear-gradient(110deg,#ee6cad,#b36dd5);color:white;border:0;border-radius:16px;padding:13px 22px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 14px #c778b130}.btn:disabled{opacity:.45;cursor:default}.btn.secondary{background:#fae7f3;color:#9b4c7d;box-shadow:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.progress{display:flex;gap:6px;margin-top:16px}.progress>div{flex:1;height:9px;border-radius:10px;background:#ecdce8}.progress>div.done{background:#d66aaf}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:#fff1f8;padding:12px 16px;border-radius:15px;font-weight:800;color:#a74c83}.taskgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.task{background:#fff8fc;border:2px solid #f1d5e6;border-radius:17px;padding:12px 6px;text-align:center}.task.ok{border-color:#70be9b;background:#effcf5}.task.bad{border-color:#e8a1a8;background:#fff1f1}.task label{display:block;color:#9e638b;font-weight:800;font-size:12px}.digits{font-size:23px;line-height:1.6;font-weight:800;margin:8px 0}.task input{width:95%;max-width:110px;padding:9px 3px;text-align:center;border:2px solid #e9cadd;border-radius:10px;font-size:18px}.callout{background:#f9e7f3;border-radius:16px;padding:16px;margin:18px 0;line-height:1.6}.secret{font-size:clamp(24px,5vw,42px);text-align:center;background:#fff1f8;border-radius:20px;padding:24px 8px;font-weight:900;letter-spacing:2px}.secret input{font-size:24px;width:110px;text-align:center;border-radius:12px;border:2px solid #e8b5d2;padding:8px}.symbolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:450px;margin:16px auto}.symbol{min-height:82px;border:2px solid #f0cde3;background:#fff4fa;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px}.symbol.small{font-size:29px;min-height:64px;cursor:pointer}.symbol:disabled{opacity:.32}.memory-answer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:450px;margin:16px auto}.memory-answer>div{min-height:65px;border-radius:14px;background:#f9e7f3;display:grid;place-items:center;font-size:30px}.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.score{background:#fbeaf4;border-radius:18px;padding:20px}.score strong{font-size:30px;color:#b94d91;display:block}.score span{font-size:13px;color:#785a70}.foot{text-align:center;margin-top:20px;color:#a96893;font-size:12px}@media(max-width:650px){.taskgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cat{font-size:66px}.hero{padding:22px}.symbol{min-height:65px;font-size:29px}.symbol.small{min-height:56px;font-size:26px}.scoregrid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><span>♥ MATH CHALLENGE STUDIO · SIX SEVEN</span><span id="clock">⏱ 00:00</span></div><header class="hero"><div><div class="pill">🎃 ДОМАШНЯЯ МИССИЯ ДЛЯ ПОЛИНЫ</div><h1>HALLOWEEN<br><span>MEMORY QUEST</span></h1><p>Секретный пароль · Абакус · Ментальный счёт · Испытание памяти</p></div><div class="cat">🐱🎃</div></header><div class="progress" id="progress"></div><main class="panel" id="app"><h2>Загружаем миссию…</h2></main><div class="foot">Math Challenge Studio · С любовью к знаниям ♥</div></div><script>
const AB=[[49, 88, 51], [79, 38, 11], [95, 83, 28], [67, 48, -15], [24, 58, 17], [27, 58, -83], [31, 52, -13], [25, 54, 48], [76, 84, -20], [78, -66, 48]];const MENT=[[[1, 2, 1], [4, -3, 1], [3, 1, -3], [2, 2, -4], [4, -4, 2], [3, -2, 3], [3, -3, 1], [1, -1, 4], [1, 1, -1], [1, 3, -1]], [[4, -1, -1], [3, -1, -2], [2, -1, 1], [2, 2, -1], [3, 1, -2], [3, -1, 2], [4, -2, 1], [1, 3, -2], [2, 2, -4], [3, -2, 1]]];
const $=id=>document.getElementById(id),sum=a=>a.reduce((x,y)=>x+y,0),fmt=ms=>{let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};let stage=0,stageStart=Date.now(),times=[],errors={ab:0,m0:0,m1:0,mem:0,code:0},first={},done={},values={},flags={},memRound=0,memShown=false,memSeq=[],memPicked=[],memReady=false,memStart=0,memTimes=[],memRetries=0,codeAttempts=0,codeSkipped=false;const STAGES=['Пароль','Абакус','Ментально 1','Ментально 2','Память','Итог'];const ICONS=['🎃','🦇','🔮','👻','🐈‍⬛','🕸️','🍬','🧪','🦉','🧙‍♀️','🕯️','🗝️'];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function tick(){if(stage<5)$('clock').textContent='⏱ '+fmt(Date.now()-stageStart)}setInterval(tick,500);function nav(){ $('progress').innerHTML=STAGES.map((s,i)=>'<div title="'+s+'" class="'+(stage>i?'done':'')+'"></div>').join('')}function next(){times[stage]=Date.now()-stageStart;stage++;stageStart=Date.now();render();window.scrollTo(0,0)}function render(){nav();if(stage===0)intro();else if(stage>=1&&stage<=3)tasks();else if(stage===4)memory();else result()}function intro(){$('app').innerHTML=`<span class="pill">🔐 Испытание 1 из 4</span><h2 style="margin-top:14px">Вход в секретную лабораторию</h2><p class="muted">Котик оставил шифр. Найди закономерность, чтобы открыть дверь в домашнюю миссию.</p><div class="secret">3 · 6 · 11 · 18 · 27 · ?</div><p class="muted">Какое число должно быть следующим?</p><div class="actions"><input id="codeinput" type="number" inputmode="numeric" placeholder="Ответ" style="font-size:21px;width:125px;border:2px solid #edc7dd;border-radius:13px;padding:10px" onkeydown="if(event.key==='Enter')checkCode()"><button class="btn" onclick="checkCode()">Открыть замок 🔓</button></div><div id="feedback" aria-live="polite"></div>`}
function checkCode(){let v=$('codeinput').value.trim();if(!v){$('feedback').innerHTML='<div class="callout">Сначала введи число, которое продолжает последовательность.</div>';return}if(Number(v)===38){$('feedback').innerHTML='<div class="callout">✨ Пароль верный! Разница растет на 2: +3, +5, +7, +9, +11.</div><button class="btn" onclick="next()">Перейти к абакусу →</button>';$('codeinput').disabled=true;return}errors.code++;codeAttempts++;let tips=['Посмотри, на сколько увеличивается каждое следующее число.','Разницы между числами: +3, +5, +7, +9. Какое прибавление будет следующим?','Следующее прибавление +11. Попробуй прибавить его к 27.'];let tip=tips[Math.min(codeAttempts-1,2)];$('feedback').innerHTML='<div class="callout"><strong>Подсказка '+Math.min(codeAttempts,3)+'/3:</strong> '+tip+'</div>'+(codeAttempts>=3?'<button class="btn secondary" onclick="skipCode()">Перейти к тренировке без пароля →</button>':'')}
function skipCode(){codeSkipped=true;next()}
function data(){return stage===1?AB:MENT[stage-2]}function key(){return stage===1?'ab':'m'+(stage-2)}function tasks(){let k=key(),d=data();if(!values[k]){values[k]=Array(10).fill('');flags[k]=Array(10).fill('')}let good=flags[k].filter(x=>x==='ok').length;$('app').innerHTML=`<span class="pill">${stage===1?'🧮 Испытание 2':'🧠 Испытание 3'} · ${stage===1?'Абакус':stage===2?'Ментальный подход 1':'Ментальный подход 2'}</span><h2 style="margin-top:14px">${stage===1?'10 примеров на абакусе':'10 примеров ментально'}</h2><p class="muted">${stage===1?'В12-2, стр. 34, № 4, первая строка. Используй настоящий абакус.':'Считай ментально, представляя абакус.'} Сначала реши все столбики, затем проверь ответы. Ошибки можно исправить.</p><div class="stats"><div class="stat">Верно: ${good}/10</div><div class="stat">Неверных попыток: ${errors[k]}</div></div><div class="taskgrid">${d.map((a,i)=>`<div class="task ${flags[k][i]}"><label>№ ${i+1} ${flags[k][i]==='ok'?'✓':''}</label><div class="digits">${a.map(n=>n<0?'−'+Math.abs(n):n).join('<br>')}</div><input aria-label="Ответ ${i+1}" type="number" inputmode="numeric" value="${values[k][i]}" ${flags[k][i]==='ok'?'disabled':''} oninput="values['${k}'][${i}]=this.value"></div>`).join('')}</div><div class="actions"><button class="btn" onclick="checkTasks()" ${done[k]?'disabled':''}>Проверить ответы</button>${done[k]?`<button class="btn secondary" onclick="next()">${stage===3?'К испытанию памяти →':'Следующий подход →'}</button>`:''}</div><div class="callout">${first[k]!==undefined?'Результат первой проверки: '+first[k]+'/10. ':''}${done[k]?'Все ответы верны! Можно двигаться дальше.':'Скорость важна, но правильная техника важнее.'}</div>`}function checkTasks(){let k=key(),d=data(),correct=0;for(let i=0;i<10;i++){if(flags[k][i]==='ok'){correct++;continue}let v=String(values[k][i]).trim();if(!v)continue;if(Number(v)===sum(d[i])){flags[k][i]='ok';correct++}else{flags[k][i]='bad';errors[k]++}}if(first[k]===undefined)first[k]=correct;if(correct===10)done[k]=true;tasks()}let memAttempts=0;function setupMemory(){memAttempts=0;memShown=false;memPicked=[];memReady=false;let n=[6,8,9][memRound];memSeq=shuffle(ICONS.slice()).slice(0,n);memStart=Date.now()}function memory(){if(!memSeq.length)setupMemory();let n=memSeq.length;$('app').innerHTML=`<span class="pill">🧩 Испытание 4 · Раунд ${memRound+1}/3</span><h2 style="margin-top:14px">Восстанови секретную последовательность</h2><p class="muted">${memRound<2?'Запомни порядок символов. После исчезновения восстанови его по памяти.':'Запомни расположение девяти символов в сетке 3 × 3. Затем восстанови их позиции.'}</p><div class="stats"><div class="stat">Символов: ${n}</div><div class="stat">Ошибок в памяти: ${errors.mem}</div></div><div id="memoryArea"></div>`;drawMemory()}function drawMemory(){let a=$('memoryArea');if(!memShown){a.innerHTML=`<div class="symbolgrid">${memSeq.map(s=>`<div class="symbol">${s}</div>`).join('')}</div><div class="callout">У тебя есть <strong id="countdown">${[12,15,18][memRound]}</strong> секунд, чтобы запомнить расположение.</div><div class="actions"><button class="btn secondary" onclick="hideMemory()">Я запомнила →</button></div>`;let seconds=[12,15,18][memRound];let myRound=memRound;let interval=setInterval(()=>{if(stage!==4||memRound!==myRound||memShown){clearInterval(interval);return}seconds--;let e=$('countdown');if(e)e.textContent=Math.max(seconds,0);if(seconds<=0){clearInterval(interval);hideMemory()}},1000)}else{let remaining=shuffle(memSeq.filter((_,i)=>!memPicked.includes(i)).map((s,i)=>({s,i}))); // draw by actual indexes below
let options=shuffle(memSeq.map((s,i)=>({s,i})).filter(x=>!memPicked.includes(x.i)));a.innerHTML=`<p class="muted">Восстановлено: ${memPicked.length}/${memSeq.length}. Выбирай картинки в исходном порядке.</p><div class="memory-answer">${Array.from({length:memSeq.length},(_,i)=>`<div>${memPicked[i]===undefined?'?':memSeq[memPicked[i]]}</div>`).join('')}</div><div class="symbolgrid">${options.map(x=>`<button class="symbol small" onclick="chooseSymbol(${x.i})">${x.s}</button>`).join('')}</div><div id="memfeedback"></div><div class="actions"><button class="btn secondary" onclick="memPicked=[];drawMemory()">Очистить ответ</button>${memAttempts>0?'<button class="btn secondary" onclick="reviewMemory()">👀 Посмотреть еще раз</button>':''}</div>`;if(memReady)a.innerHTML+='<div class="callout">'+(memAttempts>=2?'Раунд завершен после двух попыток.':'✨ Раунд пройден!')+'</div><div class="actions"><button class="btn" onclick="nextMemory()">'+(memRound===2?'Завершить миссию 🏆':'Следующий раунд →')+'</button></div>'}}function hideMemory(){if(memShown)return;memShown=true;drawMemory()}function reviewMemory(){if(memReady)return;memPicked=[];memShown=false;drawMemory()}function chooseSymbol(i){if(memReady||memPicked.includes(i))return;memPicked.push(i);if(memPicked.length===memSeq.length){if(memPicked.every((x,j)=>x===j)){memReady=true;memTimes.push(Date.now()-memStart)}else{errors.mem++;memRetries++;memAttempts++;memPicked=[];if(memAttempts>=2){memReady=true;memTimes.push(Date.now()-memStart);drawMemory();$('memfeedback').innerHTML='<div class="callout">💗 Две попытки сделаны. Можно посмотреть последовательность еще раз или перейти к следующему испытанию. Это тренировка, а не экзамен!</div><div class="actions"><button class="btn secondary" onclick="showMemoryAnswer()">👀 Показать правильный порядок</button></div>';return}drawMemory();$('memfeedback').innerHTML='<div class="callout">Порядок пока не совпал. У тебя есть еще одна попытка. Нажми «Посмотреть еще раз», чтобы повторно запомнить картинки.</div>';return}}drawMemory()}function showMemoryAnswer(){$('memfeedback').innerHTML='<div class="callout">Правильный порядок: <strong>'+memSeq.join(' → ')+'</strong></div>'}function nextMemory(){if(!memReady)return;if(memRound===2){next()}else{memRound++;memSeq=[];setupMemory();memory()}}function resultText(){return `SIX SEVEN · Halloween Memory Quest 🎃\nПолина\nПароль: ${fmt(times[0])}, неверных попыток ${errors.code}\nАбакус: ${fmt(times[1])}, первая проверка ${first.ab}/10, ошибок ${errors.ab}\nМентально 1: ${fmt(times[2])}, первая проверка ${first.m0}/10, ошибок ${errors.m0}\nМентально 2: ${fmt(times[3])}, первая проверка ${first.m1}/10, ошибок ${errors.m1}\nПамять: ${fmt(times[4])}, неверных попыток ${errors.mem}\nОбщее время: ${fmt(times.reduce((a,b)=>a+b,0))}`}function result(){let total=times.reduce((a,b)=>a+b,0);$('app').innerHTML=`<div style="text-align:center;font-size:70px">🏆🐱🎃</div><h2 style="text-align:center">Полина, миссия выполнена!</h2><p class="muted" style="text-align:center">Ты открыла секретную лабораторию и прошла все испытания!</p><div class="scoregrid">${['Пароль','Абакус','Ментально · 10','Ментально · 10','Память','Общее время'].map((x,i)=>`<div class="score"><strong>${fmt(i===5?total:times[i])}</strong><span>${x}</span></div>`).join('')}</div><div class="callout">🔐 Пароль: ${errors.code} неверных попыток<br>🧮 Абакус: первая проверка ${first.ab}/10, ошибок ${errors.ab}<br>🧠 Ментально: ${first.m0}/10 и ${first.m1}/10, ошибок ${errors.m0+errors.m1}<br>🧩 Память: 3 раунда, неверных попыток ${errors.mem}</div><p class="muted">Покажи педагогу результат: сделай скриншот или нажми «Поделиться».</p><div class="actions"><button class="btn" onclick="shareResult()">📨 Поделиться результатом</button><button class="btn secondary" onclick="copyResult()">📋 Скопировать</button><button class="btn secondary" onclick="location.reload()">Начать заново</button></div>`}function copyResult(){let t=resultText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('Результат скопирован!')).catch(()=>prompt('Скопируй результат:',t));else prompt('Скопируй результат:',t)}function shareResult(){if(navigator.share)navigator.share({text:resultText()}).catch(()=>{});else copyResult()}render();
</script></body></html>
