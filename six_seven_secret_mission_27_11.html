else if(p.kind==='memory')html+=`<p>Найди 6 пар. Открывай по две карточки.</p><div class="memory-grid" id="memory"></div><p class="stats" id="memoryStat"></p><div class="actions"><button class="alt" onclick="resetMemory()">Перемешать заново</button></div>`;
else if(p.kind==='stroop')html+=`<p>Нажимай на <b>цвет букв</b>, а не на написанное слово.</p><div id="stroop"></div>`;
else if(p.kind==='schulte')html+=`<p>Найди числа от 1 до 25 по порядку.</p><div class="schulte" id="schulte"></div><p class="stats" id="schulteStat"></p>`;
else html+=`<p>Отчёт по реально выполненным этапам:</p><pre id="report">${report()}</pre><button onclick="copyReport()">Скопировать отчёт</button>`;
html+=actionRow()+`</div>`;document.getElementById('app').innerHTML=html;timer();if(['swap','cipher','words','recall','maze'].includes(p.kind))extra(p.kind);if(p.kind==='memory')drawMemory();if(p.kind==='stroop')drawStroop();if(p.kind==='schulte')drawSchulte();if(p.kind==='color')drawFlower();if(p.kind==='count')drawCount();if(p.kind==='secret')drawSecret();document.getElementById('answer')?.focus();document.getElementById('countAnswer')?.focus()}
function advance(){const r=get(),p=plan[day][step];r.index++;r.wrong=false;if(r.index>=p.items.length)r.done=true;save();render()}
function check(){const r=get(),p=plan[day][step],v=document.getElementById('answer').value;if(v==='')return;const correct=p.items[r.index].reduce((a,b)=>a+b,0);if(Number(v)===correct){r.correct++;if(!r.wrong)r.first++;advance()}else{r.recounts++;r.wrong=true;save();document.getElementById('feedback').textContent='Попробуй пересчитать ещё раз 💗';document.getElementById('answer').select()}}
function skip(){get().skips++;advance()}
const icons=['🐱','🦊','🐼','🐸','🦋','🐻'];function resetMemory(){const r=get();r.cards=undefined;r.matched=[];r.turns=0;r.done=false;r.started=true;r.seconds=0;save();render()}
function drawMemory(){const r=get();if(!r.cards){r.cards=[...icons,...icons].map((v,i)=>({v,sort:(i*37+Math.random()*100)})).sort((a,b)=>a.sort-b.sort).map(x=>x.v);r.matched=[];r.turns=0;save()}const box=document.getElementById('memory');box.innerHTML=r.cards.map((v,i)=>`<button class="tile ${r.matched.includes(i)||memOpen.includes(i)?'open':''}" onclick="flip(${i})">${r.matched.includes(i)||memOpen.includes(i)?v:'?'}</button>`).join('');document.getElementById('memoryStat').textContent=`Найдено ${r.matched.length/2} из 6 пар · Ходов ${r.turns}`;if(r.done)document.getElementById('memoryStat').textContent+=' · Готово!'}
function flip(i){const r=get();if(memLock||r.done||r.matched.includes(i)||memOpen.includes(i))return;if(!r.started){r.started=true;timer()}memOpen.push(i);drawMemory();if(memOpen.length===2){r.turns++;if(r.cards[memOpen[0]]===r.cards[memOpen[1]]){r.matched.push(...memOpen);memOpen=[];if(r.matched.length===12)r.done=true;save();drawMemory();if(r.done)stop()}else{memLock=true;setTimeout(()=>{memOpen=[];memLock=false;if(get()===r&&document.getElementById('memory'))drawMemory()},850)}}}
const colors=[['КРАСНЫЙ','#e74a69'],['СИНИЙ','#2585d9'],['ЗЕЛЁНЫЙ','#29a16a'],['ФИОЛЕТОВЫЙ','#a05ac2']];let ci=0;function drawStroop(){const r=get();if(r.done){document.getElementById('stroop').innerHTML=`<div class="note">Готово: ${r.correct} из 10, ошибок ${r.recounts}</div>`;return}if(!r.started){r.started=true;timer()}const word=(r.index*3+1)%4,color=(r.index*7+2)%4;document.getElementById('stroop').innerHTML=`<div class="math"><div style="font-size:clamp(30px,5vw,50px);font-weight:900;color:${colors[color][1]}">${colors[word][0]}</div><p>${r.index+1} из 10</p><div class="actions" style="justify-content:center">${colors.map((c,i)=>`<button class="alt" onclick="stroop(${i},${color})">${c[0]}</button>`).join('')}</div></div>`}
function stroop(i,c){const r=get();if(i===c)r.correct++;else r.recounts++;r.index++;if(r.index>=10)r.done=true;save();render()}
function drawSchulte(){const r=get();if(!r.cards){r.cards=Array.from({length:25},(_,i)=>i+1).sort(()=>Math.random()-.5);r.index=0;save()}const grid=document.getElementById('schulte');grid.innerHTML=r.cards.map(n=>`<button class="${n<=r.index?'done':''}" onclick="hitSchulte(${n})">${n}</button>`).join('');document.getElementById('schulteStat').textContent=r.done?'Готово! Время '+fmt(r.seconds):`Найди: ${r.index+1}`}
function hitSchulte(n){const r=get();if(r.done)return;if(!r.started){r.started=true;timer()}if(n===r.index+1){r.index++;if(r.index===25){r.done=true;stop()}save();drawSchulte()}}

const flowerQ=[[74,-3],[76,-4],[81,-8],[78,-4],[83,-8],[85,-9],[80,-9],[79,-7],[82,-9],[83,-9],[77,-6],[81,-5],[80,-8],[84,-9],[82,-8],[79,-8],[85,-9],[81,-7]];
const flowerPalette=['#f6d542','#f5a440','#ed5c99','#79c85e','#41b8e5','#8870df'];
function drawFlower(){const r=get();if(!r.painted)r.painted={};let petals='';for(let i=0;i<18;i++){const a=i*Math.PI*2/18,deg=i*20,tx=250+158*Math.sin(a),ty=250-158*Math.cos(a),q=flowerQ[i],answer=q[0]+q[1];petals+=`<g transform="translate(${tx} ${ty}) rotate(${deg})"><ellipse cx="0" cy="0" rx="39" ry="82" fill="${r.painted[i]||'#fff9fe'}" stroke="#bd79a8" stroke-width="2" onclick="paint(${i})" style="cursor:pointer"/><text y="-8" text-anchor="middle" font-size="19" font-weight="700" fill="#59364f" pointer-events="none">${q[0]}</text><text y="18" text-anchor="middle" font-size="19" font-weight="700" fill="#59364f" pointer-events="none">${q[1]}</text></g>`}let filled=Object.keys(r.painted).length;document.getElementById('flower').innerHTML=`<p class="stats">Раскрашено ${filled} из 18 лепестков. ${r.recounts?'Исправлений: '+r.recounts:''}</p><div class="actions">${flowerPalette.map((c,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;font-weight:700"><span style="background:${c};display:inline-block;width:23px;height:23px;border-radius:5px"></span>${71+i}</span>`).join('')}</div><svg viewBox="0 0 500 500" style="width:100%;max-width:540px;display:block;margin:auto" role="img" aria-label="Цветок с восемнадцатью лепестками, каждый с примером">${petals}<circle cx="250" cy="250" r="46" fill="#ffe9a4" stroke="#bd79a8" stroke-width="3"/><text x="250" y="258" text-anchor="middle" font-size="23">🌸</text></svg><div class="note">Нажми на лепесток, затем введи ответ в появившемся окне. Правильный ответ автоматически раскрасит лепесток.</div>${filled===18?'<p>🌟 Цветок готов!</p>':''}`;if(filled===18){r.done=true;save();stop()}}
function paint(i){const r=get();if(r.painted?.[i]!==undefined)return;const q=flowerQ[i],v=prompt('Сколько будет '+q[0]+' '+q[1]+'?');if(v===null)return;if(v.trim()==='')return;r.started=true;if(!clockId)timer();if(Number(v)===q[0]+q[1]){r.painted[i]=flowerPalette[q[0]+q[1]-71];r.correct++;r.first++;}else{r.recounts++;alert('Попробуй пересчитать ещё раз. Лепесток пока не раскрашен.')}save();drawFlower()}
function drawCount(){const r=get(),p=plan[day][step];if(r.pos===undefined)r.pos=0;const seq=[...Array(10)].map((_,i)=>(i+1)*p.multiple).concat([...Array(11)].map((_,i)=>(10-i)*p.multiple));const expect=seq[r.pos];document.getElementById('countGame').innerHTML=r.done?`<div class="note">Готово! ${r.correct}/${seq.length}, ошибок ${r.recounts}, время ${fmt(r.seconds)}.</div>`:`<div class="math"><div class="stats">Шаг ${r.pos+1} из ${seq.length} · ${r.pos<10?'Вперёд':'Назад'}</div><h1>${r.pos<10?'→':'←'} ${r.pos===0?'Старт':seq[r.pos-1]} ${r.pos<10?'…':''}</h1><input id="countAnswer" type="number" inputmode="numeric" onkeydown="if(event.key==='Enter')checkCount()" placeholder="Число"><div class="actions" style="justify-content:center"><button onclick="checkCount()">Проверить</button></div><p class="feedback" id="countFeedback"></p></div>`}
function checkCount(){const r=get(),p=plan[day][step],seq=[...Array(10)].map((_,i)=>(i+1)*p.multiple).concat([...Array(11)].map((_,i)=>(10-i)*p.multiple)),el=document.getElementById('countAnswer');if(!el||el.value==='')return;r.started=true;if(!clockId)timer();if(Number(el.value)===seq[r.pos]){r.correct++;r.pos++;if(r.pos===seq.length){r.done=true;stop()}save();render()}else{r.recounts++;save();document.getElementById('countFeedback').textContent='Попробуй ещё раз 💗';el.select()}}
const symbols=['💎','🌙','⭐','🍒','🦋','🎀'];let secretTimer;function drawSecret(){const r=get(),el=document.getElementById('secret');if(!el)return;if(r.done){el.innerHTML=`<div class="note">Код открыт! Верно ${r.correct}/6. Ошибок ${r.recounts}.</div>`;return}if(!r.code){el.innerHTML='<button onclick="showCode()">Запомнить код · 15 секунд</button>';return}if(r.showing){el.innerHTML='<div class="math" style="font-size:clamp(22px,6vw,48px)">'+r.code.map(i=>symbols[i]).join(' ')+'</div>';return}el.innerHTML=`<div class="math"><p>Символ ${r.index+1} из 6</p><div class="actions" style="justify-content:center">${symbols.map((x,i)=>`<button class="alt" style="font-size:30px" onclick="secretHit(${i})">${x}</button>`).join('')}</div></div>`}function showCode(){const r=get();r.code=Array.from({length:6},()=>Math.floor(Math.random()*6));r.started=true;r.showing=true;save();timer();drawSecret();secretTimer=setTimeout(()=>{r.showing=false;save();if(get()===r)drawSecret()},15000)}function secretHit(i){const r=get();if(r.showing||r.done)return;if(i===r.code[r.index])r.correct++;else r.recounts++;r.index++;if(r.index===6){r.done=true;stop()}save();drawSecret()}
function report(){let lines=['SIX SEVEN · Домашняя миссия · 27.11'];for(let d=1;d<=3;d++)for(let i=0;i<plan[d].length;i++){const p=plan[d][i],r=state[`${d}_${i}`];if(!r||!r.started&&!r.done)continue;let result=`День ${d}: ${p.title} | `;if(['ab','mental'].includes(p.kind))result+=`${r.correct}/${p.items.length}; с первой попытки ${r.first}; пересчёты ${r.recounts}; пропуски ${r.skips}; не начато ${p.items.length-r.index}; `;else if(p.kind==='secret')result+=`${r.correct}/6; ошибок ${r.recounts}; `;else if(p.kind==='memory')result+=`пар ${(r.matched||[]).length/2}/6; ходов ${r.turns||0}; `;else if(p.kind==='stroop')result+=`${r.correct}/10; ошибок ${r.recounts}; `;else if(p.kind==='schulte')result+=`${r.index}/25; `;else if(p.kind==='color')result+=`лепестков ${Object.keys(r.painted||{}).length}/18; ошибок ${r.recounts}; `;else if(p.kind==='count')result+=`${r.correct}/21; ошибок ${r.recounts}; `;else if(r.summary)result+=r.summary+'; ';else result+=r.done?'выполнено; ':'начато; ';result+=`время ${fmt(r.seconds)}${r.done?'':' (не завершено)'}`;lines.push(result)}return lines.join('\n')}
function copyReport(){const t=report();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Отчёт скопирован')).catch(()=>fallback(t));else fallback(t)}function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Отчёт скопирован')}

const pool=['🍓','🎧','🦋','📷','🧁','⭐','🍒','🎀','🌙'];const chains=[[3,6,null,12,null,18],[40,36,null,28,null,20],[5,null,15,20,null,30],[30,null,24,21,null,15],[4,8,null,16,null,24],[50,null,40,35,null,25]], solutions=[[9,15],[32,24],[10,25],[27,18],[12,20],[45,30]];const vocab=['облако','ключ','лимон','река','книга','зонт','свеча','мост'];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function extra(kind){const r=get(),e=document.getElementById('extra');if(r.done){e.innerHTML='<div class="note">Готово! '+esc(r.summary||'')+'</div>';return}if(kind==='swap'){let n=[6,8,9][r.index];if(!r.arr){e.innerHTML=`<p>Запомни расположение ${n} предметов. Через 15 секунд два поменяются местами. Выбери оба.</p><button onclick="swapStart()">Начать раунд ${r.index+1}/3</button>`;return}let arr=r.arr.slice();if(!r.showing)[arr[r.pair[0]],arr[r.pair[1]]]=[arr[r.pair[1]],arr[r.pair[0]]];e.innerHTML=`<p>${r.showing?'Запоминай!':'Какие два предмета поменялись местами?'}</p><div class="memory-grid" style="grid-template-columns:repeat(3,1fr)">${arr.map((x,i)=>`<button class="tile ${r.sel?.includes(i)?'open':''}" ${r.showing?'disabled':''} onclick="swapPick(${i})">${x}</button>`).join('')}</div>`;return}if(kind==='cipher'){let j=r.index;e.innerHTML=`<p>Восстанови два пропущенных числа. Задание ${j+1}/6.</p><div class="math" style="font-size:28px;font-weight:800">${chains[j].map(x=>x===null?'?':x).join(' · ')}</div><div class="actions"><input id="c1" type="number" placeholder="1"><input id="c2" type="number" placeholder="2"><button onclick="cipherCheck()">Проверить</button></div><p id="msg"></p>`;return}if(kind==='words'){e.innerHTML=`<h1>ПУТЕШЕСТВИЕ</h1><p>Составь слова из букв этого слова. Не используй букву чаще, чем она встречается в исходном слове. У тебя 5 минут.</p>${r.started?`<textarea id="wordbox" style="width:100%;min-height:130px;font-size:20px" oninput="get().draft=this.value;save()" placeholder="Каждое слово с новой строки">${esc(r.draft||'')}</textarea><p id="left"></p><button onclick="wordsDone()">Завершить</button>`:'<button onclick="start()">Начать · 5 минут</button>'}`;if(r.started)wordTick();return}if(kind==='recall'){e.innerHTML=r.showing?'<div class="math" style="font-size:28px">'+vocab.join(' · ')+'</div>':r.started?'<p>Запиши слова, которые запомнила, через пробел или с новой строки.</p><textarea id="rec" style="width:100%;min-height:100px;font-size:20px"></textarea><button onclick="recDone()">Проверить</button>':'<p>Запомни 8 слов за 30 секунд.</p><button onclick="recStart()">Начать</button>';return}drawMaze()}
function swapStart(){const r=get();r.started=true;r.arr=pool.slice().sort(()=>Math.random()-.5).slice(0,[6,8,9][r.index]);r.pair=[0,1,2,3,4,5,6,7,8].slice(0,r.arr.length).sort(()=>Math.random()-.5).slice(0,2);r.sel=[];r.showing=true;save();render();setTimeout(()=>{r.showing=false;save();if(get()===r)render()},15000)}function swapPick(i){const r=get();if(r.showing||r.done)return;r.sel=r.sel||[];if(r.sel.includes(i))return;r.sel.push(i);if(r.sel.length===2){if(r.sel.every(x=>r.pair.includes(x)))r.correct++;else r.recounts++;r.index++;delete r.arr;r.summary=`Верно ${r.correct}/3`;if(r.index===3)r.done=true}save();render()}
function cipherCheck(){const r=get(),a=document.getElementById('c1').value,b=document.getElementById('c2').value;if(!a||!b)return;r.started=true;if(!clockId)timer();if(+a===solutions[r.index][0]&&+b===solutions[r.index][1]){r.correct++;r.index++;r.summary=`Верно ${r.correct}/6; пересчёты ${r.recounts}`;if(r.index===6)r.done=true;save();render()}else{r.recounts++;save();document.getElementById('msg').textContent='Попробуй ещё раз'}}
function wordTick(){const r=get(),el=document.getElementById('left');if(!el||r.done)return;el.textContent='Осталось '+fmt(Math.max(0,300-r.seconds));if(r.seconds>=300){wordsDone();return}setTimeout(()=>{if(get()===r&&document.getElementById('left')===el)wordTick()},500)}function wordsDone(){const r=get(),w=[...new Set((r.draft||'').toLowerCase().match(/[а-яё]+/g)||[])],base='путешествие';const valid=w.filter(x=>x!==base&&[...x].every(c=>x.split(c).length<=base.split(c).length));r.summary=`Слов по буквам: ${valid.length}; ${valid.join(', ')} (смысл проверяет педагог)`;finish()}
function recStart(){const r=get();r.started=true;r.showing=true;save();render();setTimeout(()=>{r.showing=false;save();if(get()===r)render()},30000)}function recDone(){const r=get(),w=new Set(document.getElementById('rec').value.toLowerCase().match(/[а-яё]+/g)||[]);r.correct=vocab.filter(x=>w.has(x)).length;r.summary=`Вспомнила ${r.correct}/8`;finish()}
const W=17,H=13;function makeMaze(){let g=Array.from({length:H},()=>Array(W).fill(1)),stack=[[1,1]];g[1][1]=0;while(stack.length){let [x,y]=stack.at(-1),opts=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>x+a>0&&x+a<W-1&&y+b>0&&y+b<H-1&&g[y+b][x+a]);if(!opts.length){stack.pop();continue}let [a,b]=opts[Math.floor(Math.random()*opts.length)];g[y+b/2][x+a/2]=g[y+b][x+a]=0;stack.push([x+a,y+b])}return g}function drawMaze(){let r=get(),e=document.getElementById('extra');if(!r.grid){r.grid=makeMaze();r.xy=[1,1];r.keys=[];r.moves=0;save()}let cells=r.grid.flatMap((row,y)=>row.map((v,x)=>`<rect x="${x*24}" y="${y*24}" width="24" height="24" fill="${v?'#a56caa':'#fff4fa'}"/>`)).join('');let marks=[[15,1,'🔑'],[1,11,'🔑'],[15,11,'🚪'],[...r.xy,'🐾']].filter(([x,y,t])=>t!=='🔑'||!r.keys.includes(x+','+y)).map(([x,y,t])=>`<text x="${x*24+12}" y="${y*24+18}" text-anchor="middle" font-size="18">${t}</text>`).join('');e.innerHTML=`<p>Найди два ключа и доберись до двери. Управляй стрелками или кнопками.</p><p>Ключи ${r.keys.length}/2 · Шаги ${r.moves}</p><svg viewBox="0 0 ${W*24} ${H*24}" style="width:100%;max-width:600px;display:block;margin:auto">${cells}${marks}</svg><div class="actions" style="justify-content:center">${[[0,-1,'↑'],[-1,0,'←'],[0,1,'↓'],[1,0,'→']].map(([x,y,t])=>`<button onclick="move(${x},${y})">${t}</button>`).join('')}</div>`}function move(a,b){let r=get();if(r.done)return;let x=r.xy[0]+a,y=r.xy[1]+b;if(r.grid[y]?.[x]!==0)return;if(x===15&&y===11&&r.keys.length<2)return;r.started=true;if(!clockId)timer();r.xy=[x,y];r.moves++;if((x===15&&y===1||x===1&&y===11)&&!r.keys.includes(x+','+y))r.keys.push(x+','+y);r.summary=`Ключи ${r.keys.length}/2; шаги ${r.moves}`;if(x===15&&y===11){finish();return}save();drawMaze()}document.addEventListener('keydown',e=>{if(plan[day][step].kind!=='maze')return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});

render();
</script></body></html>
